                              flex: 1, padding: "4px 8px", fontFamily: FONTS.mono, fontSize: 12,
                              background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 4, color: COLORS.text, outline: "none",
                            }} />
                            {rule.responses.length > 1 && (
                              <button onClick={() => removeResponse(idx, ri)} style={{
                                fontFamily: FONTS.mono, fontSize: 11, padding: "2px 6px", borderRadius: 3,
                                border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer",
                              }}>{"\u00D7"}</button>
                            )}
                          </div>
                        ))}
                        <button onClick={() => addResponse(idx)} style={{
                          fontFamily: FONTS.mono, fontSize: 11, padding: "3px 8px", borderRadius: 3, marginTop: 2,
                          border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer",
                        }}>+ response</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}



const TINY_TRANSFORMER = (() => {
  const vocab = ["the","cat","sat","on","mat","dog","ran","to","a","big","small","red","blue","house","park","happy","is","was","and","very"];
  const dim = 8;
  const rng = ((s) => { let x = s; return () => { x = (x * 16807) % 2147483647; return (x / 2147483647) - 0.5; }; })(42);
  const embeddings = {"the":[.1,.2,0,.1,0,0,.3,.1],"a":[.1,.2,0,.1,0,0,.2,.15],"cat":[.8,-.3,.6,.1,.7,0,-.2,.5],"dog":[.7,-.3,.5,.1,.8,0,-.1,.4],"sat":[0,.5,-.3,.6,0,.4,0,-.2],"ran":[0,.6,-.2,.5,0,.5,.1,-.3],"on":[0,.1,.3,.8,0,0,.2,0],"to":[0,.1,.2,.7,0,0,.3,.1],"mat":[.3,-.1,.2,.2,.1,0,-.3,.6],"big":[0,0,.7,-.2,0,0,0,.8],"small":[0,0,.6,-.2,0,0,0,-.7],"red":[0,0,.5,-.1,0,0,-.4,.3],"blue":[0,0,.5,-.1,0,0,-.5,.2],"house":[.4,-.2,.3,.3,.2,0,-.2,.7],"park":[.3,-.1,.2,.4,.3,0,-.1,.5],"happy":[0,0,.1,0,0,.8,.6,0],"is":[0,.3,-.1,.4,0,.2,.1,0],"was":[0,.3,-.1,.4,0,.1,0,-.1],"and":[.1,.1,0,.3,0,0,.4,0],"very":[0,0,.4,0,0,.3,.2,.1]};
  const Wq=[],Wk=[],Wv=[];
  for(let i=0;i<dim;i++){Wq.push(Array.from({length:dim},(_,j)=>(i===j?.8:0)+rng()*.2));Wk.push(Array.from({length:dim},(_,j)=>(i===j?.8:0)+rng()*.2));Wv.push(Array.from({length:dim},(_,j)=>(i===j?.7:0)+rng()*.3));}
  return{vocab,dim,embeddings,Wq,Wk,Wv};
})();
function transformerPredict(inputWords){const{vocab,dim,embeddings,Wq,Wk,Wv}=TINY_TRANSFORMER;const tokens=inputWords.filter(w=>embeddings[w]);if(!tokens.length)return null;const n=tokens.length;const embs=tokens.map((t,pos)=>{const e=[...embeddings[t]];for(let i=0;i<dim;i++)e[i]+=.1*Math.sin(pos/Math.pow(10,(2*i)/dim));return e;});function mv(M,v){return M.map(r=>r.reduce((s,w,i)=>s+w*v[i],0));}const Q=embs.map(e=>mv(Wq,e)),K=embs.map(e=>mv(Wk,e)),V=embs.map(e=>mv(Wv,e));const lQ=Q[n-1];const sc=K.map(k=>k.reduce((s,v,i)=>s+lQ[i]*v,0)/Math.sqrt(dim));const mS=Math.max(...sc);const eS=sc.map(s=>Math.exp(s-mS));const sE=eS.reduce((a,b)=>a+b,0);const att=eS.map(e=>e/sE);const ctx=new Array(dim).fill(0);for(let i=0;i<n;i++)for(let d=0;d<dim;d++)ctx[d]+=att[i]*V[i][d];const logits=vocab.map(w=>{const e=embeddings[w];return{word:w,logit:e.reduce((s,v,i)=>s+v*ctx[i],0)};});const mL=Math.max(...logits.map(l=>l.logit));const eL=logits.map(l=>Math.exp(l.logit-mL));const sL=eL.reduce((a,b)=>a+b,0);return{tokens,attention:tokens.map((t,i)=>({token:t,weight:att[i]})),predictions:logits.map((l,i)=>({word:l.word,prob:eL[i]/sL})).sort((a,b)=>b.prob-a.prob).slice(0,8)};}

// ============================================================
// UNIFIED PIPELINE: ONE TEXT, FOUR MODELS
// ============================================================
//
// Shows how the same text gets decomposed into a model (training)
// and used for next-token prediction (inference) across all 4 approaches.

const PIPELINE_PRESETS = [
  "the king sat on the golden throne while the queen watched",
  "the cat sat on the mat and the dog ran to the park",
  "she walked to the big red house near the old green park",
];

function UnifiedPipeline() {
  const [inputText, setInputText] = useState(PIPELINE_PRESETS[0]);
  const [phase, setPhase] = useState(0); // 0=input, 1=markov, 2=w2v, 3=transformer, 4=rlhf, 5=compare
  const [isAnimating, setIsAnimating] = useState(false);
  const [animProgress, setAnimProgress] = useState(0);

  // Derive word-level data from input
  const data = useMemo(() => {
    const words = inputText.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
    const vocab = [...new Set(words)];
    const lastWord = words[words.length - 1];
    const prefix = words.slice(0, -1);

    // ── Markov: word-level bigram counts ──
    const bigrams = {};
    for (let i = 0; i < words.length - 1; i++) {
      const ctx = words[i], next = words[i + 1];
      if (!bigrams[ctx]) bigrams[ctx] = {};
      bigrams[ctx][next] = (bigrams[ctx][next] || 0) + 1;
    }
    // Normalize
    const markovProbs = {};
    for (const ctx in bigrams) {
      const total = Object.values(bigrams[ctx]).reduce((a, b) => a + b, 0);
      markovProbs[ctx] = {};
      for (const next in bigrams[ctx]) {
        markovProbs[ctx][next] = bigrams[ctx][next] / total;
      }
    }
    // Markov prediction from second-to-last word
    const markovCtx = prefix.length > 0 ? prefix[prefix.length - 1] : null;
    const markovPred = markovCtx && markovProbs[markovCtx]
      ? Object.entries(markovProbs[markovCtx]).map(([w, p]) => ({ word: w, prob: p })).sort((a, b) => b.prob - a.prob).slice(0, 6)
      : [];

    // ── Word2Vec: context average ──
    const w2vContextVecs = prefix
      .map(w => WORD_DATA.find(d => d.w === w))
      .filter(Boolean);
    let w2vPred = [];
    if (w2vContextVecs.length > 0) {
      const dim = w2vContextVecs[0].v.length;
      const avg = new Array(dim).fill(0);
      for (const d of w2vContextVecs) for (let i = 0; i < dim; i++) avg[i] += d.v[i];
      for (let i = 0; i < dim; i++) avg[i] /= w2vContextVecs.length;
      const exclude = new Set(prefix);
      const sims = WORD_DATA.filter(w => !exclude.has(w.w))
        .map(w => ({ word: w.w, sim: cosineSim(avg, w.v) }))
        .sort((a, b) => b.sim - a.sim).slice(0, 6);
      const temps = sims.map(s => s.sim * 5);
      const maxT = Math.max(...temps);
      const exps = temps.map(t => Math.exp(t - maxT));
      const sumE = exps.reduce((a, b) => a + b, 0);
      w2vPred = sims.map((s, i) => ({ word: s.word, prob: exps[i] / sumE }));
    }

    // ── Transformer: simplified attention ──
    const tVocab = TINY_TRANSFORMER.vocab;
    const tTokens = prefix.filter(w => TINY_TRANSFORMER.embeddings[w]);
    let transPred = [];
    let transAttention = [];
    if (tTokens.length > 0) {
      const result = transformerPredict(tTokens);
      if (result) {
        transPred = result.predictions.slice(0, 6);
        transAttention = result.attention;
      }
    }

    // ── RLHF: transformer + reward re-ranking ──
    // Simulate reward scores: boost "safe" words, penalize potentially harmful patterns
    const safeWords = new Set(["the", "a", "is", "was", "happy", "park", "house", "big", "small", "very", "and", "to"]);
    let rlhfPred = transPred.map(p => ({
      ...p,
      baseProb: p.prob,
      reward: safeWords.has(p.word) ? 0.7 + Math.random() * 0.2 : 0.2 + Math.random() * 0.3,
    }));
    // Blend: 40% base + 60% reward
    const blendAlpha = 0.6;
    rlhfPred = rlhfPred.map(p => ({
      ...p,
      prob: (1 - blendAlpha) * p.baseProb + blendAlpha * p.reward,
    }));
    // Re-normalize
    const rlhfSum = rlhfPred.reduce((s, p) => s + p.prob, 0) || 1;
    rlhfPred = rlhfPred.map(p => ({ ...p, prob: p.prob / rlhfSum }));
    rlhfPred.sort((a, b) => b.prob - a.prob);

    // Top bigram pairs for display
    const topBigrams = [];
    for (let i = 0; i < Math.min(words.length - 1, 8); i++) {
      topBigrams.push([words[i], words[i + 1]]);
    }

    return {
      words, vocab, prefix, lastWord, markovCtx, markovPred, markovProbs, bigrams, topBigrams,
      w2vContextVecs: w2vContextVecs.map(d => d.w), w2vPred,
      tTokens, transPred, transAttention,
      rlhfPred,
    };
  }, [inputText]);

  // Animation timer
  useEffect(() => {
    if (!isAnimating) return;
    const interval = setInterval(() => {
      setAnimProgress(p => Math.min(p + 0.02, 1));
    }, 30);
    return () => clearInterval(interval);
  }, [isAnimating]);

  useEffect(() => {
    if (animProgress >= 1 && isAnimating) setIsAnimating(false);
  }, [animProgress, isAnimating]);

  function advancePhase() {
    if (phase < 5) {
      setPhase(phase + 1);
      if (phase >= 0 && phase < 4) { setAnimProgress(0); setIsAnimating(true); }
    }
  }

  function goBack() {
    if (phase > 0) { setPhase(phase - 1); setIsAnimating(false); setAnimProgress(1); }
  }

  const PHASE_INFO = [
    { title: "Your text", color: "#E8E4DE", desc: "Enter a sentence. The last word will be hidden \u2014 each model will try to predict it." },
    { title: "Markov: count what follows what", color: "#E8A838", desc: "Scan the text for word pairs. For each word, count which words follow it. Prediction = look up the last visible word and return the most common follower." },
    { title: "Word2Vec: meaning from context", color: "#48BFE3", desc: "Each word has a learned position in semantic space. Average the context word positions, then find the nearest word to that average. Word order is ignored." },
    { title: "Transformer: attend to everything", color: "#C4A1FF", desc: "Each token computes attention weights over all other tokens. The last token's attention-weighted context creates a rich, position-aware representation for prediction." },
    { title: "RLHF: align with preferences", color: "#FF6B6B", desc: "Take the transformer's predictions and re-weight them using a reward model trained on human preferences. Likely completions that score low on helpfulness get pushed down." },
    { title: "Compare all four", color: "#72E1A0", desc: "The same text, four different strategies. Notice how each adds something the previous lacked." },
  ];

  const pi = PHASE_INFO[phase];
  const ease = 1 - Math.pow(1 - animProgress, 3);

  // Render a prediction bar chart
  function PredBars({ predictions, color, label, maxProb }) {
    const mp = maxProb || Math.max(...predictions.map(p => p.prob), 0.01);
    return (
      <div>
        {label && <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: color || COLORS.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>}
        {predictions.slice(0, 5).map((p, i) => (
          <div key={p.word} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: i === 0 ? "#fff" : COLORS.text, width: 65, textAlign: "right" }}>{p.word}</div>
            <div style={{ flex: 1, height: 14, background: "rgba(255,255,255,0.04)", borderRadius: 3, overflow: "hidden" }}>
              <div style={{ width: Math.max(2, (p.prob / mp) * 100) + "%", height: "100%", background: i === 0 ? (color || COLORS.text) : (color || COLORS.text) + "50", borderRadius: 3, transition: "width 0.5s" }} />
            </div>
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim, width: 38, textAlign: "right" }}>{(p.prob * 100).toFixed(0)}%</div>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div style={{
      background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
      borderRadius: 12, padding: "24px 28px", marginBottom: 24,
    }}>
      {/* Header */}
      <div style={{ fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text, marginBottom: 4 }}>
        One Text, Four Models
      </div>
      <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim, marginBottom: 20, lineHeight: 1.6 }}>
        The same sentence processed by each approach. Watch how training and prediction change as models grow more sophisticated.
      </div>

      {/* Phase indicator */}
      <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>
        {PHASE_INFO.map((p, i) => (
          <div key={i} onClick={() => { setPhase(i); setAnimProgress(1); setIsAnimating(false); }} style={{
            flex: 1, height: 4, borderRadius: 2, cursor: "pointer",
            background: i <= phase ? p.color : COLORS.border,
            opacity: i <= phase ? 1 : 0.3, transition: "all 0.3s",
          }} />
        ))}
      </div>

      {/* Phase title + description */}
      <div style={{
        display: "flex", alignItems: "center", gap: 12, marginBottom: 12,
        padding: "10px 14px", borderRadius: 6, background: pi.color + "08",
        borderLeft: "3px solid " + pi.color,
      }}>
        <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: pi.color, textTransform: "uppercase", letterSpacing: "0.06em", whiteSpace: "nowrap" }}>
          {phase + 1}/6
        </div>
        <div>
          <div style={{ fontFamily: FONTS.heading, fontSize: 16, color: COLORS.text, marginBottom: 2 }}>{pi.title}</div>
          <div style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.5 }}>{pi.desc}</div>
        </div>
      </div>

      {/* Navigation */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {phase > 0 && <button onClick={goBack} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer" }}>&larr; Back</button>}
        {phase < 5 && <button onClick={advancePhase} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + pi.color, background: pi.color + "15", color: pi.color, cursor: "pointer" }}>{phase === 0 ? "Start \u2192" : "Next Model \u2192"}</button>}
      </div>

      {/* ── PHASE 0: Text input ── */}
      {phase === 0 && (
        <div>
          <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
            {PIPELINE_PRESETS.map((p, i) => (
              <button key={i} onClick={() => setInputText(p)} style={{
                fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px", borderRadius: 4,
                border: "1px solid " + (inputText === p ? "#E8A838" : COLORS.border),
                background: inputText === p ? "#E8A83815" : "transparent",
                color: inputText === p ? "#E8A838" : COLORS.textDim, cursor: "pointer",
              }}>Example {i + 1}</button>
            ))}
          </div>
          <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} style={{
            width: "100%", padding: "10px 14px", fontFamily: FONTS.mono, fontSize: 14, lineHeight: 1.6,
            background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 8, color: COLORS.text, outline: "none",
          }} />
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginTop: 8 }}>
            Task: predict the last word <span style={{ color: "#E8A838" }}>"{data.lastWord}"</span> given: <span style={{ color: COLORS.text }}>"{data.prefix.join(" ")}"</span>
          </div>
        </div>
      )}

      {/* ── Shared sentence display (phases 1-5) ── */}
      {phase >= 1 && (
        <div style={{
          fontFamily: FONTS.mono, fontSize: 14, lineHeight: 2, padding: "10px 14px",
          background: "#08080A", borderRadius: 6, marginBottom: 16, border: "1px solid " + COLORS.border,
        }}>
          {data.prefix.map((w, i) => {
            // Highlight based on phase
            let bg = "transparent", color = COLORS.text, weight = 400;
            if (phase === 1 && i === data.prefix.length - 1) { bg = "#E8A83830"; color = "#E8A838"; weight = 700; } // Markov: last word
            if (phase === 2) { color = WORD_DATA.find(d => d.w === w) ? "#48BFE3" : COLORS.textDim; } // W2V: known words highlighted
            if (phase === 3 && data.transAttention.length > 0) {
              const att = data.transAttention.find(a => a.token === w);
              if (att) { bg = "rgba(196,161,255," + (att.weight * 0.5) + ")"; }
            }
            return (
              <span key={i} style={{
                background: bg, color, fontWeight: weight,
                padding: "2px 4px", borderRadius: 3, transition: "all 0.3s",
              }}>{w} </span>
            );
          })}
          <span style={{
            color: "#08080A", background: pi.color, padding: "2px 8px",
            borderRadius: 3, fontWeight: 700,
          }}>?</span>
        </div>
      )}

      {/* ── PHASE 1: Markov ── */}
      {phase === 1 && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
            Word pairs found in text:
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
            {data.topBigrams.slice(0, Math.max(1, Math.round(data.topBigrams.length * ease))).map(([a, b], i) => (
              <span key={i} style={{
                fontFamily: FONTS.mono, fontSize: 12, padding: "3px 8px", borderRadius: 4,
                background: a === data.markovCtx ? "#E8A83820" : "rgba(255,255,255,0.04)",
                color: a === data.markovCtx ? "#E8A838" : COLORS.textDim,
                border: "1px solid " + (a === data.markovCtx ? "#E8A83840" : "transparent"),
              }}>{a} &rarr; {b}</span>
            ))}
          </div>
          {data.markovPred.length > 0 ? (
            <div>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 6 }}>
                After "<span style={{ color: "#E8A838" }}>{data.markovCtx}</span>", the model saw:
              </div>
              <PredBars predictions={data.markovPred} color="#E8A838" />
            </div>
          ) : (
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
              No predictions available (the second-to-last word was not seen as a bigram prefix).
            </div>
          )}
        </div>
      )}

      {/* ── PHASE 2: Word2Vec ── */}
      {phase === 2 && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
            Context words with embeddings: <span style={{ color: "#48BFE3" }}>{data.w2vContextVecs.join(" + ")}</span>
            {data.w2vContextVecs.length < data.prefix.length && (
              <span style={{ color: COLORS.textDim }}> ({data.prefix.length - data.w2vContextVecs.length} words not in vocabulary)</span>
            )}
          </div>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 12 }}>
            Method: average their vectors &rarr; find nearest word to the mean
          </div>
          {data.w2vPred.length > 0 ? (
            <PredBars predictions={data.w2vPred} color="#48BFE3" />
          ) : (
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
              No context words found in the Word2Vec vocabulary.
            </div>
          )}
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            Note: word order does not affect the prediction. "king the on sat" gives the same result.
          </div>
        </div>
      )}

      {/* ── PHASE 3: Transformer ── */}
      {phase === 3 && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          {data.transAttention.length > 0 ? (
            <div>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
                Attention from prediction position &mdash; which tokens matter most:
              </div>
              <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 70, marginBottom: 16 }}>
                {data.transAttention.map((a, i) => (
                  <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, gap: 3 }}>
                    <div style={{
                      width: "100%", maxWidth: 50, background: "#C4A1FF",
                      opacity: 0.2 + a.weight * 0.8,
                      height: Math.max(3, a.weight * 60), borderRadius: "3px 3px 0 0",
                    }} />
                    <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.text }}>{a.token}</div>
                    <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: "#C4A1FF" }}>{(a.weight * 100).toFixed(0)}%</div>
                  </div>
                ))}
              </div>
              <PredBars predictions={data.transPred} color="#C4A1FF" />
              <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
                Word order matters now. "sat cat the on the" gives different attention weights and different predictions.
              </div>
            </div>
          ) : (
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
              No tokens from the input are in the transformer's 20-word vocabulary ({TINY_TRANSFORMER.vocab.join(", ")}).
            </div>
          )}
        </div>
      )}

      {/* ── PHASE 4: RLHF ── */}
      {phase === 4 && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          {data.rlhfPred.length > 0 ? (
            <div>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
                Transformer predictions re-ranked by reward model (60% reward weight):
              </div>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <PredBars predictions={data.transPred} color="#C4A1FF" label="Before RLHF" />
                </div>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <PredBars predictions={data.rlhfPred} color="#FF6B6B" label="After RLHF" />
                </div>
              </div>
              <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
                The reward model boosts "safe" tokens and penalizes others, shifting the distribution.
              </div>
            </div>
          ) : (
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
              No transformer predictions available to re-rank.
            </div>
          )}
        </div>
      )}

      {/* ── PHASE 5: Compare all ── */}
      {phase === 5 && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 12 }}>
            Predicting next word after: "<span style={{ color: COLORS.text }}>{data.prefix.join(" ")}</span>"
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div style={{ padding: 12, background: "#E8A83808", borderRadius: 8, border: "1px solid #E8A83820" }}>
              <PredBars predictions={data.markovPred.length > 0 ? data.markovPred : [{ word: "(no data)", prob: 0 }]} color="#E8A838" label="Markov (count pairs)" />
            </div>
            <div style={{ padding: 12, background: "#48BFE308", borderRadius: 8, border: "1px solid #48BFE320" }}>
              <PredBars predictions={data.w2vPred.length > 0 ? data.w2vPred : [{ word: "(no data)", prob: 0 }]} color="#48BFE3" label="Word2Vec (meaning)" />
            </div>
            <div style={{ padding: 12, background: "#C4A1FF08", borderRadius: 8, border: "1px solid #C4A1FF20" }}>
              <PredBars predictions={data.transPred.length > 0 ? data.transPred : [{ word: "(no data)", prob: 0 }]} color="#C4A1FF" label="Transformer (attention)" />
            </div>
            <div style={{ padding: 12, background: "#FF6B6B08", borderRadius: 8, border: "1px solid #FF6B6B20" }}>
              <PredBars predictions={data.rlhfPred.length > 0 ? data.rlhfPred : [{ word: "(no data)", prob: 0 }]} color="#FF6B6B" label="RLHF (aligned)" />
            </div>
          </div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
            marginTop: 16, lineHeight: 1.6, padding: "10px 14px",
            background: "rgba(0,0,0,0.2)", borderRadius: 6,
            borderLeft: "3px solid #72E1A040",
          }}>
            <strong style={{ color: COLORS.text }}>The progression:</strong> Markov sees only the previous word.
            Word2Vec sees all context but ignores order. Transformers see everything with attention-weighted order.
            RLHF adds human values on top. Each model builds on the limitations of the last.
          </div>
        </div>
      )}
    </div>
  );
}


function MarkovPlayground({ stageIndex, dispatch, stageProgress }) {
  const stage = STAGES[0];
  const [sourceText, setSourceText] = useState(SAMPLE_TEXTS.pushkin);
  const [order, setOrder] = useState(2);
  const [tokenLevel, setTokenLevel] = useState("chars"); // "chars" | "words"
  const [generated, setGenerated] = useState("");
  const [isGenerating, setIsGenerating] = useState(false);
  const [hoverCell, setHoverCell] = useState(null);
  const canvasRef = useRef(null);
  const genIntervalRef = useRef(null);

  // Prediction game state
  const [gameActive, setGameActive] = useState(false);
  const [gameContext, setGameContext] = useState("");
  const [gameAnswer, setGameAnswer] = useState(null);
  const [gameScore, setGameScore] = useState({ correct: 0, total: 0 });
  const [gameRevealed, setGameRevealed] = useState(false);
  const [gameFeedback, setGameFeedback] = useState(null);

  const matrix = useMemo(() =>
    tokenLevel === "chars" ? buildTransitionMatrix(sourceText, order) : buildWordMatrix(sourceText, order),
  [sourceText, order, tokenLevel]);

  // Character-level bigram matrix for heatmap (always order=1 for visualization)
  const bigramMatrix = useMemo(() => buildTransitionMatrix(sourceText, 1), [sourceText]);

  // Word-level bigram matrix for word table
  const wordBigramMatrix = useMemo(() => buildWordMatrix(sourceText, 1), [sourceText]);
  const wordVocab = useMemo(() => {
    const words = sourceText.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
    return [...new Set(words)];
  }, [sourceText]);

  // Draw heatmap
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const container = canvas.parentElement;
    const w = container.clientWidth;
    const h = Math.min(w, 420);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const chars = "abcdefghijklmnopqrstuvwxyz ".split("");
    const n = chars.length;
    const margin = { top: 30, left: 30, right: 10, bottom: 10 };
    const cellW = (w - margin.left - margin.right) / n;
    const cellH = (h - margin.top - margin.bottom) / n;

    ctx.clearRect(0, 0, w, h);

    // Draw cells
    for (let row = 0; row < n; row++) {
      for (let col = 0; col < n; col++) {
        const from = chars[row];
        const to = chars[col];
        const prob = (bigramMatrix[from] && bigramMatrix[from][to]) || 0;
        const x = margin.left + col * cellW;
        const y = margin.top + row * cellH;

        const intensity = Math.min(prob * 5, 1);
        const isHovered = hoverCell && hoverCell.row === row && hoverCell.col === col;

        if (intensity > 0.01 || isHovered) {
          const r = parseInt(stage.color.slice(1,3), 16);
          const g = parseInt(stage.color.slice(3,5), 16);
          const b = parseInt(stage.color.slice(5,7), 16);
          ctx.fillStyle = isHovered
            ? `rgba(${r},${g},${b},${Math.max(intensity, 0.4)})`
            : `rgba(${r},${g},${b},${intensity * 0.85})`;
          ctx.fillRect(x, y, cellW - 0.5, cellH - 0.5);
        }

        // Highlight row/col on hover
        if (hoverCell && (hoverCell.row === row || hoverCell.col === col) && !(hoverCell.row === row && hoverCell.col === col)) {
          ctx.fillStyle = "rgba(255,255,255,0.03)";
          ctx.fillRect(x, y, cellW - 0.5, cellH - 0.5);
        }
      }
    }

    // Labels
    ctx.font = `${Math.min(cellW * 0.7, 11)}px JetBrains Mono`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < n; i++) {
      const label = chars[i] === " " ? "\u2423" : chars[i];
      const isHighRow = hoverCell && hoverCell.row === i;
      const isHighCol = hoverCell && hoverCell.col === i;
      // Top labels (columns = "to")
      ctx.fillStyle = isHighCol ? stage.color : COLORS.textDim;
      ctx.fillText(label, margin.left + i * cellW + cellW / 2, margin.top / 2);
      // Left labels (rows = "from")
      ctx.fillStyle = isHighRow ? stage.color : COLORS.textDim;
      ctx.fillText(label, margin.left / 2, margin.top + i * cellH + cellH / 2);
    }

    // Hover tooltip
    if (hoverCell) {
      const from = chars[hoverCell.row];
      const to = chars[hoverCell.col];
      const prob = (bigramMatrix[from] && bigramMatrix[from][to]) || 0;
      const fromLabel = from === " " ? "space" : from;
      const toLabel = to === " " ? "space" : to;
      const tooltipText = `P(${toLabel} | ${fromLabel}) = ${(prob * 100).toFixed(1)}%`;
      ctx.font = "12px JetBrains Mono";
      const tw = ctx.measureText(tooltipText).width + 16;
      const tx = Math.min(margin.left + hoverCell.col * cellW, w - tw - 8);
      const ty = Math.max(margin.top + hoverCell.row * cellH - 28, 4);
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.beginPath();
      ctx.roundRect(tx, ty, tw, 22, 4);
      ctx.fill();
      ctx.fillStyle = stage.color;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(tooltipText, tx + 8, ty + 11);
    }
  }, [bigramMatrix, hoverCell, stage.color]);

  const handleCanvasMouseMove = useCallback((e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const w = rect.width;
    const h = rect.height;
    const margin = { top: 30, left: 30, right: 10, bottom: 10 };
    const n = 27;
    const cellW = (w - margin.left - margin.right) / n;
    const cellH = (h - margin.top - margin.bottom) / n;
    const col = Math.floor((x - margin.left) / cellW);
    const row = Math.floor((y - margin.top) / cellH);
    if (row >= 0 && row < n && col >= 0 && col < n) {
      setHoverCell({ row, col });
    } else {
      setHoverCell(null);
    }
  }, []);

  // Text generation with typewriter effect
  const handleGenerate = useCallback(() => {
    if (genIntervalRef.current) clearInterval(genIntervalRef.current);
    const fullText = tokenLevel === "chars"
      ? generateFromMarkov(matrix, order, 300)
      : generateWordMarkov(matrix, order, 50);
    setGenerated("");
    setIsGenerating(true);
    if (tokenLevel === "chars") {
      let i = 0;
      genIntervalRef.current = setInterval(() => {
        if (i >= fullText.length) { clearInterval(genIntervalRef.current); setIsGenerating(false); return; }
        setGenerated(fullText.substring(0, i + 1));
        i++;
      }, 25);
    } else {
      // Word mode: reveal word by word
      const words = fullText.split(" ");
      let i = 0;
      genIntervalRef.current = setInterval(() => {
        if (i >= words.length) { clearInterval(genIntervalRef.current); setIsGenerating(false); return; }
        setGenerated(words.slice(0, i + 1).join(" "));
        i++;
      }, 120);
    }
  }, [matrix, order, tokenLevel]);

  // Cleanup interval on unmount
  useEffect(() => () => { if (genIntervalRef.current) clearInterval(genIntervalRef.current); }, []);

  // Prediction game
  const startNewRound = useCallback(() => {
    if (tokenLevel === "chars") {
      const clean = sourceText.toLowerCase().replace(/[^a-z ]/g, "");
      const startPos = Math.floor(Math.random() * (clean.length - order - 10)) + 5;
      const actualNext = clean[startPos + order];
      setGameContext(clean.substring(Math.max(0, startPos - 15), startPos + order));
      setGameAnswer(actualNext);
    } else {
      const words = sourceText.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
      const startIdx = Math.floor(Math.random() * (words.length - order - 2)) + Math.min(2, words.length - order - 1);
      const ctx = words.slice(startIdx, startIdx + order).join(" ");
      const actualNext = words[startIdx + order];
      // Show a few preceding words for context
      const prefix = words.slice(Math.max(0, startIdx - 3), startIdx + order).join(" ");
      setGameContext(prefix);
      setGameAnswer(actualNext);
    }
    setGameRevealed(false);
    setGameFeedback(null);
  }, [sourceText, order, tokenLevel]);

  const handleGameGuess = useCallback((guess) => {
    if (gameRevealed) return;
    const isCorrect = guess === gameAnswer;
    const newScore = {
      correct: gameScore.correct + (isCorrect ? 1 : 0),
      total: gameScore.total + 1,
    };
    setGameScore(newScore);
    setGameRevealed(true);
    setGameFeedback(isCorrect ? "correct" : "wrong");

    const pct = Math.round((newScore.correct / newScore.total) * 100);
    dispatch({ type: "UPDATE_SCORE", stage: 0, score: pct, attempts: newScore.total });

    if (newScore.total >= 10 && pct >= 60 && !stageProgress.challengeCompleted) {
      setTimeout(() => {
        dispatch({ type: "COMPLETE_CHALLENGE", stage: 0, score: pct });
      }, 1000);
    }
  }, [gameAnswer, gameScore, gameRevealed, dispatch, stageProgress]);

  const predictions = useMemo(() => {
    if (!gameContext) return [];
    if (tokenLevel === "chars") {
      if (gameContext.length < order) return [];
      const ctx = gameContext.substring(gameContext.length - order);
      return getTopPredictions(matrix, ctx, 5);
    } else {
      const ctxWords = gameContext.split(" ");
      const ctx = ctxWords.slice(ctxWords.length - order).join(" ");
      return getTopPredictions(matrix, ctx, 5);
    }
  }, [gameContext, matrix, order, tokenLevel]);

  const chars = "abcdefghijklmnopqrstuvwxyz ".split("");

  // Word choices for word-level prediction game (answer + random distractors)
  const wordChoices = useMemo(() => {
    if (tokenLevel !== "words" || !gameAnswer) return [];
    const distractors = wordVocab.filter(w => w !== gameAnswer).sort(() => Math.random() - 0.5).slice(0, 7);
    return [gameAnswer, ...distractors].sort(() => Math.random() - 0.5);
  }, [gameAnswer, wordVocab, tokenLevel]);

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* Section: Source Text */}
      <div style={{ marginBottom: 32 }}>
        <h2 style={{
          fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text,
          marginBottom: 12,
        }}>Training Text</h2>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          {Object.entries(SAMPLE_TEXTS).map(([key, text]) => (
            <button key={key} onClick={() => setSourceText(text)} style={{
              fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px",
              borderRadius: 4, border: `1px solid ${sourceText === text ? stage.color : COLORS.border}`,
              background: sourceText === text ? stage.colorDim : "transparent",
              color: sourceText === text ? stage.color : COLORS.textDim,
              cursor: "pointer", textTransform: "capitalize",
              transition: "all 0.2s",
            }}>{key}</button>
          ))}
          <button onClick={() => { setSourceText(""); setTimeout(() => { const ta = document.querySelector("textarea"); if (ta) ta.focus(); }, 50); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px",
            borderRadius: 4, border: `1px solid ${!Object.values(SAMPLE_TEXTS).includes(sourceText) ? stage.color : COLORS.border}`,
            background: !Object.values(SAMPLE_TEXTS).includes(sourceText) ? stage.colorDim : "transparent",
            color: !Object.values(SAMPLE_TEXTS).includes(sourceText) ? stage.color : COLORS.textDim,
            cursor: "pointer", transition: "all 0.2s",
          }}>custom</button>
          <div style={{ flex: 1 }} />
          <div style={{ display: "flex", gap: 2, background: COLORS.bgPanel, borderRadius: 4, border: "1px solid " + COLORS.border, overflow: "hidden" }}>
            {["chars", "words"].map(t => (
              <button key={t} onClick={() => { setTokenLevel(t); setGenerated(""); setGameActive(false); }} style={{
                fontFamily: FONTS.mono, fontSize: 11, padding: "5px 12px",
                border: "none", background: tokenLevel === t ? stage.colorDim : "transparent",
                color: tokenLevel === t ? stage.color : COLORS.textDim,
                cursor: "pointer", transition: "all 0.2s",
              }}>{t === "chars" ? "Characters" : "Words"}</button>
            ))}
          </div>
        </div>
        <textarea
          value={sourceText}
          onChange={e => setSourceText(e.target.value)}
          style={{
            width: "100%", height: 100, resize: "vertical",
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 6, padding: 12,
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
            lineHeight: 1.6, outline: "none",
          }}
          placeholder="Type or paste text to analyze..."
        />
      </div>

      {/* Section: Transition Matrix */}
      <div style={{ marginBottom: 32 }}>
        <h2 style={{
          fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text,
          marginBottom: 4,
        }}>Transition Matrix</h2>
        <p style={{
          fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
          marginBottom: 12, lineHeight: 1.5,
        }}>
          {tokenLevel === "chars"
            ? "Each cell shows P(column | row) \u2014 the probability of the column character following the row character. Brighter = higher probability."
            : "For each word, the table shows which words follow it and how often. This is the word-level equivalent of the character heatmap."}
        </p>

        {tokenLevel === "chars" ? (
          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 12,
          }}>
            <canvas
              ref={canvasRef}
              onMouseMove={handleCanvasMouseMove}
              onMouseLeave={() => setHoverCell(null)}
              style={{ width: "100%", cursor: "crosshair" }}
            />
          </div>
        ) : (
          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 14, maxHeight: 360, overflowY: "auto",
          }}>
            {Object.entries(wordBigramMatrix).sort((a, b) => a[0].localeCompare(b[0])).map(([ctx, transitions]) => (
              <div key={ctx} style={{ marginBottom: 10 }}>
                <span style={{ fontFamily: FONTS.mono, fontSize: 13, color: stage.color, fontWeight: 600 }}>{ctx}</span>
                <span style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}> {"\u2192"} </span>
                {Object.entries(transitions).sort((a, b) => b[1] - a[1]).map(([word, prob], i) => (
                  <span key={word} style={{ fontFamily: FONTS.mono, fontSize: 12, marginRight: 8 }}>
                    <span style={{ color: COLORS.text }}>{word}</span>
                    <span style={{ color: COLORS.textDim, fontSize: 11, marginLeft: 3 }}>{(prob * 100).toFixed(0)}%</span>
                  </span>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Section: Text Generator */}
      <div style={{ marginBottom: 32 }}>
        <h2 style={{
          fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text,
          marginBottom: 4,
        }}>Text Generator</h2>
        <p style={{
          fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
          marginBottom: 12, lineHeight: 1.5,
        }}>
          Generate text from the Markov model. Higher n-gram orders use more context, producing more recognizable output.
        </p>
        <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <label style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>N-gram order:</label>
            {[1, 2, 3, 4].map(o => (
              <button key={o} onClick={() => setOrder(o)} style={{
                fontFamily: FONTS.mono, fontSize: 12, width: 28, height: 28,
                borderRadius: 4, border: `1px solid ${order === o ? stage.color : COLORS.border}`,
                background: order === o ? stage.colorDim : "transparent",
                color: order === o ? stage.color : COLORS.textDim,
                cursor: "pointer", transition: "all 0.2s",
              }}>{o}</button>
            ))}
          </div>
          <button onClick={handleGenerate} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "6px 20px",
            borderRadius: 4, border: `1px solid ${stage.color}`,
            background: stage.colorDim, color: stage.color,
            cursor: "pointer", transition: "all 0.2s",
          }}>
            {isGenerating ? "Generating..." : "Generate"}
          </button>
        </div>
        {generated && (
          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 6, padding: 16,
            fontFamily: FONTS.mono, fontSize: 13, color: COLORS.text,
            lineHeight: 1.7, whiteSpace: "pre-wrap", wordBreak: "break-word",
            minHeight: 80,
          }}>
            {generated}
            {isGenerating && <span style={{ animation: "pulse 0.8s infinite", color: stage.color }}>|</span>}
          </div>
        )}
      </div>

      {/* Section: Chain Graph Visualization */}
      <MarkovChainGraph sourceText={sourceText} stageColor={stage.color} />

      {/* Section: Prediction Game */}
      <div style={{ marginBottom: 32 }}>
        <h2 style={{
          fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text,
          marginBottom: 4,
        }}>Prediction Game</h2>
        <p style={{
          fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
          marginBottom: 12, lineHeight: 1.5,
        }}>
          The model looks at the last {tokenLevel === "chars" ? order + " character" + (order > 1 ? "s" : "") : order + " word" + (order > 1 ? "s" : "")} and
          predicts what comes next based on the training text frequencies. Can you beat it?
          Score 60% or higher after 10+ rounds to unlock the next stage.
        </p>

        {!gameActive ? (
          <button onClick={() => { setGameActive(true); startNewRound(); }} style={{
            fontFamily: FONTS.mono, fontSize: 13, padding: "10px 24px",
            borderRadius: 6, border: `1px solid ${stage.color}`,
            background: stage.colorDim, color: stage.color,
            cursor: "pointer",
          }}>Start Prediction Game</button>
        ) : (
          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 20,
          }}>
            {/* Score display */}
            <div style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              marginBottom: 16,
            }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
                Score: <span style={{ color: stage.color }}>{gameScore.correct}/{gameScore.total}</span>
                {gameScore.total > 0 && (
                  <span style={{ marginLeft: 8, color: COLORS.text }}>
                    ({Math.round((gameScore.correct / gameScore.total) * 100)}%)
                  </span>
                )}
              </div>
              {gameScore.total >= 10 && Math.round((gameScore.correct / gameScore.total) * 100) >= 60 && (
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 12, color: "#72E1A0",
                  padding: "4px 10px", background: "rgba(114,225,160,0.1)",
                  borderRadius: 4, border: "1px solid rgba(114,225,160,0.3)",
                }}>Stage 2 Unlocked!</div>
              )}
            </div>

            {/* Step 1: Context — clearly labeled */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                From the training text:
              </div>
              <div style={{
                fontFamily: FONTS.mono, fontSize: 16, color: COLORS.text,
                padding: "12px 14px", background: "rgba(0,0,0,0.3)",
                borderRadius: 6, lineHeight: 1.6,
              }}>
                {tokenLevel === "chars" ? (
                  <span>
                    <span style={{ opacity: 0.4 }}>{gameContext.substring(0, gameContext.length - order)}</span>
                    <span style={{
                      color: stage.color, fontWeight: 700, background: stage.color + "20",
                      padding: "1px 2px", borderRadius: 2,
                    }}>{gameContext.substring(gameContext.length - order).split("").map(c => c === " " ? "\u2423" : c).join("")}</span>
                    <span style={{ color: COLORS.textDim, fontSize: 20, fontWeight: 700 }}> ?</span>
                  </span>
                ) : (
                  <span>
                    {(() => {
                      const ctxWords = gameContext.split(" ");
                      const leading = ctxWords.slice(0, ctxWords.length - order);
                      const key = ctxWords.slice(ctxWords.length - order);
                      return (
                        <span>
                          <span style={{ opacity: 0.4 }}>{leading.join(" ")}{leading.length > 0 ? " " : ""}</span>
                          <span style={{
                            color: stage.color, fontWeight: 700, background: stage.color + "20",
                            padding: "2px 4px", borderRadius: 3,
                          }}>{key.join(" ")}</span>
                          <span style={{ color: COLORS.textDim, fontSize: 20, fontWeight: 700 }}> ?</span>
                        </span>
                      );
                    })()}
                  </span>
                )}
              </div>
            </div>

            {/* Step 2: Model's hint — show what the model sees BEFORE guessing */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                The model's top predictions (from the transition {tokenLevel === "chars" ? "matrix" : "table"}):
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {predictions.length > 0 ? predictions.map(function(p, i) {
                  const label = tokenLevel === "chars" ? (p.ch === " " ? "\u2423" : p.ch) : p.ch;
                  const isAnswer = gameRevealed && p.ch === gameAnswer;
                  return (
                    <div key={p.ch} style={{
                      fontFamily: FONTS.mono, fontSize: 12, padding: "4px 10px", borderRadius: 4,
                      background: isAnswer ? "rgba(114,225,160,0.15)" : "rgba(255,255,255,0.04)",
                      border: "1px solid " + (isAnswer ? "rgba(114,225,160,0.4)" : COLORS.border),
                      color: isAnswer ? "#72E1A0" : COLORS.text,
                    }}>
                      {label} <span style={{ color: stage.color, fontSize: 11 }}>{(p.prob * 100).toFixed(0)}%</span>
                    </div>
                  );
                }) : (
                  <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
                    (no data for this context in the training text)
                  </div>
                )}
              </div>
            </div>

            {/* Step 3: Your guess */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                {gameRevealed ? (gameFeedback === "correct"
                  ? "\u2713 Correct! The actual next " + (tokenLevel === "chars" ? "character" : "word") + " was:"
                  : "\u2717 The actual next " + (tokenLevel === "chars" ? "character" : "word") + " was: " + (gameAnswer === " " ? "\u2423" : gameAnswer)
                ) : "Your guess \u2014 what " + (tokenLevel === "chars" ? "character" : "word") + " comes next?"}
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {tokenLevel === "chars" ? predictions.slice(0, 8).concat(
                  // Add a few random chars not in predictions as distractors
                  chars.filter(c => !predictions.some(p => p.ch === c)).sort(() => Math.random() - 0.5).slice(0, 4).map(c => ({ ch: c, prob: 0 }))
                ).sort(() => Math.random() - 0.5).map(function(p) {
                  const isAnswer = gameRevealed && p.ch === gameAnswer;
                  const label = p.ch === " " ? "\u2423" : p.ch;
                  return (
                    <button key={p.ch} onClick={() => handleGameGuess(p.ch)} disabled={gameRevealed} style={{
                      minWidth: 36, height: 36, borderRadius: 4, padding: "0 8px",
                      border: "1px solid " + (isAnswer ? "#72E1A0" : COLORS.border),
                      background: isAnswer ? "rgba(114,225,160,0.15)" : "transparent",
                      color: isAnswer ? "#72E1A0" : COLORS.text,
                      fontFamily: FONTS.mono, fontSize: 14,
                      cursor: gameRevealed ? "default" : "pointer",
                      opacity: gameRevealed && !isAnswer ? 0.3 : 1,
                      transition: "all 0.15s",
                    }}>{label}</button>
                  );
                }) : wordChoices.map(w => {
                  const isAnswer = gameRevealed && w === gameAnswer;
                  return (
                    <button key={w} onClick={() => handleGameGuess(w)} disabled={gameRevealed} style={{
                      padding: "6px 14px", borderRadius: 4,
                      border: "1px solid " + (isAnswer ? "#72E1A0" : COLORS.border),
                      background: isAnswer ? "rgba(114,225,160,0.15)" : "transparent",
                      color: isAnswer ? "#72E1A0" : COLORS.text,
                      fontFamily: FONTS.mono, fontSize: 13,
                      cursor: gameRevealed ? "default" : "pointer",
                      opacity: gameRevealed && !isAnswer ? 0.3 : 1,
                      transition: "all 0.15s",
                    }}>{w}</button>
                  );
                })}
              </div>
            </div>

            {/* Step 4: Explanation (after reveal) */}
            {gameRevealed && (
              <div style={{
                fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
                lineHeight: 1.6, padding: "10px 14px",
                background: "rgba(0,0,0,0.2)", borderRadius: 6,
                borderLeft: "3px solid " + stage.color + "40", marginBottom: 16,
              }}>
                {tokenLevel === "chars" ? (
                  <span>
                    <strong style={{ color: COLORS.text }}>How the model decided:</strong>{" "}
                    In the training text, after "<span style={{ color: stage.color }}>{gameContext.substring(gameContext.length - order).split("").map(c => c === " " ? "\u2423" : c).join("")}</span>",
                    the character {gameAnswer === " " ? "space" : "'" + gameAnswer + "'"} appeared{" "}
                    {predictions.find(p => p.ch === gameAnswer)
                      ? (predictions.find(p => p.ch === gameAnswer).prob * 100).toFixed(0) + "% of the time."
                      : "rarely or never \u2014 the model would not have predicted this."
                    }
                    {" "}The model does not understand language \u2014 it only counts frequencies.
                  </span>
                ) : (
                  <span>
                    <strong style={{ color: COLORS.text }}>How the model decided:</strong>{" "}
                    After the word{order > 1 ? "s" : ""} "<span style={{ color: stage.color }}>{gameContext.split(" ").slice(-order).join(" ")}</span>",
                    the word "{gameAnswer}" appeared{" "}
                    {predictions.find(p => p.ch === gameAnswer)
                      ? (predictions.find(p => p.ch === gameAnswer).prob * 100).toFixed(0) + "% of the time in the training text."
                      : "rarely or never in the training text."
                    }
                  </span>
                )}
              </div>
            )}

            {/* Next round button */}
            {gameRevealed && (
              <button onClick={startNewRound} style={{
                fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
                borderRadius: 4, border: `1px solid ${stage.color}`,
                background: stage.colorDim, color: stage.color,
                cursor: "pointer",
              }}>Next Round</button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function Word2VecTrainingSim({ stageColor }) {
  const canvasRef = useRef(null);
  const [epoch, setEpoch] = useState(0);
  const [isTraining, setIsTraining] = useState(false);
  const [speed, setSpeed] = useState(1);
  const animRef = useRef(null);
  const positionsRef = useRef(null);

  // Training sentence with context windows
  const trainingSentence = "the king sat on the golden throne while the queen watched from her silver throne";
  const trainWords = trainingSentence.split(" ");
  const windowSize = 2;

  // Initialize random positions
  if (!positionsRef.current) {
    const uniqueWords = [...new Set(trainWords)];
    positionsRef.current = {};
    uniqueWords.forEach(function(w, i) {
      positionsRef.current[w] = {
        x: 0.15 + Math.random() * 0.7,
        y: 0.15 + Math.random() * 0.7,
        // Target positions (where they should cluster)
        tx: 0, ty: 0,
      };
    });
    // Set target positions for semantic clusters
    var targets = {
      the: { tx: 0.5, ty: 0.5 }, king: { tx: 0.7, ty: 0.25 },
      queen: { tx: 0.75, ty: 0.3 }, sat: { tx: 0.35, ty: 0.6 },
      on: { tx: 0.45, ty: 0.55 }, golden: { tx: 0.6, ty: 0.2 },
      throne: { tx: 0.65, ty: 0.25 }, while: { tx: 0.4, ty: 0.45 },
      watched: { tx: 0.3, ty: 0.55 }, from: { tx: 0.42, ty: 0.5 },
      her: { tx: 0.72, ty: 0.35 }, silver: { tx: 0.58, ty: 0.22 },
    };
    for (var w in targets) {
      if (positionsRef.current[w]) {
        positionsRef.current[w].tx = targets[w].tx;
        positionsRef.current[w].ty = targets[w].ty;
      }
    }
  }

  // Current context window highlight
  var contextIdx = epoch % (trainWords.length - windowSize * 2);
  var centerWord = trainWords[contextIdx + windowSize];
  var contextWords = [];
  for (var ci = Math.max(0, contextIdx); ci < Math.min(trainWords.length, contextIdx + windowSize * 2 + 1); ci++) {
    if (ci !== contextIdx + windowSize) contextWords.push(trainWords[ci]);
  }

  // Animation: move words toward targets based on epoch
  useEffect(function() {
    if (!isTraining) return;
    var interval = setInterval(function() {
      setEpoch(function(e) {
        var next = e + 1;
        // Move positions toward targets
        var progress = Math.min(next / 80, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var pos = positionsRef.current;
        for (var w in pos) {
          pos[w].x = pos[w].x + (pos[w].tx - pos[w].x) * 0.02 * speed;
          pos[w].y = pos[w].y + (pos[w].ty - pos[w].y) * 0.02 * speed;
          // Add small jitter
          pos[w].x += (Math.random() - 0.5) * 0.003;
          pos[w].y += (Math.random() - 0.5) * 0.003;
        }
        return next;
      });
    }, 80);
    return function() { clearInterval(interval); };
  }, [isTraining, speed]);

  // Draw
  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 360;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    // Labeled semantic grid
    var mg = { left: 50, bottom: 40, top: 20, right: 20 };
    var pw = w - mg.left - mg.right;
    var ph = h - mg.top - mg.bottom;

    // Grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 0.5;
    for (var i = 0; i <= 8; i++) {
      var gx = mg.left + (i / 8) * pw;
      var gy = mg.top + (i / 8) * ph;
      ctx.beginPath(); ctx.moveTo(gx, mg.top); ctx.lineTo(gx, mg.top + ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mg.left, gy); ctx.lineTo(mg.left + pw, gy); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mg.left, mg.top + ph); ctx.lineTo(mg.left + pw, mg.top + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mg.left, mg.top); ctx.lineTo(mg.left, mg.top + ph); ctx.stroke();

    // Axis labels
    ctx.font = "11px JetBrains Mono";
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.textAlign = "center";
    ctx.fillText("Semantic Dimension 1", mg.left + pw / 2, h - 6);
    ctx.save();
    ctx.translate(10, mg.top + ph / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Semantic Dimension 2", 0, 0);
    ctx.restore();

    // Semantic region labels (emerge as training progresses)
    var regionAlpha = Math.min(epoch / 60, 0.3);
    ctx.font = "11px JetBrains Mono";
    ctx.fillStyle = "rgba(255,255,255," + regionAlpha + ")";
    ctx.textAlign = "center";
    ctx.fillText("royalty", mg.left + pw * 0.65, mg.top + ph * 0.22);
    ctx.fillText("actions", mg.left + pw * 0.3, mg.top + ph * 0.55);
    ctx.fillText("modifiers", mg.left + pw * 0.55, mg.top + ph * 0.18);

    var pos = positionsRef.current;
    if (!pos) return;

    // Helper: map word position to plot coords
    var wpx = function(p) { return mg.left + p.x * pw; };
    var wpy = function(p) { return mg.top + p.y * ph; };

    // Draw connections between context words
    if (centerWord && pos[centerWord]) {
      contextWords.forEach(function(cw) {
        if (pos[cw]) {
          ctx.beginPath();
          ctx.moveTo(wpx(pos[centerWord]), wpy(pos[centerWord]));
          ctx.lineTo(wpx(pos[cw]), wpy(pos[cw]));
          ctx.strokeStyle = stageColor + "30";
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    // Draw words
    var uniqueWords = Object.keys(pos);
    uniqueWords.forEach(function(word) {
      var p = pos[word];
      var px = wpx(p);
      var py = wpy(p);
      var isCenter = word === centerWord;
      var isContext = contextWords.indexOf(word) >= 0;

      // Trail showing movement (faint ghost of initial position when training starts)
      if (epoch > 5 && epoch < 60) {
        var initialDist = Math.sqrt(Math.pow(p.x - p.tx, 2) + Math.pow(p.y - p.ty, 2));
        if (initialDist > 0.05) {
          ctx.beginPath();
          ctx.arc(px, py, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = stageColor + "15";
          ctx.fill();
        }
      }

      ctx.beginPath();
      ctx.arc(px, py, isCenter ? 6 : isContext ? 5 : 3, 0, Math.PI * 2);
      ctx.fillStyle = isCenter ? "#fff" : isContext ? stageColor : stageColor + "80";
      ctx.fill();
      if (isCenter || isContext) {
        ctx.strokeStyle = isCenter ? "#fff" : stageColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.font = (isCenter || isContext ? "600 12px" : "11px") + " JetBrains Mono";
      ctx.fillStyle = isCenter ? "#fff" : isContext ? stageColor : "rgba(255,255,255,0.5)";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(word, px, py - (isCenter ? 10 : 6));
    });

    // Loss curve in corner
    var lossX = w - 140;
    var lossY = 20;
    var lossW = 120;
    var lossH = 50;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(lossX, lossY, lossW, lossH);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.strokeRect(lossX, lossY, lossW, lossH);
    ctx.font = "11px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = "left";
    ctx.fillText("loss", lossX + 4, lossY + 10);
    // Draw loss curve
    ctx.beginPath();
    for (var li = 0; li <= Math.min(epoch, 100); li++) {
      var lx = lossX + (li / 100) * lossW;
      var loss = 2.5 * Math.exp(-li * 0.04) + 0.3 + Math.sin(li * 0.3) * 0.1 * Math.exp(-li * 0.02);
      var ly = lossY + lossH - (loss / 3) * lossH;
      li === 0 ? ctx.moveTo(lx, ly) : ctx.lineTo(lx, ly);
    }
    ctx.strokeStyle = stageColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }, [epoch, centerWord]);

  var handleReset = function() {
    setIsTraining(false);
    setEpoch(0);
    var uniqueWords = [...new Set(trainWords)];
    positionsRef.current = {};
    uniqueWords.forEach(function(w) {
      positionsRef.current[w] = {
        x: 0.15 + Math.random() * 0.7,
        y: 0.15 + Math.random() * 0.7,
        tx: 0, ty: 0,
      };
    });
    var targets = {
      the: { tx: 0.5, ty: 0.5 }, king: { tx: 0.7, ty: 0.25 },
      queen: { tx: 0.75, ty: 0.3 }, sat: { tx: 0.35, ty: 0.6 },
      on: { tx: 0.45, ty: 0.55 }, golden: { tx: 0.6, ty: 0.2 },
      throne: { tx: 0.65, ty: 0.25 }, while: { tx: 0.4, ty: 0.45 },
      watched: { tx: 0.3, ty: 0.55 }, from: { tx: 0.42, ty: 0.5 },
      her: { tx: 0.72, ty: 0.35 }, silver: { tx: 0.58, ty: 0.22 },
    };
    for (var tw in targets) {
      if (positionsRef.current[tw]) {
        positionsRef.current[tw].tx = targets[tw].tx;
        positionsRef.current[tw].ty = targets[tw].ty;
      }
    }
  };

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Watch Training Happen
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        A context window slides over the training text. For each center word, the model adjusts
        embeddings so that words appearing in the same context move closer together in vector space.
        Watch "king" and "queen" cluster near "throne" as training progresses.
      </p>

      {/* Training sentence with highlighted context window */}
      <div style={{
        fontFamily: FONTS.mono, fontSize: 13, color: COLORS.textDim,
        marginBottom: 12, padding: 12, background: COLORS.bgPanel,
        borderRadius: 6, border: "1px solid " + COLORS.border,
        lineHeight: 2, whiteSpace: "pre-wrap",
      }}>
        {trainWords.map(function(w, i) {
          var isCenter = i === contextIdx + windowSize;
          var isCtx = Math.abs(i - (contextIdx + windowSize)) <= windowSize && i !== contextIdx + windowSize;
          return (
            <span key={i} style={{
              color: isCenter ? "#fff" : isCtx ? stageColor : COLORS.textDim,
              fontWeight: isCenter ? 700 : 400,
              background: isCenter ? stageColor + "30" : isCtx ? stageColor + "10" : "transparent",
              padding: isCenter || isCtx ? "2px 4px" : "0 1px",
              borderRadius: 3,
            }}>{w} </span>
          );
        })}
      </div>

      {/* Controls */}
      <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
        <button onClick={function() { setIsTraining(!isTraining); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 18px",
          borderRadius: 4, border: "1px solid " + stageColor,
          background: isTraining ? stageColor + "20" : "transparent",
          color: stageColor, cursor: "pointer",
        }}>{isTraining ? "Pause" : "Train"}</button>
        <button onClick={handleReset} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 14px",
          borderRadius: 4, border: "1px solid " + COLORS.border,
          background: "transparent", color: COLORS.textDim, cursor: "pointer",
        }}>Reset</button>
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginLeft: 8 }}>
          Speed:
        </div>
        {[1, 2, 4].map(function(s) { return (
          <button key={s} onClick={function() { setSpeed(s); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, width: 28, height: 24,
            borderRadius: 3, border: "1px solid " + (speed === s ? stageColor : COLORS.border),
            background: speed === s ? stageColor + "15" : "transparent",
            color: speed === s ? stageColor : COLORS.textDim, cursor: "pointer",
          }}>{s}x</button>
        ); })}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stageColor }}>
          Epoch {epoch}
        </div>
      </div>

      {/* Canvas */}
      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 360 }} />
      </div>

      {/* Explanation */}
      <div style={{
        fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
        marginTop: 12, lineHeight: 1.6,
      }}>
        <strong style={{ color: COLORS.text }}>What you are seeing:</strong> Each word starts at a random position.
        As the context window slides over the text, the model pulls co-occurring words closer together.
        "Golden" and "silver" converge (both modify "throne"). "King" and "queen" cluster (both appear near "throne").
        This is the distributional hypothesis made visible: meaning emerges from context.
      </div>
    </div>
  );
}
