function buildTransitionMatrix(text, order = 1) {
  const clean = text.toLowerCase().replace(/[^a-z ]/g, "");
  const matrix = {};
  for (let i = 0; i < clean.length - order; i++) {
    const ctx = clean.substring(i, i + order);
    const next = clean[i + order];
    if (!matrix[ctx]) matrix[ctx] = {};
    matrix[ctx][next] = (matrix[ctx][next] || 0) + 1;
  }
  // Normalize to probabilities
  for (const ctx in matrix) {
    const total = Object.values(matrix[ctx]).reduce((a, b) => a + b, 0);
    for (const next in matrix[ctx]) {
      matrix[ctx][next] /= total;
    }
  }
  return matrix;
}

function generateFromMarkov(matrix, order, length = 200) {
  const contexts = Object.keys(matrix);
  if (contexts.length === 0) return "";
  let ctx = contexts[Math.floor(Math.random() * contexts.length)];
  let result = ctx;
  for (let i = 0; i < length; i++) {
    const transitions = matrix[ctx];
    if (!transitions) break;
    const r = Math.random();
    let cumulative = 0;
    let nextChar = null;
    for (const [ch, prob] of Object.entries(transitions)) {
      cumulative += prob;
      if (r <= cumulative) { nextChar = ch; break; }
    }
    if (!nextChar) break;
    result += nextChar;
    ctx = result.substring(result.length - order);
  }
  return result;
}

function getTopPredictions(matrix, context, k = 5) {
  const transitions = matrix[context];
  if (!transitions) return [];
  return Object.entries(transitions)
    .sort((a, b) => b[1] - a[1])
    .slice(0, k)
    .map(([ch, prob]) => ({ ch, prob }));
}

// Word-level Markov model
function buildWordMatrix(text, order = 1) {
  const words = text.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
  const matrix = {};
  for (let i = 0; i < words.length - order; i++) {
    const ctx = words.slice(i, i + order).join(" ");
    const next = words[i + order];
    if (!matrix[ctx]) matrix[ctx] = {};
    matrix[ctx][next] = (matrix[ctx][next] || 0) + 1;
  }
  for (const ctx in matrix) {
    const total = Object.values(matrix[ctx]).reduce((a, b) => a + b, 0);
    for (const next in matrix[ctx]) matrix[ctx][next] /= total;
  }
  return matrix;
}

function generateWordMarkov(matrix, order, length = 40) {
  const contexts = Object.keys(matrix);
  if (contexts.length === 0) return "";
  let ctx = contexts[Math.floor(Math.random() * contexts.length)];
  const result = ctx.split(" ");
  for (let i = 0; i < length; i++) {
    const transitions = matrix[ctx];
    if (!transitions) break;
    const r = Math.random();
    let cumulative = 0, nextWord = null;
    for (const [w, prob] of Object.entries(transitions)) {
      cumulative += prob;
      if (r <= cumulative) { nextWord = w; break; }
    }
    if (!nextWord) break;
    result.push(nextWord);
    ctx = result.slice(result.length - order).join(" ");
  }
  return result.join(" ");
}

// ============================================================
// WORD2VEC: SKIP-GRAM WITH NEGATIVE SAMPLING (pure JS)
// ============================================================

function trainWord2Vec(text, opts = {}) {
  const trainDim = opts.dim || 10; // Train in high-D for richer representations
  const displayDim = 2; // Project to 2D for visualization
  const windowSize = opts.windowSize || 2;
  const epochs = opts.epochs || 100;
  const lrStart = opts.learningRate || 0.05;
  const lrEnd = 0.001; // Decay to this
  const negK = opts.negSamples || 5;

  const words = text.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
  const vocab = [...new Set(words)];
  if (vocab.length < 2) return null;
  const idx = {}; vocab.forEach((w, i) => idx[w] = i);
  const V = vocab.length;

  // Random init (two sets: target and context vectors, like original Word2Vec)
  const emb = vocab.map(() => Array.from({ length: trainDim }, () => (Math.random() - 0.5) * 0.1));
  const ctxEmb = vocab.map(() => Array.from({ length: trainDim }, () => 0));

  // Negative sampling distribution: freq^0.75
  const freq = new Array(V).fill(0);
  words.forEach(w => freq[idx[w]]++);
  const fp = freq.map(f => Math.pow(f, 0.75));
  const fpSum = fp.reduce((a, b) => a + b, 0);
  const cumDist = []; let cum = 0;
  for (let i = 0; i < V; i++) { cum += fp[i] / fpSum; cumDist.push(cum); }

  function sampleNeg(exclude) {
    const r = Math.random();
    let lo = 0, hi = V - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cumDist[mid] < r) lo = mid + 1; else hi = mid; }
    return lo === exclude ? (lo + 1) % V : lo;
  }

  // Train with learning rate decay
  const history = [];
  for (let ep = 0; ep < epochs; ep++) {
    const lr = lrStart - (lrStart - lrEnd) * (ep / epochs); // Linear decay
    let loss = 0, pairs = 0;
    for (let i = 0; i < words.length; i++) {
      const ci = idx[words[i]];
      for (let j = Math.max(0, i - windowSize); j <= Math.min(words.length - 1, i + windowSize); j++) {
        if (j === i) continue;
        const cj = idx[words[j]];
        const w = emb[ci], c = ctxEmb[cj];

        // Positive pair
        let dot = 0; for (let d = 0; d < trainDim; d++) dot += w[d] * c[d];
        dot = Math.max(-8, Math.min(8, dot));
        const sig = 1 / (1 + Math.exp(-dot));
        const g = lr * (1 - sig);
        for (let d = 0; d < trainDim; d++) { const wd = w[d]; w[d] += g * c[d]; c[d] += g * wd; }
        loss -= Math.log(sig + 1e-10);
        pairs++;

        // Negative samples
        for (let n = 0; n < negK; n++) {
          const ni = sampleNeg(ci);
          const neg = ctxEmb[ni];
          let nd = 0; for (let d = 0; d < trainDim; d++) nd += w[d] * neg[d];
          nd = Math.max(-8, Math.min(8, nd));
          const ns = 1 / (1 + Math.exp(-nd));
          const ng = lr * ns;
          for (let d = 0; d < trainDim; d++) { const wd = w[d]; w[d] -= ng * neg[d]; neg[d] -= ng * wd; }
          loss -= Math.log(1 - ns + 1e-10);
        }
      }
    }
    history.push(pairs > 0 ? loss / pairs : 0);
  }

  // Project from trainDim to 2D using PCA
  const pca = computePCA(vocab.map((w, i) => ({ v: emb[i] })), displayDim);
  const projected = pca.projected;

  // Normalize projected coords to [-0.85, 0.85]
  for (let d = 0; d < displayDim; d++) {
    let maxAbs = 0;
    for (let i = 0; i < V; i++) maxAbs = Math.max(maxAbs, Math.abs(projected[i][d]));
    if (maxAbs > 0) for (let i = 0; i < V; i++) projected[i][d] = (projected[i][d] / maxAbs) * 0.85;
  }

  return {
    vocab,
    embeddings: projected, // 2D for display
    fullEmbeddings: emb, // 10D for similarity
    wordIdx: idx,
    history,
    wordCount: words.length,
    trainDim,
  };
}


function cosineSim(a, b) {
  let dot = 0, magA = 0, magB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    magA += a[i] * a[i];
    magB += b[i] * b[i];
  }
  return dot / (Math.sqrt(magA) * Math.sqrt(magB) + 1e-10);
}

function vecAdd(a, b) { return a.map((v, i) => v + b[i]); }
function vecSub(a, b) { return a.map((v, i) => v - b[i]); }

function findNearest(targetVec, words, exclude = [], k = 5) {
  return words
    .filter(w => !exclude.includes(w.w))
    .map(w => ({ word: w.w, sim: cosineSim(targetVec, w.v) }))
    .sort((a, b) => b.sim - a.sim)
    .slice(0, k);
}

function solveAnalogy(aWord, bWord, cWord) {
  const a = WORD_DATA.find(w => w.w === aWord);
  const b = WORD_DATA.find(w => w.w === bWord);
  const c = WORD_DATA.find(w => w.w === cWord);
  if (!a || !b || !c) return [];
  const target = vecAdd(vecSub(b.v, a.v), c.v);
  return findNearest(target, WORD_DATA, [aWord, bWord, cWord], 5);
}



function computePCA(words, numComponents) {
  const n = words.length, d = words[0].v.length;
  const vecs = words.map(w => w.v);
  const mean = new Array(d).fill(0);
  for (let i = 0; i < n; i++) for (let j = 0; j < d; j++) mean[j] += vecs[i][j];
  for (let j = 0; j < d; j++) mean[j] /= n;
  const centered = vecs.map(v => v.map((x, j) => x - mean[j]));
  const cov = Array.from({ length: d }, () => new Array(d).fill(0));
  for (let i = 0; i < n; i++)
    for (let j = 0; j < d; j++)
      for (let k = j; k < d; k++) { cov[j][k] += centered[i][j] * centered[i][k]; if (j !== k) cov[k][j] = cov[j][k]; }
  for (let j = 0; j < d; j++) for (let k = 0; k < d; k++) cov[j][k] /= (n - 1);
  const components = [], covWork = cov.map(r => [...r]);
  for (let comp = 0; comp < numComponents; comp++) {
    let vec = Array.from({ length: d }, () => Math.random() - 0.5), eigenvalue = 0;
    for (let iter = 0; iter < 200; iter++) {
      const nv = new Array(d).fill(0);
      for (let j = 0; j < d; j++) for (let k = 0; k < d; k++) nv[j] += covWork[j][k] * vec[k];
      let mag = 0; for (let j = 0; j < d; j++) mag += nv[j] * nv[j]; mag = Math.sqrt(mag);
      if (mag < 1e-10) break; eigenvalue = mag;
      for (let j = 0; j < d; j++) vec[j] = nv[j] / mag;
    }
    components.push({ vector: vec, eigenvalue });
    for (let j = 0; j < d; j++) for (let k = 0; k < d; k++) covWork[j][k] -= eigenvalue * vec[j] * vec[k];
  }
  const projected = centered.map(cv => components.map(pc => { let dot = 0; for (let j = 0; j < d; j++) dot += cv[j] * pc.vector[j]; return dot; }));
  for (let axis = 0; axis < numComponents; axis++) {
    let maxAbs = 0; for (let i = 0; i < n; i++) { const a = Math.abs(projected[i][axis]); if (a > maxAbs) maxAbs = a; }
    const scale = maxAbs > 0 ? 0.85 / maxAbs : 1;
    for (let i = 0; i < n; i++) projected[i][axis] *= scale;
  }
  return { projected, components, mean };
}
const PCA_RESULT = computePCA(WORD_DATA, 2);
WORD_DATA.forEach((w, i) => { w.px = PCA_RESULT.projected[i][0]; w.py = PCA_RESULT.projected[i][1]; });

function softmax(arr) {
  const max = Math.max(...arr);
  const exps = arr.map(x => Math.exp(x - max));
  const sum = exps.reduce((a, b) => a + b);
  return exps.map(x => x / sum);
}

function reducer(state, action) {
  switch (action.type) {
    case "NAVIGATE": {
      return { ...state, currentStage: action.stage };
    }
    case "COMPLETE_CHALLENGE": {
      const newProgress = [...state.stageProgress];
      newProgress[action.stage] = { ...newProgress[action.stage], challengeCompleted: true, challengeScore: action.score };
      const newUnlocked = [...state.unlockedStages];
      if (action.stage < 4) newUnlocked[action.stage + 1] = true;
      return { ...state, stageProgress: newProgress, unlockedStages: newUnlocked };
    }
    case "UPDATE_SCORE": {
      const newProgress = [...state.stageProgress];
      newProgress[action.stage] = { ...newProgress[action.stage], challengeScore: action.score, challengeAttempts: action.attempts };
      return { ...state, stageProgress: newProgress };
    }
    default: return state;
  }
}

const GLOSSARY = {
  "n-gram": "A sequence of N consecutive characters or words used as the context window for prediction.",
  "transition probability": "The likelihood of moving from one state (character/word) to another, learned by counting occurrences.",
  "embedding": "A dense vector representation that encodes a word as a point in continuous space, where distance reflects meaning.",
  "latent space": "The hidden geometric space where embeddings live. Relationships between words become spatial relationships.",
  "distributional hypothesis": "The idea that words appearing in similar contexts tend to have similar meanings.",
  "vector arithmetic": "Mathematical operations on word vectors. e.g. vec(king) - vec(man) + vec(woman) \u2248 vec(queen).",
  "self-attention": "A mechanism where each word in a sentence computes how much to 'attend to' every other word.",
  "query, key, value": "Three projections of each token used in attention. Query asks, Key answers, Value provides content.",
  "positional encoding": "Sinusoidal signals added to embeddings so the model knows word order without recurrence.",
  "softmax": "A function that converts a set of numbers into probabilities (0-1) that sum to 1.",
  "reward model": "A neural network trained on human preference data to score how 'good' a model response is.",
  "alignment": "The process of making a model's behavior match human values and intentions, not just statistical patterns.",
  "PPO": "Proximal Policy Optimization \u2014 the reinforcement learning algorithm used to fine-tune the model against the reward signal.",
  "RLHF": "Reinforcement Learning from Human Feedback \u2014 using human preferences to guide model training.",
  "tokenization": "Splitting text into discrete units (characters, words, or subwords) that the model processes.",
};

function GlossaryTerm({ term, children }) {
  var [showDef, setShowDef] = useState(false);
  var def = GLOSSARY[term.toLowerCase()];
  if (!def) return children || term;
  return (
    <span style={{ position: "relative", display: "inline" }}>

// COMPONENT: MARKOV CHAIN GRAPH VISUALIZATION
// ============================================================

function MarkovChainGraph({ sourceText, stageColor }) {
  const canvasRef = useRef(null);
  const [genPath, setGenPath] = useState([]);
  const [isGenerating, setIsGenerating] = useState(false);
  const animRef = useRef(null);

  // Build character-level bigram for graph
  var clean = (sourceText || "").toLowerCase().replace(/[^a-z ]/g, "");
  var matrix = {};
  for (var i = 0; i < clean.length - 1; i++) {
    var from = clean[i], to = clean[i + 1];
    if (!matrix[from]) matrix[from] = {};
    matrix[from][to] = (matrix[from][to] || 0) + 1;
  }
  // Normalize and find top transitions
  var topTransitions = [];
  var charCounts = {};
  for (var ch in matrix) {
    var total = 0;
    for (var c2 in matrix[ch]) total += matrix[ch][c2];
    charCounts[ch] = total;
    for (var c2 in matrix[ch]) {
      var prob = matrix[ch][c2] / total;
      if (prob > 0.06) topTransitions.push({ from: ch, to: c2, prob: prob });
    }
  }

  // Layout: arrange frequent characters in a circle
  var sortedChars = Object.keys(charCounts).sort(function(a, b) { return charCounts[b] - charCounts[a]; });
  var displayChars = sortedChars.slice(0, 14);
  var charPositions = {};
  displayChars.forEach(function(ch, i) {
    var angle = (i / displayChars.length) * Math.PI * 2 - Math.PI / 2;
    charPositions[ch] = { x: 0.5 + 0.35 * Math.cos(angle), y: 0.5 + 0.35 * Math.sin(angle) };
  });

  var handleGenerate = function() {
    if (animRef.current) clearInterval(animRef.current);
    var path = [];
    var contexts = Object.keys(matrix);
    var current = contexts[Math.floor(Math.random() * contexts.length)];
    path.push(current);
    for (var gi = 0; gi < 40; gi++) {
      var transitions = matrix[current];
      if (!transitions) break;
      var r = Math.random(), cum = 0;
      var totalT = 0;
      for (var t in transitions) totalT += transitions[t];
      for (var t in transitions) {
        cum += transitions[t] / totalT;
        if (r <= cum) { current = t; break; }
      }
      path.push(current);
    }
    setGenPath([]);
    setIsGenerating(true);
    var idx = 0;
    animRef.current = setInterval(function() {
      if (idx >= path.length) {
        clearInterval(animRef.current);
        setIsGenerating(false);
        return;
      }
      setGenPath(function(prev) { return path.slice(0, idx + 1); });
      idx++;
    }, 120);
  };

  useEffect(function() { return function() { if (animRef.current) clearInterval(animRef.current); }; }, []);

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 380;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    // Draw transition arcs
    topTransitions.forEach(function(t) {
      if (!charPositions[t.from] || !charPositions[t.to]) return;
      var x1 = charPositions[t.from].x * w, y1 = charPositions[t.from].y * h;
      var x2 = charPositions[t.to].x * w, y2 = charPositions[t.to].y * h;

      // Check if this arc is part of the current generation path
      var isActive = false;
      if (genPath.length > 1) {
        for (var pi = genPath.length - 2; pi < genPath.length - 1; pi++) {
          if (genPath[pi] === t.from && genPath[pi + 1] === t.to) isActive = true;
        }
      }

      // Curved arc
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      var dx = x2 - x1, dy = y2 - y1;
      var nx = -dy * 0.15, ny = dx * 0.15;
      var cx = mx + nx, cy = my + ny;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.strokeStyle = isActive ? stageColor : stageColor + (Math.round(t.prob * 60) < 16 ? "0" : "") + Math.round(t.prob * 60).toString(16);
      ctx.lineWidth = isActive ? 3 : Math.max(0.5, t.prob * 4);
      ctx.stroke();

      // Arrowhead
      var at = 0.85;
      var ax = (1 - at) * (1 - at) * x1 + 2 * (1 - at) * at * cx + at * at * x2;
      var ay = (1 - at) * (1 - at) * y1 + 2 * (1 - at) * at * cy + at * at * y2;
      var at2 = 0.83;
      var ax2 = (1 - at2) * (1 - at2) * x1 + 2 * (1 - at2) * at2 * cx + at2 * at2 * x2;
      var ay2 = (1 - at2) * (1 - at2) * y1 + 2 * (1 - at2) * at2 * cy + at2 * at2 * y2;
      var angle = Math.atan2(ay - ay2, ax - ax2);
      var hl = 6;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - hl * Math.cos(angle - 0.4), ay - hl * Math.sin(angle - 0.4));
      ctx.lineTo(ax - hl * Math.cos(angle + 0.4), ay - hl * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fillStyle = isActive ? stageColor : stageColor + "40";
      ctx.fill();
    });

    // Draw character nodes
    displayChars.forEach(function(ch) {
      var p = charPositions[ch];
      var px = p.x * w, py = p.y * h;
      var isCurrent = genPath.length > 0 && genPath[genPath.length - 1] === ch;
      var freq = (charCounts[ch] || 1) / (charCounts[sortedChars[0]] || 1);
      var radius = 14 + freq * 10;

      // Glow for current
      if (isCurrent) {
        ctx.beginPath();
        ctx.arc(px, py, radius + 8, 0, Math.PI * 2);
        ctx.fillStyle = stageColor + "20";
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fillStyle = isCurrent ? stageColor + "40" : "rgba(255,255,255,0.04)";
      ctx.fill();
      ctx.strokeStyle = isCurrent ? stageColor : stageColor + "50";
      ctx.lineWidth = isCurrent ? 2 : 1;
      ctx.stroke();

      ctx.font = "600 14px JetBrains Mono";
      ctx.fillStyle = isCurrent ? "#fff" : COLORS.text;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ch === " " ? "\u2423" : ch, px, py);
    });

    // Generated text display
    if (genPath.length > 0) {
      var genText = genPath.join("");
      ctx.font = "13px JetBrains Mono";
      ctx.fillStyle = stageColor;
      ctx.textAlign = "left";
      var displayText = genText.length > 50 ? "..." + genText.slice(-50) : genText;
      ctx.fillText(displayText, 10, h - 12);
    }
  }, [topTransitions.length, genPath, displayChars.join(",")]);

  return (
    <div style={{ marginBottom: 32 }}>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        The Markov Chain
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 12, lineHeight: 1.5 }}>
        Each circle is a character state. Arcs show the most likely transitions, with thickness proportional to probability.
        Click "Walk the Chain" to watch the model generate text by randomly following these arcs.
      </p>
      <button onClick={handleGenerate} style={{
        fontFamily: FONTS.mono, fontSize: 12, padding: "7px 18px", marginBottom: 10,
        borderRadius: 4, border: "1px solid " + stageColor,
        background: isGenerating ? stageColor + "20" : "transparent",
        color: stageColor, cursor: "pointer",
      }}>{isGenerating ? "Walking..." : "Walk the Chain"}</button>
      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 380 }} />
      </div>
    </div>
  );
}

function NeuralNetworkViz({ config, stageColor, label }) {
  // config: { layers: [n1, n2, ...], labels: [...], activations: [[...], ...], weights: bool }
  var canvasRef = useRef(null);
  var [activeLayer, setActiveLayer] = useState(-1);
  var [animStep, setAnimStep] = useState(0);
  var [isAnimating, setIsAnimating] = useState(false);

  useEffect(function() {
    if (!isAnimating) return;
    var interval = setInterval(function() {
      setAnimStep(function(s) {
        if (s >= config.layers.length - 1) { setIsAnimating(false); return 0; }
        return s + 1;
      });
    }, 800);
    return function() { clearInterval(interval); };
  }, [isAnimating]);

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 280;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    var layers = config.layers;
    var nLayers = layers.length;
    var layerX = [];
    var margin = { left: 60, right: 60, top: 30, bottom: 40 };
    var plotW = w - margin.left - margin.right;
    var plotH = h - margin.top - margin.bottom;

    for (var li = 0; li < nLayers; li++) {
      layerX.push(margin.left + (li / (nLayers - 1)) * plotW);
    }

    // Draw connections first
    for (var li = 0; li < nLayers - 1; li++) {
      var x1 = layerX[li], x2 = layerX[li + 1];
      var n1 = layers[li], n2 = layers[li + 1];
      var activated = isAnimating && animStep > li;
      for (var ni = 0; ni < n1; ni++) {
        var y1 = margin.top + ((ni + 0.5) / n1) * plotH;
        for (var nj = 0; nj < n2; nj++) {
          var y2 = margin.top + ((nj + 0.5) / n2) * plotH;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = activated ? stageColor + "35" : "rgba(255,255,255,0.04)";
          ctx.lineWidth = activated ? 1 : 0.5;
          ctx.stroke();
        }
      }
    }

    // Draw neurons
    for (var li = 0; li < nLayers; li++) {
      var x = layerX[li];
      var n = layers[li];
      var activated = isAnimating ? animStep >= li : true;
      var activations = config.activations ? config.activations[li] : null;

      for (var ni = 0; ni < n; ni++) {
        var y = margin.top + ((ni + 0.5) / n) * plotH;
        var radius = Math.min(12, plotH / n / 2.5);

        // Activation color: blue (negative) -> black (zero) -> yellow (positive)
        var actVal = activations ? activations[ni % activations.length] : (activated ? 0.5 : 0);
        var r, g, b;
        if (actVal >= 0) {
          r = Math.round(255 * actVal); g = Math.round(200 * actVal); b = Math.round(50 * actVal);
        } else {
          r = 0; g = Math.round(100 * Math.abs(actVal)); b = Math.round(255 * Math.abs(actVal));
        }

        // Glow
        if (activated && actVal > 0.3) {
          ctx.beginPath();
          ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + r + "," + g + "," + b + ",0.15)";
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = activated ? "rgba(" + r + "," + g + "," + b + ",0.8)" : "rgba(255,255,255,0.03)";
        ctx.fill();
        ctx.strokeStyle = activated ? stageColor + "60" : "rgba(255,255,255,0.08)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Layer label
      ctx.font = "11px JetBrains Mono";
      ctx.fillStyle = activated ? COLORS.text : COLORS.textDim;
      ctx.textAlign = "center";
      ctx.fillText(config.labels ? config.labels[li] : "Layer " + li, x, h - 12);
      ctx.font = "11px JetBrains Mono";
      ctx.fillStyle = COLORS.textDim;
      ctx.fillText(layers[li] + " units", x, h - 1);
    }

    // Propagation pulse
    if (isAnimating && animStep < nLayers - 1) {
      var px = layerX[animStep] + (layerX[animStep + 1] - layerX[animStep]) * 0.5;
      ctx.beginPath();
      ctx.arc(px, h / 2, 6, 0, Math.PI * 2);
      ctx.fillStyle = stageColor + "60";
      ctx.fill();
    }
  }, [config, animStep, isAnimating]);

  return (
    <div style={{ marginBottom: 20 }}>
      {label && (
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stageColor, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.06em" }}>
          {label}
        </div>
      )}
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <button onClick={function() { setAnimStep(0); setIsAnimating(true); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "5px 14px",
          borderRadius: 4, border: "1px solid " + stageColor,
          background: "transparent", color: stageColor, cursor: "pointer",
        }}>Propagate</button>
      </div>
      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 280 }} />
      </div>
    </div>
  );
}

function PredictionExplanation({ predictions, gameAnswer, gameContext, order, stageColor }) {
  const ctx = gameContext.substring(gameContext.length - order);
  const ctxLabel = ctx.split("").map(c => c === " " ? "\u2423" : c).join("");
  const topPred = predictions[0];
  const topLabel = topPred.ch === " " ? "space" : "'" + topPred.ch + "'";
  const runnerUp = predictions.length > 1
    ? (predictions[1].ch === " " ? "space" : "'" + predictions[1].ch + "'") + ", appeared " + (predictions[1].prob * 100).toFixed(0) + "% of the time"
    : null;

  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 6 }}>
        Model's top predictions:
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        {predictions.map(function(p) { return (
          <span key={p.ch} style={{
            fontFamily: FONTS.mono, fontSize: 12,
            padding: "3px 8px", borderRadius: 4,
            background: p.ch === gameAnswer ? "rgba(114,225,160,0.1)" : COLORS.bgPanel,
            border: "1px solid " + (p.ch === gameAnswer ? "rgba(114,225,160,0.3)" : COLORS.border),
            color: p.ch === gameAnswer ? "#72E1A0" : COLORS.textDim,
          }}>
            {p.ch === " " ? "\u2423" : p.ch}: {(p.prob * 100).toFixed(0)}%
          </span>
        ); })}
      </div>
      <div style={{
        fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
        lineHeight: 1.6, padding: "10px 14px",
        background: "rgba(0,0,0,0.2)", borderRadius: 6,
        borderLeft: "3px solid " + stageColor + "40",
      }}>
        <strong style={{ color: COLORS.text }}>Why?</strong>{" "}
        In the training text, after the sequence "<span style={{ color: stageColor }}>{ctxLabel}</span>",
        the character {topLabel} appeared most often ({(topPred.prob * 100).toFixed(0)}% of the time).
        The model does not "understand" language {"\u2014"} it simply counts how frequently each character follows
        the current context.
        {runnerUp && " The runner-up, " + runnerUp + "."}
        {order === 1 && " With only 1 character of context, predictions are very coarse \u2014 try increasing the n-gram order to see how more context improves prediction."}
        {order >= 3 && " With " + order + " characters of context, the model captures more specific patterns from the training text."}
      </div>
    </div>
  );
}

// ============================================================

const ELIZA_RULES = [
  // Each rule: [regex pattern, [response templates...], label]
  // $1, $2 etc. are captured groups, with pronoun reflection applied
  [/\bi(?:'m| am) (.*)/i, ["How long have you been $1?", "Do you believe it is normal to be $1?", "Do you enjoy being $1?"], "I am X"],
  [/\bi feel (.*)/i, ["Tell me more about feeling $1.", "Do you often feel $1?", "What makes you feel $1?"], "I feel X"],
  [/\bi(?:'m| am) (sad|depressed|unhappy|miserable)/i, ["I'm sorry to hear that. Can you tell me what makes you $1?", "What do you think causes these feelings?"], "Sadness"],
  [/\bi want (.*)/i, ["Why do you want $1?", "What would it mean to you if you got $1?", "Suppose you got $1 — then what?"], "I want X"],
  [/\bi need (.*)/i, ["Why do you need $1?", "Would it really help you to get $1?", "Are you sure you need $1?"], "I need X"],
  [/\bwhy don(?:'t| not) you (.*)/i, ["Do you really think I don't $1?", "Perhaps eventually I will $1.", "Do you really want me to $1?"], "Why don't you X"],
  [/\bwhy can(?:'t| not) i (.*)/i, ["Do you think you should be able to $1?", "What would it mean if you could $1?"], "Why can't I X"],
  [/\bi can(?:'t| not) (.*)/i, ["How do you know you can't $1?", "Have you tried to $1?", "Perhaps you could $1 if you tried."], "I can't X"],
  [/\bare you (.*)/i, ["Why does it matter whether I am $1?", "Would you prefer if I were not $1?", "Do you think I am $1?"], "Are you X"],
  [/\byou(?:'re| are) (.*)/i, ["What makes you think I am $1?", "Does it please you to think I am $1?"], "You are X"],
  [/\bi don(?:'t| not) (.*)/i, ["Don't you really $1?", "Why don't you $1?", "Do you wish you could $1?"], "I don't X"],
  [/\bmy (.*)/i, ["Your $1 — tell me more about that.", "How does your $1 make you feel?", "What about your $1 concerns you?"], "My X"],
  [/\bmother|father|family|parent/i, ["Tell me more about your family.", "How does that make you feel about your family?", "What role does your family play in your thoughts?"], "Family"],
  [/\b(hello|hi|hey)\b/i, ["Hello. How are you feeling today?", "Hi there. What's on your mind?"], "Greeting"],
  [/\bsorry\b/i, ["There's no need to apologize.", "What are you apologizing for?"], "Apology"],
  [/\byes\b/i, ["You seem quite sure.", "Can you elaborate on that?", "I see. Tell me more."], "Affirmative"],
  [/\bno\b/i, ["Why not?", "You seem quite certain.", "Are you saying no just to be negative?"], "Negative"],
  [/\b(computer|machine|ai|robot)\b/i, ["Do machines concern you?", "What do you think about machines thinking?", "Why do you mention computers?"], "Computers"],
  [/\bwhat (.*)/i, ["Why do you ask?", "What do you think?", "Does that question interest you?"], "Question"],
  [/\bbecause (.*)/i, ["Is that the real reason?", "Are you sure that's why?", "What other reasons might there be?"], "Because X"],
];

const ELIZA_DEFAULTS = [
  "Please go on.", "Tell me more about that.", "How does that make you feel?",
  "Can you elaborate on that?", "That's interesting. Please continue.",
  "I see. And what does that suggest to you?", "How long have you felt this way?",
];

// Pronoun reflection map
const REFLECTIONS = {
  "i": "you", "me": "you", "my": "your", "am": "are", "i'm": "you're",
  "you": "I", "your": "my", "are": "am", "you're": "I'm",
  "myself": "yourself", "yourself": "myself",
  "i'd": "you'd", "i've": "you've", "i'll": "you'll",
};

function elizaReflect(text) {
  return text.split(/\s+/).map(w => {
    const lower = w.toLowerCase();
    return REFLECTIONS[lower] || w;
  }).join(" ");
}

function elizaRespond(input, rules) {
  const ruleList = rules || ELIZA_RULES;
  const clean = input.trim();
  for (let i = 0; i < ruleList.length; i++) {
    const [pattern, responses, label] = ruleList[i];
    const match = clean.match(pattern);
    if (match) {
      const template = responses[Math.floor(Math.random() * responses.length)];
      const reflected = match[1] ? elizaReflect(match[1]) : "";
      const response = template.replace("$1", reflected).replace("$2", match[2] ? elizaReflect(match[2]) : "");
      return { response, ruleIdx: i, label, pattern: pattern.source, matched: match[0] };
    }
  }
  return {
    response: ELIZA_DEFAULTS[Math.floor(Math.random() * ELIZA_DEFAULTS.length)],
    ruleIdx: -1, label: "Default", pattern: "(no match)", matched: "",
  };
}

// Convert rules to an editable format (regex source + flags instead of RegExp objects)
const ELIZA_RULES_EDITABLE = ELIZA_RULES.map(([pat, responses, label]) => ({
  pattern: pat.source,
  flags: pat.flags,
  responses: [...responses],
  label,
}));


function ELIZAPlayground({ stageIndex, dispatch, stageProgress }) {
  const stage = STAGES[1];
  const [messages, setMessages] = useState([
    { from: "eliza", text: "Hello. I'm ELIZA. How are you feeling today?", rule: null },
  ]);
  const [input, setInput] = useState("");
  const [tab, setTab] = useState("chat"); // "chat" | "script"
  const [lastRule, setLastRule] = useState(null);
  const [rulesUsed, setRulesUsed] = useState(new Set());
  const [editRules, setEditRules] = useState(ELIZA_RULES_EDITABLE.map(r => ({ ...r, responses: [...r.responses] })));
  const [editingIdx, setEditingIdx] = useState(null);
  const chatRef = useRef(null);

  // Build live RegExp rules from editable state
  const liveRules = useMemo(() => {
    return editRules.map(r => {
      try {
        return [new RegExp(r.pattern, r.flags), r.responses, r.label];
      } catch (e) {
        return null; // invalid regex — skip
      }
    }).filter(Boolean);
  }, [editRules]);

  const handleSend = useCallback(() => {
    if (!input.trim()) return;
    const userMsg = input.trim();
    const result = elizaRespond(userMsg, liveRules);
    setMessages(prev => [
      ...prev,
      { from: "user", text: userMsg, rule: null },
      { from: "eliza", text: result.response, rule: result },
    ]);
    setLastRule(result);
    setRulesUsed(prev => { const next = new Set(prev); next.add(result.label); return next; });
    setInput("");
    const newCount = rulesUsed.size + (rulesUsed.has(result.label) ? 0 : 1);
    dispatch({ type: "UPDATE_SCORE", stage: 1, score: newCount, attempts: messages.length });
    if (newCount >= 6 && !stageProgress.challengeCompleted) {
      setTimeout(() => dispatch({ type: "COMPLETE_CHALLENGE", stage: 1, score: newCount }), 1000);
    }
  }, [input, messages, rulesUsed, liveRules, dispatch, stageProgress]);

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages]);

  function updateRule(idx, field, value) {
    setEditRules(prev => {
      const next = prev.map((r, i) => i === idx ? { ...r, [field]: value } : r);
      return next;
    });
  }
  function updateResponse(ruleIdx, respIdx, value) {
    setEditRules(prev => {
      const next = prev.map((r, i) => {
        if (i !== ruleIdx) return r;
        const resps = [...r.responses];
        resps[respIdx] = value;
        return { ...r, responses: resps };
      });
      return next;
    });
  }
  function addResponse(ruleIdx) {
    setEditRules(prev => prev.map((r, i) => i === ruleIdx ? { ...r, responses: [...r.responses, "Tell me more about $1."] } : r));
  }
  function removeResponse(ruleIdx, respIdx) {
    setEditRules(prev => prev.map((r, i) => i === ruleIdx ? { ...r, responses: r.responses.filter((_, j) => j !== respIdx) } : r));
  }
  function addRule() {
    setEditRules(prev => [...prev, { pattern: "\\\\bhello\\\\b", flags: "i", responses: ["Hi there!"], label: "New Rule" }]);
    setEditingIdx(editRules.length);
  }
  function removeRule(idx) {
    setEditRules(prev => prev.filter((_, i) => i !== idx));
    if (editingIdx === idx) setEditingIdx(null);
  }
  function resetRules() {
    setEditRules(ELIZA_RULES_EDITABLE.map(r => ({ ...r, responses: [...r.responses] })));
    setEditingIdx(null);
  }

  const PROMPTS = [
    "I'm feeling anxious", "I need help", "Why can't I sleep?",
    "My mother worries about me", "Are you really listening?",
    "I don't know what to do", "Because I'm scared",
  ];

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* Tab bar */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20, alignItems: "center", flexWrap: "wrap" }}>
        {[["chat", "Chat"], ["script", "Edit Script"]].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px", borderRadius: 4,
            border: "1px solid " + (tab === id ? stage.color : COLORS.border),
            background: tab === id ? stage.colorDim : "transparent",
            color: tab === id ? stage.color : COLORS.textDim, cursor: "pointer",
          }}>{label}</button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stage.color }}>
          Rules discovered: {rulesUsed.size}/6 to unlock next stage
        </div>
      </div>

      {/* ═══ CHAT TAB ═══ */}
      {tab === "chat" && (
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
          <div style={{ flex: 2, minWidth: 280 }}>
            <div ref={chatRef} style={{
              height: 340, overflowY: "auto", background: "#08080A",
              border: "1px solid " + COLORS.border, borderRadius: 8, padding: 14, marginBottom: 12,
            }}>
              {messages.map((m, i) => (
                <div key={i} style={{ marginBottom: 10, display: "flex", justifyContent: m.from === "user" ? "flex-end" : "flex-start" }}>
                  <div style={{
                    maxWidth: "80%", padding: "8px 12px", borderRadius: 8,
                    background: m.from === "user" ? stage.colorDim : "rgba(255,255,255,0.05)",
                    border: "1px solid " + (m.from === "user" ? stage.color + "30" : COLORS.border),
                  }}>
                    <div style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.text, lineHeight: 1.5 }}>{m.text}</div>
                    {m.rule && (
                      <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: stage.color, marginTop: 4, opacity: 0.7 }}>
                        Rule: {m.rule.label} &middot; /{m.rule.pattern}/
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <input type="text" value={input} onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") handleSend(); }}
                placeholder="Type a message to ELIZA..."
                style={{ flex: 1, padding: "8px 12px", fontFamily: FONTS.mono, fontSize: 13, background: COLORS.bgPanel, border: "1px solid " + COLORS.border, borderRadius: 6, color: COLORS.text, outline: "none" }}
              />
              <button onClick={handleSend} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px", borderRadius: 6, border: "1px solid " + stage.color, background: stage.colorDim, color: stage.color, cursor: "pointer" }}>Send</button>
            </div>
            <div style={{ display: "flex", gap: 4, marginTop: 8, flexWrap: "wrap" }}>
              {PROMPTS.map(p => (
                <button key={p} onClick={() => setInput(p)} style={{ fontFamily: FONTS.mono, fontSize: 10, padding: "3px 8px", borderRadius: 3, border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer" }}>{p}</button>
              ))}
            </div>
          </div>

          {/* Last-match debugger (compact) */}
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{ background: COLORS.bgPanel, border: "1px solid " + COLORS.border, borderRadius: 8, padding: 14 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: stage.color, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Last Match</div>
              {lastRule ? (
                <div>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stage.color, padding: "4px 8px", background: stage.colorDim, borderRadius: 4, marginBottom: 6 }}>{lastRule.label}</div>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.text, padding: "3px 6px", background: "rgba(255,255,255,0.04)", borderRadius: 3, marginBottom: 6, wordBreak: "break-all" }}>/{lastRule.pattern}/</div>
                  {lastRule.matched && <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: "#72E1A0" }}>Matched: "{lastRule.matched}"</div>}
                </div>
              ) : (
                <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim }}>Send a message to see which rule fires.</div>
              )}
              <div style={{ borderTop: "1px solid " + COLORS.border, marginTop: 10, paddingTop: 8 }}>
                <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 4 }}>Discovered ({rulesUsed.size}):</div>
                <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
                  {[...rulesUsed].map(r => (
                    <span key={r} style={{ fontFamily: FONTS.mono, fontSize: 10, padding: "2px 5px", borderRadius: 3, background: stage.colorDim, color: stage.color }}>{r}</span>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, lineHeight: 1.5, fontStyle: "italic" }}>
              {liveRules.length} active rules. Switch to "Edit Script" to modify them.
            </div>
          </div>
        </div>
      )}

      {/* ═══ SCRIPT EDITOR TAB ═══ */}
      {tab === "script" && (
        <div>
          <div style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 12, lineHeight: 1.5 }}>
            ELIZA is just a list of pattern-response rules. Edit, add, or delete rules below, then switch to Chat to test them.
            Use <code style={{ color: stage.color }}>$1</code> in responses to insert the captured group from the pattern.
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <button onClick={addRule} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + stage.color, background: stage.colorDim, color: stage.color, cursor: "pointer" }}>+ Add Rule</button>
            <button onClick={resetRules} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer" }}>Reset to Defaults</button>
            <div style={{ flex: 1 }} />
            <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, alignSelf: "center" }}>{editRules.length} rules</div>
          </div>

          <div style={{ maxHeight: 500, overflowY: "auto" }}>
            {editRules.map((rule, idx) => {
              const isOpen = editingIdx === idx;
              let patternValid = true;
              try { new RegExp(rule.pattern, rule.flags); } catch (e) { patternValid = false; }
              return (
                <div key={idx} style={{
                  background: isOpen ? "rgba(255,255,255,0.03)" : "transparent",
                  border: "1px solid " + (isOpen ? stage.color + "40" : COLORS.border),
                  borderRadius: 6, marginBottom: 6, overflow: "hidden",
                }}>
                  {/* Rule header — click to expand */}
                  <div onClick={() => setEditingIdx(isOpen ? null : idx)} style={{
                    display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", cursor: "pointer",
                  }}>
                    <span style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim, width: 20 }}>{idx + 1}</span>
                    <span style={{ fontFamily: FONTS.mono, fontSize: 12, color: stage.color, fontWeight: 600, minWidth: 100 }}>{rule.label}</span>
                    <span style={{ fontFamily: FONTS.mono, fontSize: 11, color: patternValid ? COLORS.textDim : "#FF6B6B", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      /{rule.pattern}/{rule.flags}
                    </span>
                    <button onClick={(e) => { e.stopPropagation(); removeRule(idx); }} style={{
                      fontFamily: FONTS.mono, fontSize: 11, padding: "2px 8px", borderRadius: 3,
                      border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer",
                    }}>{"\u00D7"}</button>
                  </div>

                  {/* Expanded editor */}
                  {isOpen && (
                    <div style={{ padding: "8px 12px 12px 40px", borderTop: "1px solid " + COLORS.border }}>
                      <div style={{ marginBottom: 8 }}>
                        <label style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, display: "block", marginBottom: 3 }}>Label:</label>
                        <input type="text" value={rule.label} onChange={e => updateRule(idx, "label", e.target.value)} style={{
                          width: "100%", padding: "4px 8px", fontFamily: FONTS.mono, fontSize: 12,
                          background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 4, color: COLORS.text, outline: "none",
                        }} />
                      </div>
                      <div style={{ marginBottom: 8 }}>
                        <label style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, display: "block", marginBottom: 3 }}>
                          Pattern (regex): {!patternValid && <span style={{ color: "#FF6B6B" }}> invalid regex</span>}
                        </label>
                        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>

                        </label>
                        {rule.responses.map((resp, ri) => (
                          <div key={ri} style={{ display: "flex", gap: 4, marginBottom: 4 }}>
