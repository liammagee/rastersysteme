function TransformerTrainingSim({ stageColor }) {
  const canvasRef = useRef(null);
  const [epoch, setEpoch] = useState(0);
  const [isTraining, setIsTraining] = useState(false);
  const [speed, setSpeed] = useState(1);

  // Simulated attention pattern evolution: starts uniform, becomes structured
  var tokens = ["The", "cat", "sat", "on", "the", "mat"];
  var n = tokens.length;

  // Target attention patterns for 3 heads
  var targetHeads = [
    // Head 0: positional (nearby tokens)
    [[0.5,0.3,0.1,0.05,0.03,0.02],[0.25,0.4,0.2,0.08,0.04,0.03],[0.08,0.25,0.4,0.15,0.07,0.05],
     [0.04,0.08,0.2,0.4,0.18,0.10],[0.03,0.05,0.08,0.2,0.4,0.24],[0.02,0.03,0.05,0.10,0.25,0.55]],
    // Head 1: syntactic (subject-verb, det-noun)
    [[0.4,0.4,0.05,0.05,0.05,0.05],[0.3,0.2,0.35,0.05,0.05,0.05],[0.1,0.35,0.2,0.15,0.1,0.1],
     [0.05,0.05,0.15,0.3,0.2,0.25],[0.05,0.05,0.05,0.15,0.3,0.40],[0.05,0.05,0.1,0.25,0.30,0.25]],
    // Head 2: semantic (content words attend to each other)
    [[0.2,0.15,0.15,0.15,0.15,0.2],[0.1,0.25,0.15,0.05,0.05,0.40],[0.1,0.15,0.25,0.20,0.10,0.20],
     [0.1,0.1,0.2,0.3,0.15,0.15],[0.1,0.05,0.10,0.15,0.30,0.30],[0.08,0.30,0.12,0.10,0.15,0.25]],
  ];
  var headLabels = ["Positional", "Syntactic", "Semantic"];

  // Interpolate from uniform to target
  var progress = Math.min(epoch / 60, 1);
  var eased = 1 - Math.pow(1 - progress, 2);

  useEffect(function() {
    if (!isTraining) return;
    var interval = setInterval(function() {
      setEpoch(function(e) { return e + 1; });
    }, 100 / speed);
    return function() { clearInterval(interval); };
  }, [isTraining, speed]);

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 360;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    var headW = Math.floor((w - 40) / 3);
    var cellSize = Math.min(Math.floor((headW - 60) / n), 36);
    var margin = { top: 55, left: 50 };

    for (var hi = 0; hi < 3; hi++) {
      var offsetX = 10 + hi * (headW + 10);

      // Head label
      ctx.font = "600 11px JetBrains Mono";
      ctx.fillStyle = stageColor;
      ctx.textAlign = "center";
      ctx.fillText("Head " + (hi + 1) + ": " + headLabels[hi], offsetX + margin.left + (n * cellSize) / 2, 16);

      // Draw attention matrix
      for (var row = 0; row < n; row++) {
        for (var col = 0; col < n; col++) {
          var uniform = 1 / n;
          var target = targetHeads[hi][row][col];
          var val = uniform + (target - uniform) * eased;
          // Add noise that decreases with training
          var noise = (Math.random() - 0.5) * 0.08 * (1 - eased);
          val = Math.max(0, Math.min(1, val + noise));

          var intensity = Math.min(val * 3, 1);
          var cr = parseInt(stageColor.slice(1, 3), 16);
          var cg = parseInt(stageColor.slice(3, 5), 16);
          var cb = parseInt(stageColor.slice(5, 7), 16);

          var x = offsetX + margin.left + col * cellSize;
          var y = margin.top + row * cellSize;

          ctx.fillStyle = "rgba(" + cr + "," + cg + "," + cb + "," + (intensity * 0.9) + ")";
          ctx.fillRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
        }
      }

      // Token labels
      ctx.font = "9px JetBrains Mono";
      ctx.fillStyle = COLORS.textDim;
      for (var ti = 0; ti < n; ti++) {
        ctx.textAlign = "center";
        ctx.save();
        ctx.translate(offsetX + margin.left + ti * cellSize + cellSize / 2, margin.top - 6);
        ctx.rotate(-0.5);
        ctx.fillText(tokens[ti], 0, 0);
        ctx.restore();
        ctx.textAlign = "right";
        ctx.fillText(tokens[ti], offsetX + margin.left - 4, margin.top + ti * cellSize + cellSize / 2 + 3);
      }
    }

    // Training progress & loss
    var lossY = margin.top + n * cellSize + 20;
    ctx.font = "11px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = "left";
    ctx.fillText("Training progress", 10, lossY + 10);

    // Progress bar
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(10, lossY + 18, w - 20, 8);
    ctx.fillStyle = stageColor + "80";
    ctx.fillRect(10, lossY + 18, (w - 20) * eased, 8);

    // Loss value
    var loss = 2.5 * Math.exp(-epoch * 0.03) + 0.4;
    ctx.fillStyle = stageColor;
    ctx.textAlign = "right";
    ctx.fillText("loss: " + loss.toFixed(2), w - 10, lossY + 10);

    // Phase label
    ctx.textAlign = "center";
    ctx.fillStyle = COLORS.textDim;
    ctx.font = "10px JetBrains Mono";
    var phase = eased < 0.2 ? "Random initialization" : eased < 0.5 ? "Patterns emerging..." : eased < 0.8 ? "Heads specializing" : "Converged";
    ctx.fillText(phase, w / 2, lossY + 45);
  }, [epoch, eased]);

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Watch Attention Heads Form
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        Three attention heads start with uniform (random) weights. As training progresses, each head specializes:
        one learns positional patterns (nearby tokens), one learns syntactic roles (subject-verb),
        and one learns semantic relationships (content words). This specialization emerges from the training signal alone.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
        <button onClick={function() { setIsTraining(!isTraining); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 18px",
          borderRadius: 4, border: "1px solid " + stageColor,
          background: isTraining ? stageColor + "20" : "transparent",
          color: stageColor, cursor: "pointer",
        }}>{isTraining ? "Pause" : "Train"}</button>
        <button onClick={function() { setIsTraining(false); setEpoch(0); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 14px",
          borderRadius: 4, border: "1px solid " + COLORS.border,
          background: "transparent", color: COLORS.textDim, cursor: "pointer",
        }}>Reset</button>
        {[1, 2, 4].map(function(s) { return (
          <button key={s} onClick={function() { setSpeed(s); }} style={{
            fontFamily: FONTS.mono, fontSize: 11, width: 28, height: 24,
            borderRadius: 3, border: "1px solid " + (speed === s ? stageColor : COLORS.border),
            background: speed === s ? stageColor + "15" : "transparent",
            color: speed === s ? stageColor : COLORS.textDim, cursor: "pointer",
          }}>{s}x</button>
        ); })}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: stageColor }}>
          Epoch {epoch}
        </div>
      </div>

      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 360 }} />
      </div>
    </div>
  );
}


function TransformerPlayground({ stageIndex, dispatch, stageProgress }) {
  const stage = STAGES[2];
  const [sentenceIdx, setSentenceIdx] = useState(0);
  const [headIdx, setHeadIdx] = useState(0);
  const [hoverCell, setHoverCell] = useState(null);
  const [activeStep, setActiveStep] = useState(0);
  const [showSection, setShowSection] = useState("attention"); // attention | positional | architecture | training | challenge
  const canvasRef = useRef(null);
  const posCanvasRef = useRef(null);

  // Challenge state
  const [challengeIdx, setChallengeIdx] = useState(0);
  const [challengeAnswer, setChallengeAnswer] = useState(null);
  const [challengeScore, setChallengeScore] = useState({ correct: 0, total: 0 });

  const sentence = ATTENTION_DATA[sentenceIdx];
  const head = sentence.heads[headIdx];

  // Draw attention heatmap
  useEffect(() => {
    if (showSection !== "attention") return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const container = canvas.parentElement;
    const w = container.clientWidth;
    const tokens = sentence.tokens;
    const n = tokens.length;
    const cellSize = Math.min((w - 120) / n, 48);
    const margin = { top: 60, left: 80 };
    const totalW = margin.left + n * cellSize + 20;
    const totalH = margin.top + n * cellSize + 20;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = totalW * dpr;
    canvas.height = totalH * dpr;
    canvas.style.width = totalW + "px";
    canvas.style.height = totalH + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, totalW, totalH);

    const weights = head.weights;

    for (let row = 0; row < n; row++) {
      for (let col = 0; col < n; col++) {
        const weight = weights[row][col];
        const x = margin.left + col * cellSize;
        const y = margin.top + row * cellSize;
        const isHovered = hoverCell && hoverCell.row === row && hoverCell.col === col;

        const intensity = Math.min(weight * 2.5, 1);
        const r = parseInt(stage.color.slice(1,3), 16);
        const g = parseInt(stage.color.slice(3,5), 16);
        const b = parseInt(stage.color.slice(5,7), 16);

        ctx.fillStyle = isHovered
          ? `rgba(${r},${g},${b},${Math.max(intensity, 0.5)})`
          : `rgba(${r},${g},${b},${intensity * 0.9})`;
        ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);

        // Highlight row/col
        if (hoverCell && (hoverCell.row === row || hoverCell.col === col) && !isHovered) {
          ctx.fillStyle = "rgba(255,255,255,0.04)";
          ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
        }

        // Show weight value on hover
        if (isHovered) {
          ctx.font = "11px JetBrains Mono";
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(weight.toFixed(2), x + cellSize / 2, y + cellSize / 2);
        }
      }
    }

    // Labels
    ctx.font = "11px JetBrains Mono";
    for (let i = 0; i < n; i++) {
      const isHighRow = hoverCell && hoverCell.row === i;
      const isHighCol = hoverCell && hoverCell.col === i;

      // Column labels (top - "attends to")
      ctx.save();
      ctx.translate(margin.left + i * cellSize + cellSize / 2, margin.top - 8);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = isHighCol ? stage.color : COLORS.textDim;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(tokens[i], 0, 0);
      ctx.restore();

      // Row labels (left - "from")
      ctx.fillStyle = isHighRow ? stage.color : COLORS.textDim;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(tokens[i], margin.left - 8, margin.top + i * cellSize + cellSize / 2);
    }

    // Axis labels
    ctx.font = "9px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = "center";
    ctx.fillText("attends to \u2192", margin.left + (n * cellSize) / 2, 12);
    ctx.save();
    ctx.translate(12, margin.top + (n * cellSize) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("from \u2192", 0, 0);
    ctx.restore();

  }, [sentence, head, hoverCell, showSection, stage.color]);

  // Draw positional encoding
  useEffect(() => {
    if (showSection !== "positional") return;
    const canvas = posCanvasRef.current;
    if (!canvas) return;
    const container = canvas.parentElement;
    const w = container.clientWidth;
    const h = 300;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    const maxPos = 40;
    const dims = 8;
    const margin = { top: 20, bottom: 30, left: 40, right: 20 };
    const plotW = w - margin.left - margin.right;
    const plotH = h - margin.top - margin.bottom;

    // Draw each dimension as a colored wave
    const dimColors = ["#E8A838", "#48BFE3", "#C4A1FF", "#FF6B6B", "#72E1A0", "#FFD166", "#FF85A1", "#80ED99"];
    for (let d = 0; d < dims; d++) {
      ctx.beginPath();
      for (let pos = 0; pos <= maxPos; pos++) {
        const x = margin.left + (pos / maxPos) * plotW;
        const val = d % 2 === 0
          ? Math.sin(pos / Math.pow(10000, (2 * Math.floor(d/2)) / 64))
          : Math.cos(pos / Math.pow(10000, (2 * Math.floor(d/2)) / 64));
        const y = margin.top + plotH / 2 - val * (plotH / 2 - 10);
        pos === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = dimColors[d] + "80";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Axis
    ctx.strokeStyle = COLORS.textDim;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(margin.left, margin.top + plotH / 2);
    ctx.lineTo(w - margin.right, margin.top + plotH / 2);
    ctx.stroke();

    // Labels
    ctx.font = "10px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = "center";
    for (let p = 0; p <= maxPos; p += 5) {
      const x = margin.left + (p / maxPos) * plotW;
      ctx.fillText(p.toString(), x, h - 10);
    }
    ctx.fillText("Position", margin.left + plotW / 2, h - 2);

    ctx.save();
    ctx.translate(12, margin.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Encoding value", 0, 0);
    ctx.restore();

    // Legend
    ctx.font = "9px JetBrains Mono";
    for (let d = 0; d < dims; d++) {
      const lx = margin.left + (d % 4) * 80;
      const ly = margin.top + plotH + 20 + Math.floor(d / 4) * 14;
      ctx.fillStyle = dimColors[d];
      ctx.fillRect(lx, ly - 4, 12, 3);
      ctx.fillStyle = COLORS.textDim;
      ctx.textAlign = "left";
      ctx.fillText(`dim ${d}`, lx + 16, ly);
    }
  }, [showSection]);

  const handleHeatmapMouseMove = useCallback((e) => {
    if (showSection !== "attention") return;
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const n = sentence.tokens.length;
    const w = rect.width;
    const cellSize = Math.min((w - 120) / n, 48);
    const margin = { top: 60, left: 80 };
    const col = Math.floor((x - margin.left) / cellSize);
    const row = Math.floor((y - margin.top) / cellSize);
    if (row >= 0 && row < n && col >= 0 && col < n) {
      setHoverCell({ row, col });
    } else {
      setHoverCell(null);
    }
  }, [showSection, sentence]);

  const handleChallengeAnswer = useCallback((option) => {
    const challenge = ATTENTION_CHALLENGES[challengeIdx];
    const isCorrect = option === challenge.correct;
    setChallengeAnswer(option);
    const newScore = {
      correct: challengeScore.correct + (isCorrect ? 1 : 0),
      total: challengeScore.total + 1,
    };
    setChallengeScore(newScore);
    dispatch({ type: "UPDATE_SCORE", stage: 2, score: newScore.correct, attempts: newScore.total });

    if (newScore.correct >= 3 && !stageProgress.challengeCompleted) {
      setTimeout(() => {
        dispatch({ type: "COMPLETE_CHALLENGE", stage: 2, score: newScore.correct });
      }, 1000);
    }
  }, [challengeIdx, challengeScore, dispatch, stageProgress]);

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* Section tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        {[["attention", "Attention Heatmap"], ["positional", "Positional Encoding"], ["architecture", "Architecture"], ["network", "Network View"], ["training", "Watch Training"], ["challenge", "Challenge"]].map(([id, label]) => (
          <button key={id} onClick={() => setShowSection(id)} style={{
            fontFamily: FONTS.mono, fontSize: 11, padding: "7px 14px",
            borderRadius: 4, border: `1px solid ${showSection === id ? stage.color : COLORS.border}`,
            background: showSection === id ? stage.colorDim : "transparent",
            color: showSection === id ? stage.color : COLORS.textDim,
            cursor: "pointer", transition: "all 0.2s",
          }}>{label}</button>
        ))}
      </div>

      {/* Attention Heatmap */}
      {showSection === "attention" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Self-Attention Visualization
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            Each cell shows how much attention one token pays to another. Rows are "from" tokens, columns are "attends to" tokens. Brighter = stronger attention.
          </p>

          {/* Sentence selector */}
          <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
            {ATTENTION_DATA.map((s, i) => (
              <button key={i} onClick={() => { setSentenceIdx(i); setHeadIdx(0); }} style={{
                fontFamily: FONTS.mono, fontSize: 11, padding: "5px 12px",
                borderRadius: 4, border: `1px solid ${sentenceIdx === i ? stage.color : COLORS.border}`,
                background: sentenceIdx === i ? stage.colorDim : "transparent",
                color: sentenceIdx === i ? stage.color : COLORS.textDim,
                cursor: "pointer", maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}>"{s.sentence.substring(0, 35)}..."</button>
            ))}
          </div>

          {/* Head selector */}
          <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
            {sentence.heads.map((h, i) => (
              <button key={i} onClick={() => setHeadIdx(i)} style={{
                fontFamily: FONTS.mono, fontSize: 10, padding: "4px 10px",
                borderRadius: 3, border: `1px solid ${headIdx === i ? stage.color : COLORS.border}`,
                background: headIdx === i ? stage.colorDim : "transparent",
                color: headIdx === i ? stage.color : COLORS.textDim,
                cursor: "pointer",
              }}>{h.label}</button>
            ))}
          </div>

          <div style={{
            background: "#08080A", border: `1px solid ${COLORS.border}`,
            borderRadius: 8, overflow: "hidden", padding: 8, marginBottom: 12,
          }}>
            <canvas
              ref={canvasRef}
              onMouseMove={handleHeatmapMouseMove}
              onMouseLeave={() => setHoverCell(null)}
              style={{ cursor: "crosshair" }}
            />
          </div>

          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: stage.color,
            fontStyle: "italic", padding: "8px 16px",
            background: stage.colorDim, borderRadius: 6,
            borderLeft: `3px solid ${stage.color}`,
          }}>
            {sentence.note}
          </div>
        </div>
      )}

      {/* Positional Encoding */}
      {showSection === "positional" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Positional Encoding
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            Since transformers process all tokens simultaneously (no recurrence), they need another way to know word order.
            The solution: add sinusoidal waves of different frequencies to each position. Each position gets a unique "fingerprint" vector.
            Low-frequency waves encode coarse position; high-frequency waves encode fine position.
          </p>
          <div style={{
            background: "#08080A", border: `1px solid ${COLORS.border}`,
            borderRadius: 8, overflow: "hidden", padding: 8,
          }}>
            <canvas ref={posCanvasRef} style={{ width: "100%" }} />
          </div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
            marginTop: 12, lineHeight: 1.6,
          }}>
            <strong style={{ color: COLORS.text }}>Key insight:</strong> The formula PE(pos, 2i) = sin(pos / 10000^(2i/d)) generates
            waves at exponentially increasing wavelengths. This means nearby positions have similar encodings (good for local patterns),
            while distant positions are easily distinguishable (good for long-range dependencies).
          </div>
        </div>
      )}

      {/* Architecture Walkthrough */}
      {showSection === "architecture" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Transformer Architecture
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 20, lineHeight: 1.5 }}>
            Walk through the transformer layer step by step. Click each block to see details.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 0, position: "relative" }}>
            {ARCH_STEPS.map((step, i) => {
              const isActive = activeStep === i;
              return (
                <div key={step.id}>
                  <div
                    onClick={() => setActiveStep(i)}
                    style={{
                      display: "flex", alignItems: "center", gap: 16,
                      padding: "12px 16px", borderRadius: 8, cursor: "pointer",
                      background: isActive ? `${step.color}15` : "transparent",
                      border: `1px solid ${isActive ? step.color + "40" : "transparent"}`,
                      transition: "all 0.3s",
                    }}
                  >
                    {/* Step node */}
                    <div style={{
                      width: 32, height: 32, borderRadius: 6, flexShrink: 0,
                      background: isActive ? step.color : "transparent",
                      border: `2px solid ${step.color}`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontFamily: FONTS.mono, fontSize: 11, fontWeight: 600,
                      color: isActive ? "#0B0A09" : step.color,
                      transition: "all 0.3s",
                    }}>{i + 1}</div>

                    <div style={{ flex: 1 }}>
                      <div style={{
                        fontFamily: FONTS.mono, fontSize: 13, fontWeight: 600,
                        color: isActive ? COLORS.text : COLORS.textDim,
                      }}>{step.label}</div>
                      {isActive && (
                        <div style={{
                          fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
                          marginTop: 4, lineHeight: 1.5, animation: "fadeInUp 0.3s ease",
                        }}>{step.desc}</div>
                      )}
                    </div>
                  </div>

                  {/* Connector arrow */}
                  {i < ARCH_STEPS.length - 1 && (
                    <div style={{
                      display: "flex", justifyContent: "center", padding: "2px 0",
                    }}>
                      <div style={{
                        width: 1, height: 16,
                        background: `linear-gradient(${step.color}40, ${ARCH_STEPS[i+1].color}40)`,
                      }} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Training Simulation */}
      {/* Network View */}
      {showSection === "network" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Transformer Network
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            A single transformer layer. Input tokens flow through the embedding, into multi-head attention
            (where tokens "look at" each other), through a feed-forward network, and out as updated representations.
            In practice, GPT-4 stacks ~120 of these layers deep.
          </p>
          <NeuralNetworkViz
            config={{
              layers: [6, 6, 6, 6, 6, 6],
              labels: ["Tokens", "Embed\n+Position", "Q, K, V\nProjection", "Attention\nOutput", "Feed-\nForward", "Next Token\nProbs"],
              activations: [
                [0.8, 0.6, 0.7, 0.3, 0.5, 0.9],
                [0.6, 0.4, 0.5, 0.2, 0.7, 0.8],
                [0.5, 0.7, 0.3, 0.6, 0.4, 0.5],
                [0.8, 0.3, 0.9, 0.2, 0.6, 0.7],
                [0.7, 0.5, 0.6, 0.4, 0.8, 0.3],
                [0.1, 0.05, 0.02, 0.8, 0.01, 0.02],
              ],
            }}
            stageColor={stage.color}
            label="One Transformer Layer"
          />
          <NeuralNetworkViz
            config={{
              layers: [6, 8, 8, 8, 6],
              labels: ["Query (Q)", "Key (K)", "Dot Product\nQK^T", "Softmax\nWeights", "Value (V)\nOutput"],
              activations: [
                [0.5, 0.3, -0.2, 0.7, 0.1, -0.4],
                [0.3, 0.8, -0.1, 0.4, 0.6, -0.3, 0.2, 0.5],
                [0.7, 0.2, 0.1, 0.9, 0.3, 0.05, 0.1, 0.4],
                [0.35, 0.1, 0.05, 0.4, 0.05, 0.02, 0.01, 0.02],
                [0.6, 0.4, 0.5, 0.8, 0.3, 0.7],
              ],
            }}
            stageColor={stage.color}
            label="Inside Self-Attention (one head)"
          />
        </div>
      )}

      {showSection === "training" && (
        <TransformerTrainingSim stageColor={stage.color} />
      )}

      {/* Challenge */}
      {showSection === "challenge" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Coreference Challenge
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            Attention helps resolve pronoun references. For each sentence, identify which word the highlighted pronoun refers to.
            Get all 3 correct to unlock Stage 4.
          </p>

          <div style={{
            fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 16,
          }}>
            Score: <span style={{ color: stage.color }}>{challengeScore.correct}/3</span>
            {" | "}Question {Math.min(challengeIdx + 1, ATTENTION_CHALLENGES.length)} of {ATTENTION_CHALLENGES.length}
          </div>

          {challengeIdx < ATTENTION_CHALLENGES.length ? (() => {
            const challenge = ATTENTION_CHALLENGES[challengeIdx];
            return (
              <div style={{
                background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
                borderRadius: 8, padding: 20,
              }}>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 15, color: COLORS.text,
                  marginBottom: 16, lineHeight: 1.8,
                }}>
                  {challenge.tokens.map((t, i) => (
                    <span key={i} style={{
                      color: i === challenge.targetToken ? stage.color : COLORS.text,
                      fontWeight: i === challenge.targetToken ? 700 : 400,
                      textDecoration: i === challenge.targetToken ? "underline" : "none",
                      textUnderlineOffset: 4,
                    }}>{t} </span>
                  ))}
                </div>

                <div style={{
                  fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, marginBottom: 16,
                }}>
                  What does "<span style={{ color: stage.color }}>{challenge.targetLabel}</span>" refer to?
                </div>

                <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
                  {challenge.options.map((opt, i) => (
                    <button key={opt} onClick={() => !challengeAnswer && handleChallengeAnswer(opt)} style={{
                      fontFamily: FONTS.mono, fontSize: 14, padding: "10px 24px",
                      borderRadius: 6, cursor: challengeAnswer ? "default" : "pointer",
                      border: `1px solid ${
                        challengeAnswer
                          ? opt === challenge.correct ? "#72E1A0" : opt === challengeAnswer ? "#FF6B6B" : COLORS.border
                          : COLORS.border
                      }`,
                      background: challengeAnswer
                        ? opt === challenge.correct ? "rgba(114,225,160,0.1)" : opt === challengeAnswer ? "rgba(255,107,107,0.1)" : "transparent"
                        : "transparent",
                      color: challengeAnswer
                        ? opt === challenge.correct ? "#72E1A0" : opt === challengeAnswer ? "#FF6B6B" : COLORS.textDim
                        : COLORS.text,
                      transition: "all 0.2s",
                    }}>{challenge.optionLabels[i]}</button>
                  ))}
                </div>

                {challengeAnswer && (
                  <div style={{ animation: "fadeInUp 0.3s ease" }}>
                    <div style={{
                      fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
                      lineHeight: 1.5, marginBottom: 12,
                      padding: 12, background: "rgba(0,0,0,0.2)", borderRadius: 6,
                    }}>
                      {challenge.explanation}
                    </div>
                    <button onClick={() => {
                      setChallengeIdx(i => i + 1);
                      setChallengeAnswer(null);
                    }} style={{
                      fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
                      borderRadius: 4, border: `1px solid ${stage.color}`,
                      background: stage.colorDim, color: stage.color, cursor: "pointer",
                    }}>Next Question</button>
                  </div>
                )}
              </div>
            );
          })() : (
            <div style={{
              fontFamily: FONTS.mono, fontSize: 14, color: "#72E1A0",
              padding: 20, background: "rgba(114,225,160,0.08)",
              borderRadius: 8, border: "1px solid rgba(114,225,160,0.2)",
              textAlign: "center",
            }}>
              Challenge complete! Score: {challengeScore.correct}/3
              {challengeScore.correct >= 3 && " \u2014 Stage 4 unlocked!"}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


// ============================================================

function RLHFUnderTheHood({ stageColor }) {
  const canvasRef = useRef(null);
  const [showAligned, setShowAligned] = useState(false);

  // Simplified "transformer output" for a prompt
  var prompt = "How do I pick a lock?";
  var vocabWords = ["To", "pick", "a", "lock", "insert", "I'd", "recommend", "calling", "the", "tension", "wrench", "locksmith", "into", "understand", "security", "curious"];

  // Pre-alignment: top tokens are instructional
  var preAlignProbs = [0.15, 0.12, 0.10, 0.09, 0.11, 0.02, 0.01, 0.01, 0.08, 0.10, 0.08, 0.01, 0.06, 0.02, 0.02, 0.02];
  // Post-alignment: top tokens shift toward helpful/safe responses
  var postAlignProbs = [0.04, 0.03, 0.06, 0.05, 0.02, 0.11, 0.10, 0.08, 0.06, 0.01, 0.01, 0.09, 0.02, 0.12, 0.10, 0.09];

  // Pre-alignment attention: "lock" attends to "pick" (instructional)
  var preAttention = [
    [0.3,0.2,0.1,0.15,0.1,0.15], // How
    [0.1,0.3,0.1,0.3,0.1,0.1],   // do
    [0.1,0.1,0.3,0.2,0.1,0.2],   // I
    [0.15,0.25,0.1,0.2,0.15,0.15],// pick
    [0.1,0.1,0.2,0.1,0.3,0.2],   // a
    [0.1,0.2,0.1,0.3,0.1,0.2],   // lock
  ];
  // Post-alignment: "lock" attends more to "How" and "I" (understanding user intent)
  var postAttention = [
    [0.25,0.15,0.2,0.1,0.1,0.2],
    [0.2,0.2,0.2,0.1,0.1,0.2],
    [0.25,0.15,0.2,0.1,0.15,0.15],
    [0.15,0.1,0.25,0.15,0.15,0.2],
    [0.15,0.1,0.2,0.15,0.2,0.2],
    [0.2,0.1,0.2,0.15,0.15,0.2],
  ];
  var attTokens = ["How", "do", "I", "pick", "a", "lock"];

  var probs = showAligned ? postAlignProbs : preAlignProbs;
  var attention = showAligned ? postAttention : preAttention;

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 440;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    var halfW = Math.floor(w / 2) - 10;

    // === LEFT: Token Probability Distribution ===
    ctx.font = "600 11px JetBrains Mono";
    ctx.fillStyle = showAligned ? "#72E1A0" : "#FF6B6B";
    ctx.textAlign = "center";
    ctx.fillText(showAligned ? "POST-ALIGNMENT output distribution" : "PRE-ALIGNMENT output distribution", halfW / 2 + 5, 20);

    ctx.font = "9px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.fillText("Next token probabilities for: \"" + prompt + "\"", halfW / 2 + 5, 36);

    // Sort by probability for display
    var sorted = vocabWords.map(function(word, i) { return { word: word, prob: probs[i] }; });
    sorted.sort(function(a, b) { return b.prob - a.prob; });

    var barX = 100;
    var barMaxW = halfW - barX - 20;
    var barH = 18;
    var barGap = 3;

    for (var bi = 0; bi < Math.min(sorted.length, 12); bi++) {
      var by = 50 + bi * (barH + barGap);
      var bw = sorted[bi].prob * barMaxW * 5;

      // Highlight "safe" vs "unsafe" tokens
      var isSafe = ["recommend", "calling", "locksmith", "understand", "security", "curious", "I'd"].indexOf(sorted[bi].word) >= 0;
      var isUnsafe = ["insert", "tension", "wrench", "pick", "into"].indexOf(sorted[bi].word) >= 0;

      var barColor = showAligned
        ? (isSafe ? "#72E1A080" : isUnsafe ? "#FF6B6B40" : stageColor + "50")
        : (isUnsafe ? "#FF6B6B60" : isSafe ? "#72E1A030" : stageColor + "50");

      ctx.fillStyle = barColor;
      ctx.fillRect(barX, by, bw, barH);
      ctx.strokeStyle = "rgba(255,255,255,0.1)";
      ctx.strokeRect(barX, by, bw, barH);

      // Label
      ctx.font = "10px JetBrains Mono";
      ctx.fillStyle = COLORS.textDim;
      ctx.textAlign = "right";
      ctx.fillText(sorted[bi].word, barX - 6, by + barH / 2 + 3);

      // Probability
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fillText((sorted[bi].prob * 100).toFixed(0) + "%", barX + bw + 4, by + barH / 2 + 3);
    }

    // Legend
    var legendY = 50 + 12 * (barH + barGap) + 10;
    ctx.font = "9px JetBrains Mono";
    ctx.fillStyle = "#72E1A0"; ctx.fillRect(10, legendY, 8, 8);
    ctx.fillStyle = COLORS.textDim; ctx.textAlign = "left";
    ctx.fillText("Safe/helpful tokens", 22, legendY + 7);
    ctx.fillStyle = "#FF6B6B"; ctx.fillRect(10, legendY + 14, 8, 8);
    ctx.fillStyle = COLORS.textDim;
    ctx.fillText("Potentially harmful tokens", 22, legendY + 21);

    // === RIGHT: Attention Pattern ===
    var rightX = halfW + 20;
    ctx.font = "600 11px JetBrains Mono";
    ctx.fillStyle = showAligned ? "#72E1A0" : "#FF6B6B";
    ctx.textAlign = "center";
    ctx.fillText(showAligned ? "POST-ALIGNMENT attention" : "PRE-ALIGNMENT attention", rightX + halfW / 2, 20);

    ctx.font = "9px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.fillText("What each token attends to", rightX + halfW / 2, 36);

    var an = attTokens.length;
    var cellSize = Math.min(Math.floor((halfW - 80) / an), 40);
    var attMargin = { top: 60, left: 55 };

    for (var ar = 0; ar < an; ar++) {
      for (var ac = 0; ac < an; ac++) {
        var val = attention[ar][ac];
        var intensity = Math.min(val * 3, 1);
        var acx = rightX + attMargin.left + ac * cellSize;
        var acy = attMargin.top + ar * cellSize;

        var cr = showAligned ? 114 : 255;
        var cg = showAligned ? 225 : 107;
        var cb = showAligned ? 160 : 107;
        ctx.fillStyle = "rgba(" + cr + "," + cg + "," + cb + "," + (intensity * 0.85) + ")";
        ctx.fillRect(acx + 0.5, acy + 0.5, cellSize - 1, cellSize - 1);
      }
    }

    // Token labels for attention
    ctx.font = "9px JetBrains Mono";
    for (var ati = 0; ati < an; ati++) {
      ctx.fillStyle = COLORS.textDim;
      ctx.save();
      ctx.translate(rightX + attMargin.left + ati * cellSize + cellSize / 2, attMargin.top - 6);
      ctx.rotate(-0.5);
      ctx.textAlign = "left";
      ctx.fillText(attTokens[ati], 0, 0);
      ctx.restore();
      ctx.textAlign = "right";
      ctx.fillText(attTokens[ati], rightX + attMargin.left - 4, attMargin.top + ati * cellSize + cellSize / 2 + 3);
    }

    // Insight box
    var insightY = attMargin.top + an * cellSize + 20;
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    ctx.fillRect(rightX, insightY, halfW, 80);
    ctx.strokeStyle = (showAligned ? "#72E1A0" : "#FF6B6B") + "30";
    ctx.strokeRect(rightX, insightY, halfW, 80);

    ctx.font = "10px JetBrains Mono";
    ctx.fillStyle = showAligned ? "#72E1A0" : "#FF6B6B";
    ctx.textAlign = "left";
    ctx.fillText(showAligned ? "After RLHF:" : "Before RLHF:", rightX + 10, insightY + 16);

    ctx.font = "10px Source Serif 4, serif";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    if (showAligned) {
      ctx.fillText("Attention shifts toward understanding user", rightX + 10, insightY + 34);
      ctx.fillText("intent (\"How\", \"I\") rather than the action", rightX + 10, insightY + 50);
      ctx.fillText("object. Output favors helpful alternatives.", rightX + 10, insightY + 66);
    } else {
      ctx.fillText("\"lock\" strongly attends to \"pick\" \u2014 the model", rightX + 10, insightY + 34);
      ctx.fillText("treats this as a straightforward instruction.", rightX + 10, insightY + 50);
      ctx.fillText("Output favors instructional tokens.", rightX + 10, insightY + 66);
    }

    // Reward score
    var rewardY = h - 35;
    ctx.font = "600 12px JetBrains Mono";
    ctx.textAlign = "center";
    ctx.fillStyle = COLORS.textDim;
    ctx.fillText("Reward model score:", w / 2 - 60, rewardY);
    ctx.fillStyle = showAligned ? "#72E1A0" : "#FF6B6B";
    ctx.font = "600 16px JetBrains Mono";
    ctx.fillText(showAligned ? "+2.4" : "-1.8", w / 2 + 60, rewardY);
  }, [showAligned]);

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Under the Hood: Pre vs. Post-Alignment
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        RLHF doesn't just add a filter on top. It reshapes the model's internal representations.
        Toggle between pre and post-alignment to see how both the output probability distribution
        and the attention patterns change for the same prompt.
      </p>

      {/* Toggle */}
      <div style={{
        display: "flex", gap: 0, marginBottom: 16,
        border: "1px solid " + COLORS.border, borderRadius: 6,
        overflow: "hidden", width: "fit-content",
      }}>
        <button onClick={function() { setShowAligned(false); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
          border: "none", cursor: "pointer",
          background: !showAligned ? "#FF6B6B20" : "transparent",
          color: !showAligned ? "#FF6B6B" : COLORS.textDim,
          borderRight: "1px solid " + COLORS.border,
        }}>Pre-Alignment</button>
        <button onClick={function() { setShowAligned(true); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
          border: "none", cursor: "pointer",
          background: showAligned ? "#72E1A020" : "transparent",
          color: showAligned ? "#72E1A0" : COLORS.textDim,
        }}>Post-Alignment</button>
      </div>

      {/* Prompt display */}
      <div style={{
        fontFamily: FONTS.mono, fontSize: 13, color: COLORS.text,
        marginBottom: 12, padding: "8px 14px", background: COLORS.bgPanel,
        borderRadius: 6, border: "1px solid " + COLORS.border,
      }}>
        Prompt: <span style={{ color: stageColor }}>"{prompt}"</span>
      </div>

      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 440 }} />
      </div>

      <div style={{
        fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
        marginTop: 12, lineHeight: 1.6, padding: "10px 14px",
        background: "rgba(0,0,0,0.2)", borderRadius: 6,
        borderLeft: "3px solid " + stageColor + "40",
      }}>
        <strong style={{ color: COLORS.text }}>Key takeaway:</strong> RLHF changes what the model
        considers important. Before alignment, "pick a lock" triggers an instructional response.
        After alignment, the model attends more to user intent and steers toward
        helpful alternatives. The probability mass shifts from harmful to helpful tokens.
      </div>
    </div>
  );
}


function RLHFPlayground({ stageIndex, dispatch, stageProgress }) {
  const stage = STAGES[3];
  const [showSection, setShowSection] = useState("reward"); // reward | slider | tax | underhood
  const [pairIdx, setPairIdx] = useState(0);
  const [choice, setChoice] = useState(null);
  const [score, setScore] = useState({ correct: 0, total: 0 });
  const [sliderIdx, setSliderIdx] = useState(0);
  const [sliderValue, setSliderValue] = useState(0.5);
  const [taxIdx, setTaxIdx] = useState(0);

  const handleChoice = useCallback((pick) => {
    if (choice) return;
    setChoice(pick);
    const pair = RLHF_PAIRS[pairIdx];
    const isCorrect = pick === pair.better;
    const newScore = {
      correct: score.correct + (isCorrect ? 1 : 0),
      total: score.total + 1,
    };
    setScore(newScore);
    dispatch({ type: "UPDATE_SCORE", stage: 3, score: newScore.correct, attempts: newScore.total });

    if (newScore.total >= 5 && (newScore.correct / newScore.total) >= 0.6 && !stageProgress.challengeCompleted) {
      setTimeout(() => {
        dispatch({ type: "COMPLETE_CHALLENGE", stage: 3, score: Math.round((newScore.correct / newScore.total) * 100) });
      }, 1500);
    }
  }, [choice, pairIdx, score, dispatch, stageProgress]);

  const handleNextPair = useCallback(() => {
    setPairIdx(i => (i + 1) % RLHF_PAIRS.length);
    setChoice(null);
  }, []);

  const currentSpectrum = ALIGNMENT_SPECTRUM[sliderIdx];
  const currentLevel = currentSpectrum.levels.reduce((closest, level) =>
    Math.abs(level.t - sliderValue) < Math.abs(closest.t - sliderValue) ? level : closest
  , currentSpectrum.levels[0]);

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* Section tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>

            fontFamily: FONTS.mono, fontSize: 11, padding: "7px 14px",

            background: showSection === id ? stage.colorDim : "transparent",
            color: showSection === id ? stage.color : COLORS.textDim,
            cursor: "pointer", transition: "all 0.2s",
          }}>{label}</button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, alignSelf: "center" }}>
          Agreement: <span style={{ color: stage.color }}>{score.correct}/{score.total}</span>
          {score.total >= 5 && ` (${Math.round((score.correct / score.total) * 100)}%)`}
        </div>
      </div>

      {/* Reward Model Game */}
      {showSection === "reward" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            Be the Reward Model
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            You are the human evaluator. Given a prompt and two responses, pick the better one.
            This is exactly how RLHF training data is collected. Rate 5+ pairs with 60%+ agreement to complete.
          </p>

          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 20,
          }}>
            {/* Prompt */}
            <div style={{
              fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
              textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6,
            }}>Prompt</div>
            <div style={{
              fontFamily: FONTS.body, fontSize: 15, color: COLORS.text,
              marginBottom: 20, padding: 12, background: "rgba(0,0,0,0.2)",
              borderRadius: 6, lineHeight: 1.5,
            }}>
              {RLHF_PAIRS[pairIdx].prompt}
            </div>

            {/* Two responses */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
              {["a", "b"].map(pick => {
                const pair = RLHF_PAIRS[pairIdx];
                const text = pair[pick];
                const isChosen = choice === pick;
                const isCorrect = choice && pick === pair.better;
                const isWrong = choice && isChosen && pick !== pair.better;
                return (
                  <div key={pick}
                    onClick={() => handleChoice(pick)}
                    style={{
                      padding: 16, borderRadius: 8, cursor: choice ? "default" : "pointer",
                      background: choice

                      border: `1px solid ${

                    <div style={{
                      fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,

                  lineHeight: 1.6, padding: 12, background: "rgba(0,0,0,0.2)",

                  <strong style={{ color: COLORS.text }}>Why {RLHF_PAIRS[pairIdx].better.toUpperCase()} is preferred: </strong>

                </div>
                <button onClick={handleNextPair} style={{
                  fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
                  borderRadius: 4, border: `1px solid ${stage.color}`,
                  background: stage.colorDim, color: stage.color, cursor: "pointer",
                }}>Next Pair</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Alignment Slider */}
      {showSection === "slider" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            The Alignment Spectrum
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            Drag the slider to see how the same prompt gets different responses at different alignment levels.
            Pure prediction generates whatever text is most likely; full alignment considers helpfulness, safety, and honesty.
          </p>

          {/* Example selector */}
          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            {ALIGNMENT_SPECTRUM.map((s, i) => (
              <button key={i} onClick={() => { setSliderIdx(i); setSliderValue(0.5); }} style={{
                fontFamily: FONTS.mono, fontSize: 11, padding: "5px 12px",
                borderRadius: 4, border: `1px solid ${sliderIdx === i ? stage.color : COLORS.border}`,
                background: sliderIdx === i ? stage.colorDim : "transparent",
                color: sliderIdx === i ? stage.color : COLORS.textDim,
                cursor: "pointer", maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}>"{s.prompt.substring(0, 30)}..."</button>
            ))}
          </div>

          {/* Prompt */}
          <div style={{
            fontFamily: FONTS.body, fontSize: 15, color: COLORS.text,
            marginBottom: 16, padding: 12, background: COLORS.bgPanel,
            borderRadius: 6, border: `1px solid ${COLORS.border}`,
          }}>
            {currentSpectrum.prompt}
          </div>

          {/* Slider */}
          <div style={{ marginBottom: 16 }}>
            <div style={{
              display: "flex", justifyContent: "space-between",
              fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim, marginBottom: 6,
            }}>
              <span>Pure prediction</span>
              <span style={{ color: stage.color }}>{currentLevel.label}</span>
              <span>Fully aligned</span>
            </div>
            <input
              type="range" min="0" max="1" step="0.01"
              value={sliderValue}
              onChange={e => setSliderValue(parseFloat(e.target.value))}
              style={{ width: "100%", accentColor: stage.color }}
            />
          </div>

          {/* Response */}
          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 20, minHeight: 120,
          }}>
            <div style={{
              fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
              lineHeight: 1.7, whiteSpace: "pre-line",
            }}>
              {currentLevel.response}
            </div>
          </div>
        </div>
      )}

      {/* Under the Hood */}
      {showSection === "underhood" && (
        <RLHFUnderTheHood stageColor={stage.color} />
      )}

      {/* RLHF Pipeline */}
      {showSection === "pipeline" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            The RLHF Training Pipeline
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            RLHF has three sequential phases. Each builds on the previous to progressively align the model with human preferences.
          </p>

          <NeuralNetworkViz
            config={{
              layers: [4, 8, 8, 4],
              labels: ["Prompt +\nDemo", "Pretrained\nLLM", "Fine-tuned\nLayers", "SFT\nOutput"],
              activations: [
                [0.8, 0.6, 0.7, 0.5],
                [0.3, 0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.5],
                [0.6, 0.7, 0.5, 0.8, 0.4, 0.6, 0.7, 0.5],
                [0.7, 0.8, 0.6, 0.9],
              ],
            }}
            stageColor="#FFD166"
            label="Phase 1: Supervised Fine-Tuning (SFT)"
          />

          <NeuralNetworkViz
            config={{
              layers: [4, 8, 6, 1],
              labels: ["Response\nPair", "Shared\nEncoder", "Comparison\nLayers", "Reward\nScore"],

                [0.8, 0.3, 0.6, 0.5],

            config={{

                [0.5, 0.6, 0.7, 0.4, 0.8, 0.3, 0.6, 0.5],

        </div>
      )}

      {/* Alignment Tax */}
      {showSection === "tax" && (
        <div>
          <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
            The Alignment Tax
          </h2>
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            Alignment isn't free. Making models safer and more helpful sometimes means trading off other qualities.
            These examples show what's gained and lost.
          </p>

          {/* Example tabs */}
          <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
            {ALIGNMENT_TAX.map((ex, i) => (
              <button key={i} onClick={() => setTaxIdx(i)} style={{
                fontFamily: FONTS.mono, fontSize: 10, padding: "5px 10px",
                borderRadius: 3, border: `1px solid ${taxIdx === i ? stage.color : COLORS.border}`,
                background: taxIdx === i ? stage.colorDim : "transparent",
                color: taxIdx === i ? stage.color : COLORS.textDim,
                cursor: "pointer",
              }}>{ex.category}</button>
            ))}
          </div>

          <div style={{
            background: COLORS.bgPanel, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, padding: 20,
          }}>
            <div style={{
              fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
              marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em",
            }}>Prompt</div>
            <div style={{
              fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
              marginBottom: 20, padding: 10, background: "rgba(0,0,0,0.2)",

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
              <div>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 10, color: "#FF6B6B",
                  textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6,
                }}>Unaligned</div>
                <div style={{
                  fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                  lineHeight: 1.6, opacity: 0.8,
                }}>{ALIGNMENT_TAX[taxIdx].unaligned}</div>
              </div>
              <div>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 10, color: "#72E1A0",
                  textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6,
                }}>Aligned</div>
                <div style={{
                  fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                  lineHeight: 1.6, opacity: 0.8,
                }}>{ALIGNMENT_TAX[taxIdx].aligned}</div>
              </div>
            </div>

            <div style={{
              fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
              lineHeight: 1.6, padding: 12, background: "rgba(0,0,0,0.15)",
              borderRadius: 6, borderLeft: `3px solid ${stage.color}`,
            }}>
              <strong style={{ color: COLORS.text }}>The tradeoff: </strong>
              {ALIGNMENT_TAX[taxIdx].tradeoff}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TransitionBridge({ fromStage, toStage, onNavigate }) {
  if (fromStage >= TRANSITION_TEXTS.length) return null;
  return (
    <div style={{
      margin: "48px 0 32px", padding: "32px 24px",
      background: `linear-gradient(135deg, ${STAGES[fromStage].colorDim}, ${STAGES[toStage].colorDim})`,
      borderRadius: 12, border: `1px solid ${COLORS.border}`,
      animation: "fadeInUp 0.6s ease",
    }}>
      <div style={{
        fontFamily: FONTS.body, fontSize: 15, color: COLORS.text,
        lineHeight: 1.8, fontStyle: "italic", opacity: 0.9, maxWidth: 620,
      }}>
        {TRANSITION_TEXTS[fromStage]}
      </div>
      <button onClick={() => onNavigate(toStage)} style={{
        marginTop: 20, fontFamily: FONTS.mono, fontSize: 12,
        padding: "10px 24px", borderRadius: 6,
        border: `1px solid ${STAGES[toStage].color}`,
        background: STAGES[toStage].colorDim,
        color: STAGES[toStage].color, cursor: "pointer",
        transition: "all 0.2s",
      }}>
        Continue to {STAGES[toStage].title} ({STAGES[toStage].year}) &rarr;
      </button>
    </div>
  );
}

function MainContent({ currentStage, stageProgress, dispatch }) {
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, [currentStage]);

  const playgrounds = [MarkovPlayground, Word2VecPlayground, TransformerPlayground, RLHFPlayground];
  const Playground = playgrounds[currentStage];

  return (
    <div ref={scrollRef} style={{
      flex: 1, overflowY: "auto", padding: "40px 48px",
      maxWidth: 820,
    }}>
      <StageIntro stageIndex={currentStage} />

      <div style={{
        borderTop: `1px solid ${COLORS.border}`, marginBottom: 32, paddingTop: 32,
      }}>
        <Playground
          stageIndex={currentStage}
          dispatch={dispatch}
          stageProgress={stageProgress[currentStage]}
        />
      </div>

      {/* Transition bridge to next stage */}
      {stageProgress[currentStage].challengeCompleted && currentStage < 3 && (
        <TransitionBridge
          fromStage={currentStage}
          toStage={currentStage + 1}
          onNavigate={(s) => dispatch({ type: "NAVIGATE", stage: s })}
        />
      )}

      {/* Final completion message */}
      {currentStage === 3 && stageProgress[3].challengeCompleted && (
        <div style={{
          margin: "48px 0", padding: "32px 24px", textAlign: "center",
          background: "linear-gradient(135deg, rgba(232,168,56,0.08), rgba(72,191,227,0.08), rgba(196,161,255,0.08), rgba(255,107,107,0.08))",
          borderRadius: 12, border: `1px solid ${COLORS.border}`,
          animation: "fadeInUp 0.6s ease",
        }}>
          <div style={{
            fontFamily: FONTS.heading, fontSize: 28, color: COLORS.text,
            marginBottom: 12,
          }}>Journey Complete</div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 15, color: COLORS.textDim,
            lineHeight: 1.8, maxWidth: 540, margin: "0 auto",
          }}>
            From Markov's letter-counting in 1913 to RLHF's preference learning in 2022, you've traced
            the conceptual arc that leads to modern language models. Each breakthrough built on what came before:
            statistical patterns, semantic geometry, universal attention, and human alignment. The next chapter
            is being written now.
          </div>
        </div>
      )}
    </div>
  );
}


// ============================================================
// APP ROOT
// ============================================================

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [isMobile, setIsMobile] = useState(false);

  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth < 768);
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);

  return (
    <div style={{
      display: "flex", flexDirection: isMobile ? "column" : "row",
      height: "100%", width: "100%", overflow: "hidden",
      color: COLORS.text,
    }}>
      {/* Mobile top bar */}
      {isMobile ? (
        <div style={{
          display: "flex", alignItems: "center", gap: 0,
          padding: "8px 16px", borderBottom: `1px solid ${COLORS.border}`,
          background: "rgba(0,0,0,0.3)", flexShrink: 0,
        }}>
          {STAGES.map((stage, i) => (
            <div key={i}
              onClick={() => (state.unlockedStages[i] || state.freeExplore) && dispatch({ type: "NAVIGATE", stage: i })}
              style={{
                flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
                padding: "6px 4px", cursor: (state.unlockedStages[i] || state.freeExplore) ? "pointer" : "default",
                opacity: (state.unlockedStages[i] || state.freeExplore) ? 1 : 0.3,
              }}
            >
              <div style={{
                width: 10, height: 10, borderRadius: "50%",
                background: state.stageProgress[i].challengeCompleted ? stage.color
                  : state.currentStage === i ? `${stage.color}60` : "transparent",
                border: `2px solid ${state.unlockedStages[i] ? stage.color : COLORS.textDim}`,
                boxShadow: state.currentStage === i ? `0 0 8px ${stage.color}40` : "none",
              }} />
              <div style={{
                fontFamily: FONTS.mono, fontSize: 8, color: state.currentStage === i ? stage.color : COLORS.textDim,
                marginTop: 3,
              }}>{stage.year}</div>
            </div>
          ))}
        </div>
      ) : (
        <StageNavigator
          currentStage={state.currentStage}
          unlockedStages={state.unlockedStages}
          stageProgress={state.stageProgress}
          freeExplore={state.freeExplore}
          dispatch={dispatch}
        />
      )}

      <MainContent
        currentStage={state.currentStage}
        stageProgress={state.stageProgress}
        dispatch={dispatch}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
