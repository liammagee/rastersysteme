function Word2VecTrainer({ stageColor }) {
  const [inputText, setInputText] = useState(W2V_TEXT_PRESETS.royalty);
  const [activePreset, setActivePreset] = useState("royalty");
  const [model, setModel] = useState(null);
  const [isTraining, setIsTraining] = useState(false);
  const [selectedWord, setSelectedWord] = useState(null);
  const [params, setParams] = useState({ epochs: 200, dim: 20, windowSize: 2, negSamples: 5, learningRate: 0.05 });
  const [currentEpoch, setCurrentEpoch] = useState(0);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [zoom, setZoom] = useState(1);
  const canvasRef = useRef(null);
  const trainerRef = useRef(null); // holds live training state between frames
  const dragRef = useRef(null);

  // Incremental training: run a batch of epochs per animation frame
  const handleTrain = useCallback(() => {
    // Initialize training state
    const words = inputText.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/).filter(w => w.length > 0);
    const vocab = [...new Set(words)];
    if (vocab.length < 2) return;
    const idx = {}; vocab.forEach((w, i) => idx[w] = i);
    const V = vocab.length;
    const trainDim = params.dim || 20;
    const emb = vocab.map(() => Array.from({ length: trainDim }, () => (Math.random() - 0.5) * 0.1));
    const ctxEmb = vocab.map(() => Array.from({ length: trainDim }, () => 0));
    const freq = new Array(V).fill(0);
    words.forEach(w => freq[idx[w]]++);
    const fp = freq.map(f => Math.pow(f, 0.75));
    const fpSum = fp.reduce((a, b) => a + b, 0);
    const cumDist = []; let cum = 0;
    for (let i = 0; i < V; i++) { cum += fp[i] / fpSum; cumDist.push(cum); }

    trainerRef.current = { words, vocab, idx, V, trainDim, emb, ctxEmb, cumDist, history: [], epoch: 0 };
    setCurrentEpoch(0);
    setIsTraining(true);
    setSelectedWord(null);
    setPan({ x: 0, y: 0 }); setZoom(1);
  }, [inputText, params]);

  // Training loop: run a few epochs per interval tick
  useEffect(() => {
    if (!isTraining || !trainerRef.current) return;
    const batchSize = Math.max(1, Math.min(5, Math.floor(params.epochs / 50))); // epochs per frame
    const interval = setInterval(() => {
      const t = trainerRef.current;
      if (t.epoch >= params.epochs) {
        clearInterval(interval);
        // Final model snapshot
        const pca = computePCA(t.vocab.map((w, i) => ({ v: t.emb[i] })), 2);
        for (let d = 0; d < 2; d++) {
          let ma = 0; for (let i = 0; i < t.V; i++) ma = Math.max(ma, Math.abs(pca.projected[i][d]));
          if (ma > 0) for (let i = 0; i < t.V; i++) pca.projected[i][d] = (pca.projected[i][d] / ma) * 0.85;
        }
        setModel({ vocab: t.vocab, embeddings: pca.projected, fullEmbeddings: t.emb, wordIdx: t.idx, history: t.history, wordCount: t.words.length, trainDim: t.trainDim });
        setIsTraining(false);
        return;
      }
      // Run a batch of epochs
      for (let b = 0; b < batchSize && t.epoch < params.epochs; b++) {
        const lr = params.learningRate - (params.learningRate - 0.001) * (t.epoch / params.epochs);
        let loss = 0, pairs = 0;
        for (let i = 0; i < t.words.length; i++) {
          const ci = t.idx[t.words[i]];
          for (let j = Math.max(0, i - params.windowSize); j <= Math.min(t.words.length - 1, i + params.windowSize); j++) {
            if (j === i) continue;
            const cj = t.idx[t.words[j]];
            const w = t.emb[ci], c = t.ctxEmb[cj];
            let dot = 0; for (let d = 0; d < t.trainDim; d++) dot += w[d] * c[d];
            dot = Math.max(-8, Math.min(8, dot));
            const sig = 1 / (1 + Math.exp(-dot));
            const g = lr * (1 - sig);
            for (let d = 0; d < t.trainDim; d++) { const wd = w[d]; w[d] += g * c[d]; c[d] += g * wd; }
            loss -= Math.log(sig + 1e-10); pairs++;
            for (let n = 0; n < params.negSamples; n++) {
              const r = Math.random(); let lo = 0, hi = t.V - 1;
              while (lo < hi) { const mid = (lo + hi) >> 1; if (t.cumDist[mid] < r) lo = mid + 1; else hi = mid; }
              const ni = lo === ci ? (lo + 1) % t.V : lo;
              const neg = t.ctxEmb[ni];
              let nd = 0; for (let d = 0; d < t.trainDim; d++) nd += w[d] * neg[d];
              nd = Math.max(-8, Math.min(8, nd));
              const ns = 1 / (1 + Math.exp(-nd));
              const ng = lr * ns;
              for (let d = 0; d < t.trainDim; d++) { const wd = w[d]; w[d] -= ng * neg[d]; neg[d] -= ng * wd; }
              loss -= Math.log(1 - ns + 1e-10);
            }
          }
        }
        t.history.push(pairs > 0 ? loss / pairs : 0);
        t.epoch++;
      }
      setCurrentEpoch(t.epoch);
      // Live PCA snapshot for display
      const pca = computePCA(t.vocab.map((w, i) => ({ v: t.emb[i] })), 2);
      for (let d = 0; d < 2; d++) {
        let ma = 0; for (let i = 0; i < t.V; i++) ma = Math.max(ma, Math.abs(pca.projected[i][d]));
        if (ma > 0) for (let i = 0; i < t.V; i++) pca.projected[i][d] = (pca.projected[i][d] / ma) * 0.85;
      }
      setModel({ vocab: t.vocab, embeddings: pca.projected, fullEmbeddings: t.emb, wordIdx: t.idx, history: [...t.history], wordCount: t.words.length, trainDim: t.trainDim });
    }, 50); // ~20fps
    return () => clearInterval(interval);
  }, [isTraining, params]);

  const handleStop = useCallback(() => {
    setIsTraining(false);
  }, []);

  // Get neighbors using full high-D embeddings (not the 2D projection)
  const neighbors = useMemo(() => {
    if (!model || !selectedWord) return [];
    const si = model.wordIdx[selectedWord];
    if (si === undefined) return [];
    const fullEmb = model.fullEmbeddings || model.embeddings;
    const sv = fullEmb[si];
    return model.vocab
      .filter(w => w !== selectedWord)
      .map(w => {
        const wi = model.wordIdx[w];
        const wv = fullEmb[wi];
        const sim = cosineSim(sv, wv);
        return { word: w, sim };
      })
      .sort((a, b) => b.sim - a.sim)
      .slice(0, 8);
  }, [model, selectedWord]);

  // Draw embeddings
  useEffect(() => {
    if (!model) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const container = canvas.parentElement;
    const w = container.clientWidth, h = 420;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#08080A"; ctx.fillRect(0, 0, w, h);

    const margin = 24, plotW = w - margin * 2, plotH = h - margin * 2;
    const cx = margin + plotW / 2 + pan.x, cy = margin + plotH / 2 + pan.y;
    const sc = zoom;

    // Crosshair
    ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(margin, cy); ctx.lineTo(margin + plotW, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, margin); ctx.lineTo(cx, margin + plotH); ctx.stroke();

    const tx = (x) => cx + x * sc * (plotW / 2);
    const ty = (y) => cy + y * sc * (plotH / 2);

    // Neighbor lines
    if (selectedWord && model.wordIdx[selectedWord] !== undefined) {
      const si = model.wordIdx[selectedWord];
      const sv = model.embeddings[si];
      for (const n of neighbors) {
        const ni = model.wordIdx[n.word];
        const nv = model.embeddings[ni];
        ctx.beginPath(); ctx.moveTo(tx(sv[0]), ty(sv[1])); ctx.lineTo(tx(nv[0]), ty(nv[1]));
        ctx.strokeStyle = "rgba(255,255,255," + (n.sim * 0.3) + ")";
        ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
      }
    }

    // Words
    for (let i = 0; i < model.vocab.length; i++) {
      const word = model.vocab[i];
      const [ex, ey] = model.embeddings[i];
      const sx = tx(ex), sy = ty(ey);
      const isSel = selectedWord === word;
      const isNeighbor = neighbors.some(n => n.word === word);

      if (isSel) {
        ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI * 2);
        const grd = ctx.createRadialGradient(sx, sy, 4, sx, sy, 12);
        grd.addColorStop(0, stageColor + "30"); grd.addColorStop(1, stageColor + "00");
        ctx.fillStyle = grd; ctx.fill();
      }

      ctx.beginPath(); ctx.arc(sx, sy, isSel ? 5 : isNeighbor ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = isSel ? "#fff" : stageColor + "cc"; ctx.fill();
      if (isSel) { ctx.strokeStyle = stageColor; ctx.lineWidth = 2; ctx.stroke(); }

      ctx.font = (isSel || isNeighbor ? "600 12px" : "11px") + " JetBrains Mono";
      ctx.fillStyle = "rgba(255,255,255," + (isSel ? 1 : 0.6) + ")";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(word, sx, sy - 7);
    }

    // Loss curve in corner
    if (model.history.length > 1) {
      const lx = w - 130, ly = 10, lw = 110, lh = 45;
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(lx, ly, lw, lh);
      ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.strokeRect(lx, ly, lw, lh);
      ctx.font = "10px JetBrains Mono"; ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.textAlign = "left"; ctx.fillText("loss", lx + 4, ly + 10);
      const maxLoss = Math.max(...model.history);
      ctx.beginPath();
      model.history.forEach((loss, i) => {
        const px = lx + (i / (model.history.length - 1)) * lw;
        const py = ly + lh - (loss / maxLoss) * lh * 0.8;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      });
      ctx.strokeStyle = stageColor; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }, [model, selectedWord, neighbors, stageColor, pan, zoom]);

  // Hit test
  // Pan: drag canvas
  const handleCanvasMouseDown = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    dragRef.current = { lastX: e.clientX - rect.left, lastY: e.clientY - rect.top };
  }, []);
  const handleCanvasMouseMove = useCallback((e) => {
    if (!dragRef.current) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    setPan(p => ({ x: p.x + (mx - dragRef.current.lastX), y: p.y + (my - dragRef.current.lastY) }));
    dragRef.current.lastX = mx; dragRef.current.lastY = my;
  }, []);
  const handleCanvasMouseUp = useCallback(() => { dragRef.current = null; }, []);
  // Zoom: scroll wheel
  const handleCanvasWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.3, Math.min(5, z * (e.deltaY < 0 ? 1.1 : 0.9))));
  }, []);

  const handleCanvasClick = useCallback((e) => {
    if (!model) return;
    if (dragRef.current) return; // was dragging, not clicking
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const plotW = rect.width - 48, plotH = 420 - 48;
    const ccx = 24 + plotW / 2 + pan.x, ccy = 24 + plotH / 2 + pan.y;
    let found = null, bestDist = 18;
    for (let i = 0; i < model.vocab.length; i++) {
      const [ex, ey] = model.embeddings[i];
      const sx = ccx + ex * zoom * (plotW / 2), sy = ccy + ey * zoom * (plotH / 2);
      const d = Math.sqrt((mx - sx) ** 2 + (my - sy) ** 2);
      if (d < bestDist) { found = model.vocab[i]; bestDist = d; }
    }
    setSelectedWord(found);
  }, [model, pan, zoom]);

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Train Word2Vec on Your Text
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        A real skip-gram with negative sampling, running in your browser. Enter text, click Train,
        and watch the algorithm learn 2D word vectors from scratch. Words that share context will cluster together.
      </p>

      {/* Text input */}
      <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        {Object.entries(W2V_TEXT_PRESETS).map(([key, text]) => (
          <button key={key} onClick={() => { setActivePreset(key); setInputText(text); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "5px 12px", borderRadius: 4,
            border: "1px solid " + (activePreset === key ? stageColor : COLORS.border),
            background: activePreset === key ? stageColor + "15" : "transparent",
            color: activePreset === key ? stageColor : COLORS.textDim, cursor: "pointer", textTransform: "capitalize",
          }}>{key}</button>
        ))}
        <button onClick={() => { setActivePreset("custom"); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "5px 12px", borderRadius: 4,
          border: "1px solid " + (activePreset === "custom" ? stageColor : COLORS.border),
          background: activePreset === "custom" ? stageColor + "15" : "transparent",
          color: activePreset === "custom" ? stageColor : COLORS.textDim, cursor: "pointer",
        }}>custom</button>
      </div>
      <textarea value={inputText} onChange={e => { setInputText(e.target.value); setActivePreset("custom"); }} style={{
        width: "100%", minHeight: 80, padding: 12, fontFamily: FONTS.mono, fontSize: 13, lineHeight: 1.6,
        background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 8, color: COLORS.text, outline: "none", resize: "vertical", marginBottom: 12,
      }} />

      {/* Parameters + Train button */}
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
        {[["Epochs", "epochs", [50, 100, 200, 500, 1000]], ["Dim", "dim", [5, 10, 20, 50]], ["Window", "windowSize", [1, 2, 3, 4]]].map(([label, key, options]) => (
          <div key={key} style={{ display: "flex", gap: 4, alignItems: "center" }}>
            <label style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim }}>{label}:</label>
            <select value={params[key]} onChange={e => setParams({ ...params, [key]: parseInt(e.target.value) })} disabled={isTraining} style={{
              fontFamily: FONTS.mono, fontSize: 12, padding: "3px 6px", background: COLORS.bgPanel,
              border: "1px solid " + COLORS.border, borderRadius: 4, color: COLORS.text, outline: "none",
            }}>
              {options.map(v => <option key={v} value={v}>{v}</option>)}
            </select>
          </div>
        ))}
        <button onClick={isTraining ? handleStop : handleTrain} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px", borderRadius: 6,
          border: "1px solid " + (isTraining ? "#FF6B6B" : stageColor),
          background: (isTraining ? "#FF6B6B" : stageColor) + "15",
          color: isTraining ? "#FF6B6B" : stageColor, cursor: "pointer",
        }}>{isTraining ? "Stop" : "Train"}</button>
        {model && (
          <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim }}>
            {model.vocab.length} words &middot; {model.trainDim || 2}D &rarr; 2D
            {isTraining && <span style={{ color: stageColor }}> &middot; epoch {currentEpoch}/{params.epochs}</span>}
            {!isTraining && <span> &middot; {model.history.length} epochs</span>}
          </div>
        )}
      </div>

      {/* Canvas */}
      {model && (
        <div>
          <div style={{ background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 8, overflow: "hidden", marginBottom: 12 }}>
            <canvas ref={canvasRef} onClick={handleCanvasClick}
              onMouseDown={handleCanvasMouseDown} onMouseMove={handleCanvasMouseMove}
              onMouseUp={handleCanvasMouseUp} onMouseLeave={handleCanvasMouseUp}
              onWheel={handleCanvasWheel}
              style={{ width: "100%", height: 420, cursor: "grab" }} />
          </div>
          {selectedWord && (
            <div style={{ background: COLORS.bgPanel, border: "1px solid " + COLORS.border, borderRadius: 8, padding: 14, animation: "fadeInUp 0.3s ease" }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
                Nearest to <span style={{ color: stageColor, fontWeight: 600 }}>{selectedWord}</span> (cosine similarity):
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {neighbors.map(n => (
                  <button key={n.word} onClick={() => setSelectedWord(n.word)} style={{
                    fontFamily: FONTS.mono, fontSize: 12, padding: "5px 12px", borderRadius: 4,
                    background: COLORS.bgPanelHover, border: "1px solid " + COLORS.border,
                    color: COLORS.text, cursor: "pointer",
                  }}>{n.word} <span style={{ color: stageColor, fontSize: 10 }}>{n.sim.toFixed(3)}</span></button>
                ))}
              </div>
            </div>
          )}
          <div style={{
            fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim,
            marginTop: 12, lineHeight: 1.5, fontStyle: "italic",
          }}>
            These positions were learned by the skip-gram algorithm from your text alone.
            Try adding more sentences about a topic to see tighter clusters form.
          </div>
        </div>
      )}
    </div>
  );
}


function Word2VecPlayground({ stageIndex, dispatch, stageProgress }) {

    WORD_DATA.filter(w => activeClusters.has(w.c)),
  [activeClusters]);

    if (!selectedWord) return [];
    const sw = WORD_DATA.find(w => w.w === selectedWord);
    if (!sw) return [];
    return findNearest(sw.v, WORD_DATA, [selectedWord], 6);
  }, [selectedWord]);

      .sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.w);

  }, [analogyIdx]);

      ctx.beginPath(); ctx.moveTo(gx, margin.top); ctx.lineTo(gx, margin.top + plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(margin.left, gy); ctx.lineTo(margin.left + plotW, gy); ctx.stroke();
    }

    ctx.textAlign = "center";

      if (isSelected || isHovered) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }

      ctx.font = fontSize + "px JetBrains Mono";
      ctx.fillStyle = "rgba(255,255,255," + (dimmed ? 0.12 : (isHovered || isSelected ? 1 : 0.6)) + ")";

    if (showMode === "analogy" && analogyResult) {
      const puzzle = ANALOGY_PUZZLES[analogyIdx];
      const aw = WORD_DATA.find(w => w.w === puzzle.a), bw = WORD_DATA.find(w => w.w === puzzle.b);
      const cw2 = WORD_DATA.find(w => w.w === puzzle.c), dw = WORD_DATA.find(w => w.w === analogyResult[0]?.word);
      if (aw && bw && cw2) {
        drawArr(ctx, tx(aw.px), ty(aw.py), tx(bw.px), ty(bw.py), stage.color);
        if (dw) drawArr(ctx, tx(cw2.px), ty(cw2.py), tx(dw.px), ty(dw.py), "#72E1A0");
      }
    }
  }, [filteredWords, hoveredWord, selectedWord, nearest, searchQuery, showMode, analogyResult, analogyIdx, stage.color]);

  function drawArr(ctx, x1, y1, x2, y2, color) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 10 * Math.cos(angle - Math.PI / 6), y2 - 10 * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - 10 * Math.cos(angle + Math.PI / 6), y2 - 10 * Math.sin(angle + Math.PI / 6));
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  const handleCanvasMouseMove = useCallback((e) => {
    const canvas = canvasRef.current, rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const plotW = rect.width - 48, plotH = CANVAS_H - 48;
    const ccx = 24 + plotW / 2, ccy = 24 + plotH / 2;
    let found = null, bestDist = 18;
    for (const word of filteredWords) {
      const wx = ccx + word.px * (plotW / 2), wy = ccy + word.py * (plotH / 2);
      const dist = Math.sqrt((mx - wx) ** 2 + (my - wy) ** 2);
      if (dist < bestDist) { found = word.w; bestDist = dist; }
    }
    setHoveredWord(found);
  }, [filteredWords]);

  const handleCanvasClick = useCallback(() => {
    if (hoveredWord) setSelectedWord(hoveredWord === selectedWord ? null : hoveredWord);
  }, [hoveredWord, selectedWord]);

  const handleAnalogySubmit = useCallback(() => {
    const result = solveAnalogy(ANALOGY_PUZZLES[analogyIdx].a, ANALOGY_PUZZLES[analogyIdx].b, ANALOGY_PUZZLES[analogyIdx].c);
    setAnalogyResult(result);
    const isCorrect = result[0]?.word === ANALOGY_PUZZLES[analogyIdx].answer;
    const newScore = {
      correct: analogyScore.correct + (isCorrect || analogyGuess.toLowerCase().trim() === ANALOGY_PUZZLES[analogyIdx].answer ? 1 : 0),
      total: analogyScore.total + 1,
    };
    setAnalogySc(newScore);
    dispatch({ type: "UPDATE_SCORE", stage: 1, score: newScore.correct, attempts: newScore.total });
    if (newScore.correct >= 5 && !stageProgress.challengeCompleted) {
      setTimeout(() => dispatch({ type: "COMPLETE_CHALLENGE", stage: 1, score: newScore.correct }), 1000);
    }
  }, [analogyIdx, analogyGuess, analogyScore, dispatch, stageProgress]);

  const handleNextAnalogy = useCallback(() => {
    setAnalogyIdx(i => (i + 1) % ANALOGY_PUZZLES.length);
    setAnalogyGuess(""); setAnalogyResult(null);
  }, []);

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* 3 tabs only */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        {[["explore", "Explore Space"], ["train", "Train on Text"], ["analogy", "Analogy Solver"], ["arch", "Architecture"]].map(([mode, label]) => (
          <button key={mode} onClick={() => setShowMode(mode)} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px",
            borderRadius: 4, border: "1px solid " + (showMode === mode ? stage.color : COLORS.border),
            background: showMode === mode ? stage.colorDim : "transparent",
            color: showMode === mode ? stage.color : COLORS.textDim,
            cursor: "pointer", transition: "all 0.2s",
          }}>{label}</button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, alignSelf: "center" }}>
          Analogies solved: <span style={{ color: stage.color }}>{analogyScore.correct}</span>/5 to unlock
        </div>
      </div>

      {/* Explore Space */}
      {showMode === "explore" && (
        <div>
          <div style={{ display: "flex", gap: 12, marginBottom: 10, alignItems: "center", flexWrap: "wrap" }}>
            <input type="text" placeholder="Search words..." value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)} style={{
              width: 180, padding: "6px 12px", fontFamily: FONTS.mono, fontSize: 12,
              background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
              borderRadius: 4, color: COLORS.text, outline: "none",
            }} />
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            {Object.entries(CLUSTERS).map(([id, cluster]) => (
              <button key={id} onClick={() => {
                setActiveClusters(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
              }} style={{
                fontFamily: FONTS.mono, fontSize: 12, padding: "3px 10px", borderRadius: 3,
                border: "1px solid " + (activeClusters.has(id) ? cluster.color + "60" : COLORS.border),
                background: activeClusters.has(id) ? cluster.color + "15" : "transparent",
                color: activeClusters.has(id) ? cluster.color : COLORS.textDim,
                cursor: "pointer", transition: "all 0.2s",
              }}>{cluster.label}</button>
            ))}
          </div>
          <div style={{ background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 8, overflow: "hidden", marginBottom: 16 }}>
            <canvas ref={canvasRef} onMouseMove={handleCanvasMouseMove} onMouseDown={handleCanvasClick}
              onMouseLeave={() => setHoveredWord(null)}
              style={{ width: "100%", height: CANVAS_H, cursor: hoveredWord ? "pointer" : "default" }} />
          </div>
          {selectedWord && (
            <div style={{ background: COLORS.bgPanel, border: "1px solid " + COLORS.border, borderRadius: 8, padding: 16, marginBottom: 16, animation: "fadeInUp 0.3s ease" }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 10 }}>
                Nearest neighbors of <span style={{ color: stage.color, fontWeight: 600 }}>{selectedWord}</span> (cosine similarity):
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {nearest.map(n => (
                  <button key={n.word} onClick={() => setSelectedWord(n.word)} style={{
                    fontFamily: FONTS.mono, fontSize: 12, padding: "5px 12px", borderRadius: 4,
                    background: COLORS.bgPanelHover, border: "1px solid " + COLORS.border,
                    color: COLORS.text, cursor: "pointer",
                  }}>{n.word} <span style={{ color: stage.color, fontSize: 10 }}>{n.sim.toFixed(3)}</span></button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Train on Text */}
      {showMode === "train" && (
        <Word2VecTrainer stageColor={stage.color} />
      )}

      {/* Analogy Solver */}
      {showMode === "analogy" && (
        <div style={{ background: COLORS.bgPanel, border: "1px solid " + COLORS.border, borderRadius: 8, padding: 20, animation: "fadeInUp 0.3s ease" }}>
          <div style={{ fontFamily: FONTS.heading, fontSize: 18, color: COLORS.text, marginBottom: 12 }}>Vector Analogy</div>
          <div style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
            The relationship between A and B should be the same as C and ???.
            The model computes: vec(B) - vec(A) + vec(C) and finds the nearest word.
          </div>
          <div style={{ fontFamily: FONTS.mono, fontSize: 16, color: COLORS.text, marginBottom: 16, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ color: stage.color }}>{ANALOGY_PUZZLES[analogyIdx].a}</span>
            <span style={{ color: COLORS.textDim }}>is to</span>
            <span style={{ color: stage.color }}>{ANALOGY_PUZZLES[analogyIdx].b}</span>

            layers: [1, 10, 300, 10, 1],

(vocab)", "Embedding\
(300d)", "Hidden", "Output\
(context)"],

function TransformerTrainingSim({ stageColor }) {
  const canvasRef = useRef(null);
  const [epoch, setEpoch] = useState(0);
  const [isTraining, setIsTraining] = useState(false);
  const [speed, setSpeed] = useState(1);

  // Simulated attention pattern evolution: starts uniform, becomes structured
  var tokens = ["The", "cat", "sat", "on", "the", "mat"];
  var n = tokens.length;

  // Target attention patterns for 3 heads
  var targetHeads = [
    // Head 0: positional (nearby tokens)
    [[0.5,0.3,0.1,0.05,0.03,0.02],[0.25,0.4,0.2,0.08,0.04,0.03],[0.08,0.25,0.4,0.15,0.07,0.05],
     [0.04,0.08,0.2,0.4,0.18,0.10],[0.03,0.05,0.08,0.2,0.4,0.24],[0.02,0.03,0.05,0.10,0.25,0.55]],
    // Head 1: syntactic (subject-verb, det-noun)
    [[0.4,0.4,0.05,0.05,0.05,0.05],[0.3,0.2,0.35,0.05,0.05,0.05],[0.1,0.35,0.2,0.15,0.1,0.1],
     [0.05,0.05,0.15,0.3,0.2,0.25],[0.05,0.05,0.05,0.15,0.3,0.40],[0.05,0.05,0.1,0.25,0.30,0.25]],
    // Head 2: semantic (content words attend to each other)
    [[0.2,0.15,0.15,0.15,0.15,0.2],[0.1,0.25,0.15,0.05,0.05,0.40],[0.1,0.15,0.25,0.20,0.10,0.20],
     [0.1,0.1,0.2,0.3,0.15,0.15],[0.1,0.05,0.10,0.15,0.30,0.30],[0.08,0.30,0.12,0.10,0.15,0.25]],
  ];
  var headLabels = ["Positional", "Syntactic", "Semantic"];

  // Interpolate from uniform to target
  var progress = Math.min(epoch / 60, 1);
  var eased = 1 - Math.pow(1 - progress, 2);

  useEffect(function() {
    if (!isTraining) return;
    var interval = setInterval(function() {
      setEpoch(function(e) { return e + 1; });
    }, 100 / speed);
    return function() { clearInterval(interval); };
  }, [isTraining, speed]);

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var container = canvas.parentElement;
    var w = container.clientWidth;
    var h = 360;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#08080A";
    ctx.fillRect(0, 0, w, h);

    var headW = Math.floor((w - 40) / 3);
    var cellSize = Math.min(Math.floor((headW - 60) / n), 36);
    var margin = { top: 55, left: 50 };

    for (var hi = 0; hi < 3; hi++) {
      var offsetX = 10 + hi * (headW + 10);

      // Head label
      ctx.font = "600 11px JetBrains Mono";
      ctx.fillStyle = stageColor;
      ctx.textAlign = "center";
      ctx.fillText("Head " + (hi + 1) + ": " + headLabels[hi], offsetX + margin.left + (n * cellSize) / 2, 16);

      // Draw attention matrix
      for (var row = 0; row < n; row++) {
        for (var col = 0; col < n; col++) {
          var uniform = 1 / n;
          var target = targetHeads[hi][row][col];
          var val = uniform + (target - uniform) * eased;
          // Add noise that decreases with training
          var noise = (Math.random() - 0.5) * 0.08 * (1 - eased);
          val = Math.max(0, Math.min(1, val + noise));

          var intensity = Math.min(val * 3, 1);
          var cr = parseInt(stageColor.slice(1, 3), 16);
          var cg = parseInt(stageColor.slice(3, 5), 16);
          var cb = parseInt(stageColor.slice(5, 7), 16);

          var x = offsetX + margin.left + col * cellSize;
          var y = margin.top + row * cellSize;

          ctx.fillStyle = "rgba(" + cr + "," + cg + "," + cb + "," + (intensity * 0.9) + ")";
          ctx.fillRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
        }
      }

      // Token labels
      ctx.font = "11px JetBrains Mono";
      ctx.fillStyle = COLORS.textDim;
      for (var ti = 0; ti < n; ti++) {
        ctx.textAlign = "center";
        ctx.save();
        ctx.translate(offsetX + margin.left + ti * cellSize + cellSize / 2, margin.top - 6);
        ctx.rotate(-0.5);
        ctx.fillText(tokens[ti], 0, 0);
        ctx.restore();
        ctx.textAlign = "right";
        ctx.fillText(tokens[ti], offsetX + margin.left - 4, margin.top + ti * cellSize + cellSize / 2 + 3);
      }
    }

    // Training progress & loss
    var lossY = margin.top + n * cellSize + 20;
    ctx.font = "11px JetBrains Mono";
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = "left";
    ctx.fillText("Training progress", 10, lossY + 10);

    // Progress bar
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(10, lossY + 18, w - 20, 8);
    ctx.fillStyle = stageColor + "80";
    ctx.fillRect(10, lossY + 18, (w - 20) * eased, 8);

    // Loss value
    var loss = 2.5 * Math.exp(-epoch * 0.03) + 0.4;
    ctx.fillStyle = stageColor;
    ctx.textAlign = "right";
    ctx.fillText("loss: " + loss.toFixed(2), w - 10, lossY + 10);

    // Phase label
    ctx.textAlign = "center";
    ctx.fillStyle = COLORS.textDim;
    ctx.font = "11px JetBrains Mono";
    var phase = eased < 0.2 ? "Random initialization" : eased < 0.5 ? "Patterns emerging..." : eased < 0.8 ? "Heads specializing" : "Converged";
    ctx.fillText(phase, w / 2, lossY + 45);
  }, [epoch, eased]);

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Watch Attention Heads Form
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        Three attention heads start with uniform (random) weights. As training progresses, each head specializes:
        one learns positional patterns (nearby tokens), one learns syntactic roles (subject-verb),
        and one learns semantic relationships (content words). This specialization emerges from the training signal alone.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
        <button onClick={function() { setIsTraining(!isTraining); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 18px",
          borderRadius: 4, border: "1px solid " + stageColor,
          background: isTraining ? stageColor + "20" : "transparent",
          color: stageColor, cursor: "pointer",
        }}>{isTraining ? "Pause" : "Train"}</button>
        <button onClick={function() { setIsTraining(false); setEpoch(0); }} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "7px 14px",
          borderRadius: 4, border: "1px solid " + COLORS.border,
          background: "transparent", color: COLORS.textDim, cursor: "pointer",
        }}>Reset</button>
        {[1, 2, 4].map(function(s) { return (
          <button key={s} onClick={function() { setSpeed(s); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, width: 28, height: 24,
            borderRadius: 3, border: "1px solid " + (speed === s ? stageColor : COLORS.border),
            background: speed === s ? stageColor + "15" : "transparent",
            color: speed === s ? stageColor : COLORS.textDim, cursor: "pointer",
          }}>{s}x</button>
        ); })}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stageColor }}>
          Epoch {epoch}
        </div>
      </div>

      <div style={{
        background: "#08080A", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
      }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: 360 }} />
      </div>
    </div>
  );
}


function TransformerArchitectureDetail({ stageColor }) {
  const [step, setStep] = useState(0);

  // Run the example "the cat sat on the" through the real TINY_TRANSFORMER
  const example = useMemo(() => {
    const tokens = ["the", "cat", "sat", "on", "the"];
    const { dim, embeddings, Wq, Wk, Wv } = TINY_TRANSFORMER;

    // Step 1: Raw embeddings
    const rawEmb = tokens.map(t => [...embeddings[t]]);

    // Step 2: + Positional encoding
    const posEmb = rawEmb.map((e, pos) => {
      const pe = e.map((v, i) => v + 0.1 * Math.sin(pos / Math.pow(10, (2 * i) / dim)));
      return pe;
    });

    // Step 3: Q, K, V projections
    function mv(M, v) { return M.map(row => row.reduce((s, w, i) => s + w * v[i], 0)); }
    const Q = posEmb.map(e => mv(Wq, e));
    const K = posEmb.map(e => mv(Wk, e));
    const V = posEmb.map(e => mv(Wv, e));

    // Step 4: Attention scores (last token attends to all)
    const n = tokens.length;
    const lastQ = Q[n - 1];
    const rawScores = K.map(k => k.reduce((s, v, i) => s + lastQ[i] * v, 0) / Math.sqrt(dim));
    const maxS = Math.max(...rawScores);
    const expS = rawScores.map(s => Math.exp(s - maxS));
    const sumE = expS.reduce((a, b) => a + b, 0);
    const attention = expS.map(e => e / sumE);

    // Step 5: Weighted context
    const context = new Array(dim).fill(0);
    for (let i = 0; i < n; i++) for (let d = 0; d < dim; d++) context[d] += attention[i] * V[i][d];

    // Step 6: Output logits + softmax
    const vocab = TINY_TRANSFORMER.vocab;
    const logits = vocab.map(w => ({ word: w, logit: embeddings[w].reduce((s, v, i) => s + v * context[i], 0) }));
    const maxL = Math.max(...logits.map(l => l.logit));
    const expL = logits.map(l => Math.exp(l.logit - maxL));
    const sumL = expL.reduce((a, b) => a + b, 0);
    const predictions = logits.map((l, i) => ({ word: l.word, prob: expL[i] / sumL })).sort((a, b) => b.prob - a.prob);

    return { tokens, dim, rawEmb, posEmb, Q, K, V, rawScores, attention, context, predictions };
  }, []);

  const STEPS = [
    { title: "1. Input Tokens", color: "#E8E4DE" },
    { title: "2. Token Embedding", color: "#FFD166" },
    { title: "3. Positional Encoding", color: "#FF9F43" },
    { title: "4. Q, K, V Projection", color: "#C4A1FF" },
    { title: "5. Attention Scores", color: "#C4A1FF" },
    { title: "6. Weighted Context", color: "#48BFE3" },
    { title: "7. Output Softmax", color: "#FF6B6B" },
    { title: "8. Backpropagation", color: "#72E1A0" },
  ];

  function VecDisplay({ label, vec, color, highlight }) {
    return (
      <div style={{ marginBottom: 6 }}>
        {label && <span style={{ fontFamily: FONTS.mono, fontSize: 11, color: color || COLORS.textDim, marginRight: 8, display: "inline-block", width: 40 }}>{label}</span>}
        <span style={{ fontFamily: FONTS.mono, fontSize: 11 }}>
          [
          {vec.map((v, i) => (
            <span key={i} style={{ color: highlight === i ? "#fff" : (Math.abs(v) > 0.3 ? COLORS.text : COLORS.textDim) }}>
              {v.toFixed(2)}{i < vec.length - 1 ? ", " : ""}
            </span>
          ))}
          ]
        </span>
      </div>
    );
  }

  function StepBox({ children, title, color }) {
    return (
      <div style={{
        background: COLORS.bgPanel, border: "1px solid " + (color || COLORS.border),
        borderRadius: 8, padding: "14px 18px", marginBottom: 12, animation: "fadeInUp 0.3s ease",
      }}>
        {title && <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: color || stageColor, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>{title}</div>}
        {children}
      </div>
    );
  }

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Transformer Architecture
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        Follow <strong style={{ color: stageColor }}>"the cat sat on the ___"</strong> through every layer of a transformer.
        The model's job: predict that the missing word is <strong style={{ color: "#72E1A0" }}>"mat"</strong>.
        Real numbers from our 8-dimensional model.
      </p>

      {/* At-a-glance pipeline */}
      <div style={{
        display: "flex", gap: 0, marginBottom: 20, overflowX: "auto", padding: "4px 0",
      }}>
        {ARCH_STEPS.map((s, i) => (
          <div key={s.id} style={{ display: "flex", alignItems: "center" }}>
            <div onClick={() => setStep(i)} style={{
              padding: "6px 10px", borderRadius: 4, cursor: "pointer", whiteSpace: "nowrap",
              background: step === i ? s.color + "20" : "transparent",
              border: "1px solid " + (step === i ? s.color + "50" : "transparent"),
              transition: "all 0.2s",
            }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: s.color, fontWeight: 600 }}>{s.label}</div>
              <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: COLORS.textDim, marginTop: 1 }}>{s.desc.substring(0, 35)}...</div>
            </div>
            {i < ARCH_STEPS.length - 1 && (
              <div style={{ color: COLORS.textDim, fontSize: 12, padding: "0 2px" }}>{"\u2192"}</div>
            )}
          </div>
        ))}
      </div>

      {/* Detailed step selector */}
      <div style={{ display: "flex", gap: 0, marginBottom: 20, flexWrap: "wrap" }}>
        {STEPS.map((s, i) => (
          <button key={i} onClick={() => setStep(i)} style={{
            fontFamily: FONTS.mono, fontSize: 11, padding: "6px 10px",
            border: "1px solid " + (step === i ? s.color + "60" : COLORS.border),
            borderRight: i < STEPS.length - 1 ? "none" : undefined,
            borderRadius: i === 0 ? "4px 0 0 4px" : i === STEPS.length - 1 ? "0 4px 4px 0" : 0,
            background: step === i ? s.color + "15" : "transparent",
            color: step === i ? s.color : COLORS.textDim, cursor: "pointer",
          }}>{i + 1}</button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: STEPS[step].color, alignSelf: "center" }}>{STEPS[step].title}</div>
      </div>

      {/* Step 1: Input tokens */}
      {step === 0 && (
        <StepBox title="Input Tokens" color="#E8E4DE">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            The sentence is split into tokens. In real transformers, subword tokenization (BPE) splits rare words
            into pieces. Our toy model uses whole words. Each token is just an index into the vocabulary.
          </p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {example.tokens.map((t, i) => (
              <div key={i} style={{ fontFamily: FONTS.mono, fontSize: 14, padding: "8px 14px", borderRadius: 6, background: "rgba(255,255,255,0.05)", border: "1px solid " + COLORS.border, textAlign: "center" }}>
                <div style={{ color: COLORS.text, marginBottom: 2 }}>{t}</div>
                <div style={{ fontSize: 10, color: COLORS.textDim }}>token {i}</div>
              </div>
            ))}
          </div>
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            At this point the model knows nothing about these words. They are arbitrary symbols. The next step gives them meaning.
          </div>
        </StepBox>
      )}

      {/* Step 2: Embeddings */}
      {step === 1 && (
        <StepBox title="Token Embedding (learned lookup table)" color="#FFD166">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            Each token index is used to look up a row from the <strong style={{ color: COLORS.text }}>embedding matrix</strong> (vocabulary size &times; 8 dimensions).
            These vectors are <em>learned during training</em> &mdash; they start random and adjust through backpropagation until
            similar words have similar vectors.
          </p>
          {example.tokens.map((t, i) => <VecDisplay key={i} label={t} vec={example.rawEmb[i]} color="#FFD166" />)}
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            Notice "the" appears twice but gets the <em>same</em> vector both times. The embedding is context-free &mdash; position comes next.
          </div>
        </StepBox>
      )}

      {/* Step 3: Positional encoding */}
      {step === 2 && (
        <StepBox title="+ Positional Encoding (sinusoidal)" color="#FF9F43">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            Transformers process all tokens in parallel (no sequential order like RNNs). To inject position information,
            we <em>add</em> a unique sinusoidal signal to each position. Now the two "the" tokens have
            <strong style={{ color: COLORS.text }}> different</strong> vectors.
          </p>
          {example.tokens.map((t, i) => <VecDisplay key={i} label={t + "[" + i + "]"} vec={example.posEmb[i]} color="#FF9F43" />)}
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            Compare "the" at position 0 vs position 4 &mdash; the sinusoidal encoding makes them distinguishable.
          </div>
        </StepBox>
      )}

      {/* Step 4: Q, K, V */}
      {step === 3 && (
        <StepBox title="Q, K, V Projection (three learned linear transforms)" color="#C4A1FF">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            Each token's embedding is multiplied by three separate weight matrices to produce
            <strong style={{ color: "#C4A1FF" }}> Query</strong> (what am I looking for?),
            <strong style={{ color: "#48BFE3" }}> Key</strong> (what do I contain?), and
            <strong style={{ color: "#72E1A0" }}> Value</strong> (what information do I pass along?).
            These matrices are <em>learned</em> during training.
          </p>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
            Q = embedding &times; W_Q &nbsp;&nbsp; K = embedding &times; W_K &nbsp;&nbsp; V = embedding &times; W_V
          </div>
          {example.tokens.map((t, i) => (
            <div key={i} style={{ marginBottom: 8 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.text, marginBottom: 2 }}>{t}[{i}]:</div>
              <div style={{ paddingLeft: 12 }}>
                <VecDisplay label="Q" vec={example.Q[i]} color="#C4A1FF" />
                <VecDisplay label="K" vec={example.K[i]} color="#48BFE3" />
                <VecDisplay label="V" vec={example.V[i]} color="#72E1A0" />
              </div>
            </div>
          ))}
        </StepBox>
      )}

      {/* Step 5: Attention scores */}
      {step === 4 && (
        <StepBox title="Attention Scores (which tokens matter for prediction?)" color="#C4A1FF">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            To predict the next word after "the" (position 4), we compute how much this token should
            <em> attend to</em> each other token. The score is the dot product of the last token's
            <strong style={{ color: "#C4A1FF" }}> Query</strong> with each token's
            <strong style={{ color: "#48BFE3" }}> Key</strong>, scaled by &radic;d to prevent saturation.
          </p>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 12 }}>
            score[i] = Q["the"[4]] &middot; K[token_i] / &radic;8
          </div>
          <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 100, marginBottom: 12 }}>
            {example.tokens.map((t, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, gap: 4 }}>
                <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim }}>{example.rawScores[i].toFixed(2)}</div>
                <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: stageColor }}>{(example.attention[i] * 100).toFixed(0)}%</div>
                <div style={{
                  width: "100%", maxWidth: 50, background: stageColor,
                  opacity: 0.2 + example.attention[i] * 0.8,
                  height: Math.max(4, example.attention[i] * 80), borderRadius: "3px 3px 0 0",
                }} />
                <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.text }}>{t}</div>
              </div>
            ))}
          </div>
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, fontStyle: "italic" }}>
            The raw scores (top numbers) are passed through <strong style={{ color: COLORS.text }}>softmax</strong> to
            become probabilities (%) that sum to 100%. This is how the model decides which tokens are relevant.
          </div>
        </StepBox>
      )}

      {/* Step 6: Weighted context */}
      {step === 5 && (
        <StepBox title="Weighted Context (attention-weighted sum of Values)" color="#48BFE3">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            The attention weights are used to combine the <strong style={{ color: "#72E1A0" }}>Value</strong> vectors
            into a single context vector. Tokens with higher attention contribute more.
          </p>
          <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 8 }}>
            context = {example.tokens.map((t, i) => (example.attention[i] * 100).toFixed(0) + "% &times; V[" + t + "]").join(" + ")}
          </div>
          <VecDisplay label="ctx" vec={example.context} color="#48BFE3" />
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            This single 8D vector encodes a <em>context-dependent</em> understanding of the sentence up to this point.
            In a real transformer, this is repeated across 12-96 attention heads in parallel, each learning different patterns.
          </div>
        </StepBox>
      )}

      {/* Step 7: Output softmax */}
      {step === 6 && (
        <StepBox title="Output: Softmax over Vocabulary" color="#FF6B6B">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            The context vector is compared (via dot product) against every word's embedding vector.
            The resulting scores are passed through <strong style={{ color: COLORS.text }}>softmax</strong> to
            produce a probability distribution over the entire vocabulary. The model picks the highest-probability word.
          </p>
          {example.predictions.slice(0, 10).map((p, i) => (
            <div key={p.word} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
              <div style={{ fontFamily: FONTS.mono, fontSize: 12, width: 50, textAlign: "right", color: i === 0 ? "#fff" : COLORS.text, fontWeight: i === 0 ? 700 : 400 }}>{p.word}</div>
              <div style={{ flex: 1, height: 16, background: "rgba(255,255,255,0.04)", borderRadius: 3, overflow: "hidden" }}>
                <div style={{ width: (p.prob / example.predictions[0].prob * 100) + "%", height: "100%", background: i === 0 ? "#FF6B6B" : "#FF6B6B50", borderRadius: 3 }} />
              </div>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, width: 45, textAlign: "right" }}>{(p.prob * 100).toFixed(1)}%</div>
            </div>
          ))}
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 10, fontStyle: "italic" }}>
            The model predicts <strong style={{ color: "#FF6B6B" }}>{example.predictions[0].word}</strong> for "the cat sat on the ___".
            During training, the correct answer <strong style={{ color: "#72E1A0" }}>"mat"</strong> was known.
            The model adjusts its weights to increase "mat"'s probability (currently {(example.predictions.find(p => p.word === "mat")?.prob * 100 || 0).toFixed(1)}%)
            and decrease everything else. This is the signal that drives learning.
          </div>
        </StepBox>
      )}

      {/* Step 8: Backpropagation */}
      {step === 7 && (
        <StepBox title="Backpropagation: How the model learns" color="#72E1A0">
          <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6, marginBottom: 12 }}>
            Everything above is the <strong style={{ color: COLORS.text }}>forward pass</strong> &mdash; input goes in, prediction comes out.
            Learning happens in the <strong style={{ color: "#72E1A0" }}>backward pass</strong>:
          </p>

          <div style={{ paddingLeft: 0, marginBottom: 16 }}>
            {[
              { num: "1", title: "Compute loss", desc: "Compare the predicted distribution to the true answer 'mat'. If P(mat) = " + (example.predictions.find(p => p.word === "mat")?.prob * 100 || 0).toFixed(1) + "%, the loss is -log(" + (example.predictions.find(p => p.word === "mat")?.prob || 0.01).toFixed(3) + ") = " + (-Math.log(example.predictions.find(p => p.word === "mat")?.prob || 0.01)).toFixed(2) + ". A perfect prediction (100%) would give loss = 0. The model needs to push 'mat' from " + (example.predictions.find(p => p.word === "mat")?.prob * 100 || 0).toFixed(1) + "% toward 100%." },
              { num: "2", title: "Compute gradients (chain rule)", desc: "For every weight in the network, calculate: 'if I nudged this weight slightly, how much would the loss change?' This uses the chain rule of calculus, propagating the error backward through each layer: output \u2192 softmax \u2192 context \u2192 attention \u2192 Q,K,V matrices \u2192 embeddings." },
              { num: "3", title: "Update weights", desc: "Each weight is adjusted in the direction that reduces the loss: W_new = W_old - learning_rate \u00D7 gradient. A small learning rate means cautious updates. The embedding matrix, Q/K/V projection matrices, and feed-forward weights are ALL updated simultaneously." },
              { num: "4", title: "Repeat", desc: "This process repeats for every training example (billions of sentences). Over time, the embedding matrix learns that 'cat' and 'dog' should have similar vectors. The Q/K/V matrices learn which attention patterns are useful. The model never receives explicit rules \u2014 structure emerges from prediction error alone." },
            ].map(s => (
              <div key={s.num} style={{
                display: "flex", gap: 12, marginBottom: 12, padding: "10px 14px",
                background: "rgba(0,0,0,0.2)", borderRadius: 6, borderLeft: "3px solid #72E1A040",
              }}>
                <div style={{ fontFamily: FONTS.mono, fontSize: 14, color: "#72E1A0", fontWeight: 700, flexShrink: 0 }}>{s.num}</div>
                <div>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.text, marginBottom: 4 }}>{s.title}</div>
                  <div style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6 }}>{s.desc}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, lineHeight: 1.6,
            padding: "12px 16px", background: "#72E1A008", border: "1px solid #72E1A020", borderRadius: 6,
          }}>
            <strong style={{ color: COLORS.text }}>What gets learned:</strong> The embedding matrix (word meanings),
            the Q/K/V weight matrices (what attention patterns are useful), and the feed-forward weights (how to combine information).
            For GPT-4, this means tuning ~1.8 trillion parameters across ~120 transformer layers, trained on trillions of tokens.
            The architecture above is one layer with 8 dimensions &mdash; scale it up and you get modern language models.
          </div>
        </StepBox>
      )}

      {/* Navigation */}
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        {step > 0 && <button onClick={() => setStep(step - 1)} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + COLORS.border, background: "transparent", color: COLORS.textDim, cursor: "pointer" }}>&larr; Previous</button>}
        {step < STEPS.length - 1 && <button onClick={() => setStep(step + 1)} style={{ fontFamily: FONTS.mono, fontSize: 12, padding: "6px 14px", borderRadius: 4, border: "1px solid " + stageColor, background: stageColor + "15", color: stageColor, cursor: "pointer" }}>Next &rarr;</button>}
      </div>
    </div>
  );
}


function TransformerPredictPanel({ stageColor }) {
  const [inputText, setInputText] = useState("the cat sat on the");
  const [result, setResult] = useState(null);

  const predict = useCallback(() => {
    const words = inputText.toLowerCase().trim().split(/\s+/);
    const r = transformerPredict(words);
    setResult(r);
  }, [inputText]);

  // Auto-predict on mount and text change
  useEffect(() => { predict(); }, []);

  const EXAMPLES = [
    "the cat sat on the",
    "the big dog ran to",
    "a small red",
    "the happy cat was very",
    "the dog and the",
  ];

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Next Token Prediction
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        A simplified transformer (8-dimensional embeddings, single attention head, 20-word vocabulary)
        predicts the next token. Try <strong style={{ color: stageColor }}>"the cat sat on the"</strong> &mdash;
        can the model predict <strong style={{ color: "#72E1A0" }}>"mat"</strong>? The pipeline: embed tokens &rarr;
        add positional encoding &rarr; compute attention &rarr; weighted context &rarr; softmax over vocabulary.
      </p>

      {/* Input */}
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <input type="text" value={inputText} onChange={e => setInputText(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") predict(); }}
          style={{
            flex: 1, minWidth: 200, padding: "8px 12px", fontFamily: FONTS.mono, fontSize: 13,
            background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 6,
            color: COLORS.text, outline: "none",
          }}
        />
        <button onClick={predict} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "8px 18px", borderRadius: 6,
          border: "1px solid " + stageColor, background: stageColor + "15",
          color: stageColor, cursor: "pointer",
        }}>Predict</button>
      </div>
      <div style={{ display: "flex", gap: 4, marginBottom: 16, flexWrap: "wrap" }}>
        {EXAMPLES.map(ex => (
          <button key={ex} onClick={() => { setInputText(ex); setTimeout(() => {
            const r = transformerPredict(ex.toLowerCase().trim().split(/\s+/)); setResult(r);
          }, 0); }} style={{
            fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px", borderRadius: 4,
            border: "1px solid " + COLORS.border, background: "transparent",
            color: COLORS.textDim, cursor: "pointer",
          }}>{ex}...</button>
        ))}
      </div>

      <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 16 }}>
        Vocabulary: {TINY_TRANSFORMER.vocab.join(", ")}
      </div>

      {result && (
        <div style={{ animation: "fadeInUp 0.3s ease" }}>
          {/* Step 1: Tokenization */}
          <div style={{
            background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
            borderRadius: 8, padding: 14, marginBottom: 12,
          }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.06em" }}>
              Step 1: Tokenize &amp; embed
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {inputText.toLowerCase().trim().split(/\s+/).map((w, i) => {
                const inVocab = TINY_TRANSFORMER.embeddings[w];
                return (
                  <span key={i} style={{
                    fontFamily: FONTS.mono, fontSize: 13, padding: "4px 10px", borderRadius: 4,
                    background: inVocab ? stageColor + "15" : "rgba(255,107,107,0.1)",
                    border: "1px solid " + (inVocab ? stageColor + "40" : "rgba(255,107,107,0.3)"),
                    color: inVocab ? stageColor : "#FF6B6B",
                  }}>
                    {w}
                    <span style={{ fontSize: 10, opacity: 0.6, marginLeft: 4 }}>{inVocab ? "8D vec + pos" : "unknown"}</span>
                  </span>
                );
              })}
            </div>
          </div>

          {/* Step 2: Attention weights */}
          <div style={{
            background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
            borderRadius: 8, padding: 14, marginBottom: 12,
          }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.06em" }}>
              Step 2: Self-attention (from last token to all tokens)
            </div>
            <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginBottom: 10 }}>
              Each token computes Q, K, V vectors. The last token's query attends to all keys: weight = softmax(Q &middot; K / &radic;d)
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 90 }}>
              {result.attention.map((a, i) => (
                <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, gap: 4 }}>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: stageColor }}>{(a.weight * 100).toFixed(0)}%</div>
                  <div style={{
                    width: "100%", maxWidth: 60, background: stageColor,
                    opacity: 0.2 + a.weight * 0.8,
                    height: Math.max(4, a.weight * 70), borderRadius: "3px 3px 0 0",
                  }} />
                  <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.text }}>{a.token}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Step 3: Weighted context → logits → softmax */}
          <div style={{
            background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
            borderRadius: 8, padding: 14, marginBottom: 12,
          }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.06em" }}>
              Step 3: Predict next token (softmax over vocabulary)
            </div>
            <div style={{ fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginBottom: 10 }}>
              The attention-weighted context vector is compared against every word embedding. Softmax converts to probabilities.
            </div>
            {result.predictions.map((p, i) => (
              <div key={p.word} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 13, width: 55, textAlign: "right",
                  color: i === 0 ? "#fff" : COLORS.text, fontWeight: i === 0 ? 700 : 400,
                }}>{p.word}</div>
                <div style={{ flex: 1, height: 18, background: "rgba(255,255,255,0.04)", borderRadius: 3, overflow: "hidden" }}>
                  <div style={{
                    width: (p.prob / result.predictions[0].prob * 100) + "%",
                    height: "100%", borderRadius: 3,
                    background: i === 0 ? stageColor : stageColor + "50",
                    transition: "width 0.3s",
                  }} />
                </div>
                <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim, width: 50, textAlign: "right" }}>
                  {(p.prob * 100).toFixed(1)}%
                </div>
              </div>
            ))}
          </div>

          {/* Key insight */}
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
            lineHeight: 1.6, padding: "10px 14px", background: "rgba(0,0,0,0.2)",
            borderRadius: 6, borderLeft: "3px solid " + stageColor + "40",
          }}>
            <strong style={{ color: COLORS.text }}>Key difference from Word2Vec:</strong> the correct next word is
            <strong style={{ color: "#72E1A0" }}> "mat"</strong>. Try swapping word order (e.g. "the sat cat on the")
            &mdash; the attention weights change because positional encoding makes each position unique.
            Word2Vec would give the same prediction regardless of order.
            See the Architecture tab for a step-by-step breakdown with actual numbers.
          </div>
        </div>
      )}

      {!result && (
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim }}>
          Enter tokens from the vocabulary and click Predict.
        </div>
      )}
    </div>
  );
}


function AutoregressiveInference({ stageColor }) {
  const DEFAULT_SENTENCE = ["the", "cat", "sat", "on", "the", "mat"];

  // Word type mapping for auto-generating context labels on custom input
  const WORD_TYPES = {
    the: "definite", a: "indefinite",
    cat: "animate noun", dog: "animate noun",
    mat: "surface noun", house: "place", park: "place",
    sat: "past action", ran: "past action",
    is: "present state", was: "past state",
    on: "spatial prep.", to: "directional",
    big: "size adj.", small: "size adj.",
    red: "color adj.", blue: "color adj.",
    happy: "emotion adj.", and: "conjunction", very: "intensifier",
  };

  const PRESETS = [
    "the cat sat on the mat",
    "the big dog ran to the park",
    "a happy cat was very red",
    "the small blue house on the mat",
  ];

  // Custom sentence state — null means use default curated data
  const [customWords, setCustomWords] = useState(null);
  const [inputText, setInputText] = useState(DEFAULT_SENTENCE.join(" "));
  const SENTENCE = customWords || DEFAULT_SENTENCE;
  const isDefault = !customWords;

  // Curated predictions and attention weights that tell a realistic pedagogical story.
  // The actual TINY_TRANSFORMER model is too small to produce natural-looking distributions,
  // so we use illustrative data that matches how a real transformer would behave.
  const CURATED_STEPS = [
    { // Step 1: "the" -> ? (very flat — a bare determiner could precede almost any noun/adj)
      predictions: [
        { word: "cat", prob: 0.14 }, { word: "dog", prob: 0.12 }, { word: "big", prob: 0.10 },
        { word: "small", prob: 0.09 }, { word: "happy", prob: 0.08 }, { word: "red", prob: 0.07 },
      ],
      attention: [{ token: "the", weight: 1.0 }],
    },
    { // Step 2: "the cat" -> ? (noun primes verbs — sat, ran, is, was)
      predictions: [
        { word: "sat", prob: 0.24 }, { word: "ran", prob: 0.19 }, { word: "is", prob: 0.14 },
        { word: "was", prob: 0.13 }, { word: "and", prob: 0.08 }, { word: "on", prob: 0.05 },
      ],
      attention: [{ token: "the", weight: 0.35 }, { token: "cat", weight: 0.65 }],
    },
    { // Step 3: "the cat sat" -> ? (past-tense verb primes prepositions)
      predictions: [
        { word: "on", prob: 0.38 }, { word: "to", prob: 0.15 }, { word: "and", prob: 0.12 },
        { word: "very", prob: 0.07 }, { word: "happy", prob: 0.05 }, { word: "a", prob: 0.04 },
      ],
      attention: [{ token: "the", weight: 0.12 }, { token: "cat", weight: 0.55 }, { token: "sat", weight: 0.33 }],
    },
    { // Step 4: "the cat sat on" -> ? (preposition primes determiner/article)
      predictions: [
        { word: "the", prob: 0.45 }, { word: "a", prob: 0.28 }, { word: "big", prob: 0.06 },
        { word: "small", prob: 0.05 }, { word: "red", prob: 0.04 }, { word: "blue", prob: 0.03 },
      ],
      attention: [{ token: "the", weight: 0.08 }, { token: "cat", weight: 0.12 }, { token: "sat", weight: 0.52 }, { token: "on", weight: 0.28 }],
    },
    { // Step 5: "the cat sat on the" -> ? (full context converges on "mat")
      predictions: [
        { word: "mat", prob: 0.52 }, { word: "house", prob: 0.14 }, { word: "park", prob: 0.10 },
        { word: "dog", prob: 0.07 }, { word: "cat", prob: 0.05 }, { word: "big", prob: 0.03 },
      ],
      attention: [{ token: "the", weight: 0.10 }, { token: "cat", weight: 0.25 }, { token: "sat", weight: 0.15 }, { token: "on", weight: 0.35 }, { token: "the", weight: 0.15 }],
    },
    { // Step 6: "the cat sat on the mat" (complete — show what might follow)
      predictions: [
        { word: "and", prob: 0.22 }, { word: "the", prob: 0.15 }, { word: "very", prob: 0.10 },
        { word: "is", prob: 0.09 }, { word: "was", prob: 0.08 }, { word: "happy", prob: 0.07 },
      ],
      attention: [{ token: "the", weight: 0.08 }, { token: "cat", weight: 0.22 }, { token: "sat", weight: 0.12 }, { token: "on", weight: 0.18 }, { token: "the", weight: 0.30 }, { token: "mat", weight: 0.10 }],
    },
  ];

  // What each token's representation "becomes" through backward attention.
  // `enriched` prefix shows what the source token ALREADY carries — this makes the
  // recursive nature of contextual enrichment explicit: when "sat" attends to "cat",
  // it's attending to a [definite] cat, not a raw "cat".
  const CONTEXT_STACK = [
    [],
    [{ label: "definite", from: "the", enriched: "" }],
    [{ label: "definite", from: "the", enriched: "" },
     { label: "animate", from: "cat", enriched: "def." }],
    [{ label: "def. subject", from: "the", enriched: "" },
     { label: "animate agent", from: "cat", enriched: "def." },
     { label: "past action", from: "sat", enriched: "def.\u00B7anim." }],
    [{ label: "def. entity", from: "the", enriched: "" },
     { label: "agent", from: "cat", enriched: "def." },
     { label: "seated", from: "sat", enriched: "def.\u00B7anim." },
     { label: "spatial", from: "on", enriched: "subj.\u00B7act." }],
    [{ label: "definite", from: "the", enriched: "" },
     { label: "agent", from: "cat", enriched: "def." },
     { label: "action", from: "sat", enriched: "def.\u00B7anim." },
     { label: "spatial", from: "on", enriched: "subj.\u00B7act." },
     { label: "loc. det.", from: "the", enriched: "scene" }],
  ];

  // Three attention head types (colors match Watch Training tab)
  const HEAD_COLORS = ["#E8A838", "#C4A1FF", "#48BFE3"]; // positional, syntactic, semantic
  const HEAD_LABELS = ["positional", "syntactic", "semantic"];

  const [committed, setCommitted] = useState(1);
  const [phase, setPhase] = useState("predict"); // "predict" | "selected"
  const [isPlaying, setIsPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);
  const [stochastic, setStochastic] = useState(false);
  const [sampledToken, setSampledToken] = useState(null); // non-null when stochastic picks a non-top token

  // Split a single attention array into 3 "head" patterns
  function deriveHeads(attention) {
    if (!attention || attention.length < 2) return null;
    const n = attention.length;
    return [0, 1, 2].map(h => {
      return attention.map((a, i) => {
        const distBias = h === 0 ? Math.max(0, 1 - Math.abs(n - 1 - i) * 0.25) : 1; // positional: nearby
        const syntBias = h === 1 ? (a.weight > 0.2 ? 1.4 : 0.7) : 1; // syntactic: amplify strong deps
        const semBias = h === 2 ? (["cat","dog","sat","ran","mat","house","park","happy"].includes(a.token) ? 1.5 : 0.5) : 1;
        const w = a.weight * [distBias, syntBias, semBias][h];
        return { token: a.token, weight: w };
      });
    }).map(head => {
      const sum = head.reduce((s, a) => s + a.weight, 0) || 1;
      return head.map(a => ({ ...a, weight: a.weight / sum }));
    });
  }

  // Sample from prediction distribution (for stochastic mode)
  // Must normalize since curated predictions don't sum to 1.0
  function sampleFromDist(predictions) {
    const total = predictions.reduce((s, p) => s + p.prob, 0);
    const r = Math.random() * total;
    let cumulative = 0;
    for (const p of predictions) {
      cumulative += p.prob;
      if (r < cumulative) return p.word;
    }
    return predictions[predictions.length - 1].word;
  }

  const tokenW = 92, tokenGap = 6;
  const totalW = SENTENCE.length * tokenW + (SENTENCE.length - 1) * tokenGap;
  const arcH = 95;
  const tokenCX = (i) => i * (tokenW + tokenGap) + tokenW / 2;

  // Unified data: curated for default sentence, computed for custom input
  const allSteps = useMemo(() => {
    if (isDefault) return CURATED_STEPS;
    return SENTENCE.map((_, i) => {
      const result = transformerPredict(SENTENCE.slice(0, i + 1));
      return result || { predictions: [{ word: "?", prob: 1 }], attention: [] };
    });
  }, [SENTENCE, isDefault]);

  const allContext = useMemo(() => {
    if (isDefault) return CONTEXT_STACK;
    return SENTENCE.map((_, i) =>
      SENTENCE.slice(0, i).map((w, j) => {
        const prior = SENTENCE.slice(0, j).map(pw => (WORD_TYPES[pw] || pw).substring(0, 4)).join("\u00B7");
        return { label: WORD_TYPES[w] || w, from: w, enriched: prior };
      })
    );
  }, [SENTENCE, isDefault]);

  const applySentence = useCallback((text) => {
    const words = text.toLowerCase().trim().split(/\s+/).filter(w => TINY_TRANSFORMER.embeddings[w]);
    if (words.length < 2) return;
    if (words.join(" ") === DEFAULT_SENTENCE.join(" ")) {
      setCustomWords(null);
    } else {
      setCustomWords(words);
    }
    setInputText(text);
    setCommitted(1);
    setPhase("predict");
    setIsPlaying(false);
  }, []);

  const current = allSteps[committed - 1];
  const nextWord = committed < SENTENCE.length ? SENTENCE[committed] : null;
  const topProb = current ? current.predictions[0].prob : 0;

  // Auto-play timer
  useEffect(() => {
    if (!isPlaying) return;
    const delay = phase === "predict" ? 2200 / speed : 1000 / speed;
    const timer = setTimeout(() => {
      if (phase === "predict" && nextWord) {
        // In stochastic mode, occasionally sample a different token
        if (stochastic && current && current.predictions.length > 1) {
          const picked = sampleFromDist(current.predictions);
          setSampledToken(picked !== current.predictions[0].word ? picked : null);
        } else {
          setSampledToken(null);
        }
        setPhase("selected");
      } else if (phase === "selected" && committed < SENTENCE.length) {
        setCommitted(c => c + 1);
        setPhase("predict");
        setSampledToken(null);
      } else {
        setIsPlaying(false);
      }
    }, delay);
    return () => clearTimeout(timer);
  }, [isPlaying, phase, committed, speed, nextWord, stochastic, current]);

  const canAdvance = (phase === "predict" && nextWord != null) || (phase === "selected" && committed < SENTENCE.length);

  const advance = useCallback(() => {
    if (phase === "predict" && nextWord) {
      if (stochastic && current && current.predictions.length > 1) {
        const picked = sampleFromDist(current.predictions);
        setSampledToken(picked !== current.predictions[0].word ? picked : null);
      } else {
        setSampledToken(null);
      }
      setPhase("selected");
    } else if (phase === "selected" && committed < SENTENCE.length) {
      setCommitted(c => c + 1);
      setPhase("predict");
      setSampledToken(null);
    }
  }, [phase, committed, nextWord, stochastic, current]);

  const reset = useCallback(() => {
    setCommitted(1);
    setPhase("predict");
    setIsPlaying(false);
  }, []);

  const INSIGHTS = [
    "With just \u201Cthe\u201D, the model has minimal signal. A determiner could precede almost any noun or adjective \u2014 the distribution is nearly flat. Top-1 confidence is just 14%.",
    "\u201Ccat\u201D activates noun \u2192 verb patterns. Attention flows strongly from \u201Ccat\u201D back to \u201Cthe\u201D (65%), capturing the determiner-noun relationship. Verbs now dominate the predictions.",
    "\u201Csat\u201D confirms a past-tense narrative. Attention from \u201Csat\u201D focuses on \u201Ccat\u201D (55%) \u2014 the subject-verb link. Prepositions like \u201Con\u201D surge to 38%.",
    "\u201Con\u201D primes the model for a noun phrase. Attention concentrates on \u201Csat\u201D (52%) \u2014 the verb-preposition dependency. Articles \u201Cthe\u201D and \u201Ca\u201D capture 73% of the probability mass.",
    "Full context converges: \u201Cmat\u201D reaches 52%. Attention from the second \u201Cthe\u201D reaches back to \u201Con\u201D (35%) and \u201Ccat\u201D (25%) \u2014 the whole sentence structure contributes to this prediction.",
    "Each new token reshaped the probability landscape. Top-1 confidence rose from 14% \u2192 52%. Context accumulated through self-attention, and predictions sharpened \u2014 this is autoregressive inference."
  ];

  // Top-1 confidence for each step (monotonically increases as context accumulates)
  const confidences = allSteps.map(step => step.predictions[0] ? step.predictions[0].prob : 0);

  const buttonLabel = phase === "predict" && nextWord ? "Select next \u25B6"
    : phase === "selected" && committed < SENTENCE.length ? "Commit & continue \u25B6"
    : "Complete";

  return (
    <div>
      <h2 style={{ fontFamily: FONTS.heading, fontSize: 22, color: COLORS.text, marginBottom: 4 }}>
        Autoregressive Inference
      </h2>
      <p style={{ fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim, marginBottom: 16, lineHeight: 1.5 }}>
        Transformers generate text <strong style={{ color: stageColor }}>one token at a time</strong>.
        At each step, the full context flows through self-attention to produce a probability distribution
        over the vocabulary. Watch how predictions sharpen as context accumulates.
      </p>

      {/* Custom sentence input */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <input type="text" value={inputText}
            onChange={e => setInputText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") applySentence(inputText); }}
            placeholder="Enter words from the vocabulary..."
            style={{
              flex: 1, padding: "8px 12px", fontFamily: FONTS.mono, fontSize: 12,
              background: "#08080A", border: "1px solid " + COLORS.border, borderRadius: 6,
              color: COLORS.text, outline: "none",
            }}
          />
          <button onClick={() => applySentence(inputText)} style={{
            fontFamily: FONTS.mono, fontSize: 11, padding: "8px 14px", borderRadius: 6,
            border: "1px solid " + stageColor, background: stageColor + "15",
            color: stageColor, cursor: "pointer",
          }}>Apply</button>
        </div>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          {PRESETS.map(p => (
            <button key={p} onClick={() => { setInputText(p); applySentence(p); }} style={{
              fontFamily: FONTS.mono, fontSize: 10, padding: "3px 8px", borderRadius: 3,
              border: "1px solid " + (SENTENCE.join(" ") === p.split(/\s+/).filter(w => TINY_TRANSFORMER.embeddings[w]).join(" ") ? stageColor : COLORS.border),
              background: SENTENCE.join(" ") === p.split(/\s+/).filter(w => TINY_TRANSFORMER.embeddings[w]).join(" ") ? stageColor + "15" : "transparent",
              color: SENTENCE.join(" ") === p.split(/\s+/).filter(w => TINY_TRANSFORMER.embeddings[w]).join(" ") ? stageColor : COLORS.textDim,
              cursor: "pointer",
            }}>{p}</button>
          ))}
        </div>
        <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: COLORS.textDim, marginTop: 6, opacity: 0.6 }}>
          Vocabulary: {TINY_TRANSFORMER.vocab.join(", ")}
          {!isDefault && <span style={{ color: stageColor, marginLeft: 8 }}>(using toy model &mdash; predictions are illustrative)</span>}
        </div>
      </div>

      {/* Step & context indicator */}
      <div style={{
        fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim, marginBottom: 16,
        display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap",
      }}>
        <span>Token {committed}/{SENTENCE.length}</span>
        <span style={{ color: stageColor }}>
          &ldquo;{SENTENCE.slice(0, committed).join(" ")}&rdquo;
        </span>
        {nextWord && <span style={{ opacity: 0.5 }}>&rarr; ???</span>}
        {!nextWord && <span style={{ color: "#72E1A0" }}>{"\u2713"} complete</span>}
      </div>

      {/* Token row + attention arcs */}
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 20, overflowX: "auto" }}>
        <div style={{ position: "relative", width: totalW, minWidth: totalW }}>
          {/* Multi-head attention arcs (3 heads: positional/gold, syntactic/purple, semantic/cyan) */}
