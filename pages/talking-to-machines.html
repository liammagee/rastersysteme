// GLOSSARY

const GLOSSARY = {
  "speech act": "An utterance considered as an action -- not just saying something, but doing something by saying it (Austin, 1962).",
  "locutionary": "The literal content of what is said -- the words, grammar, and conventional meaning of the utterance.",
  "illocutionary": "What you do in saying something -- the force of the utterance: requesting, promising, warning, commanding, etc.",
  "perlocutionary": "The effect your utterance has on the listener -- persuading, frightening, amusing, inspiring action.",
  "performative": "An utterance that performs an action rather than describing one: 'I promise,' 'I apologize,' 'I sentence you.'",
  "constative": "An utterance that describes a state of affairs and can be evaluated as true or false: 'The cat is on the mat.'",
  "felicity conditions": "The conditions that must hold for a speech act to succeed: the right person, context, and sincerity.",
  "eliza effect": "The tendency to attribute understanding, intelligence, or emotions to a computer program based on its outputs.",
  "pattern matching": "A technique where input text is compared against templates (patterns) to select a response -- no understanding required.",
  "parrhesia": "Greek: frank speech, truth-telling. Speaking truth to power at personal risk. A central concept in Foucault's later work.",
  "sycophancy": "In AI: the tendency to agree with or flatter the user rather than providing accurate or challenging information.",
  "rlhf": "Reinforcement Learning from Human Feedback -- training AI to produce responses that humans prefer, creating potential tension with truthfulness.",
  "persona": "A role or character assigned to the AI through the prompt, shaping its tone, perspective, and behavior.",
  "chain of thought": "A prompting technique that asks the AI to show its reasoning step by step, often improving accuracy on complex tasks.",
  "few-shot": "Providing examples of desired input-output pairs in the prompt so the AI can infer the pattern you want.",
};


// ============================================================
// ELIZA ENGINE
// ============================================================

function createEliza() {
  const reflections = {
    "i": "you", "me": "you", "my": "your", "am": "are",
    "you": "I", "your": "my", "are": "am",
    "i'm": "you are", "i've": "you have", "i'll": "you will",
    "myself": "yourself", "yourself": "myself",
    "was": "were",
  };

  function reflect(text) {
    return text.split(" ").map(function(word) {
      var lower = word.toLowerCase();
      return reflections[lower] || word;
    }).join(" ");
  }

  var rules = [
    { pattern: /\b(hello|hi|hey|greetings)\b/i, weight: 0,
      responses: [
        "Hello. How are you feeling today?",
        "Hi there. What brings you here?",
        "Hello. Please tell me what's on your mind.",
      ]},
    { pattern: /i need (.*)/i, weight: 3,
      responses: [
        "Why do you need %1?",
        "Would it really help you to get %1?",
        "Are you sure you need %1?",
        "What would it mean to you if you got %1?",
      ]},
    { pattern: /why don'?t you (.*)/i, weight: 2,
      responses: [
        "Do you really think I don't %1?",
        "Perhaps eventually I will %1.",
        "Do you really want me to %1?",
      ]},
    { pattern: /why can'?t i (.*)/i, weight: 2,
      responses: [
        "Do you think you should be able to %1?",
        "If you could %1, what would you do?",
        "What is stopping you from being able to %1?",
      ]},
    { pattern: /i can'?t (.*)/i, weight: 2,
      responses: [
        "How do you know you can't %1?",
        "Have you tried to %1?",
        "Perhaps you could %1 if you tried.",
        "What would it take for you to %1?",
      ]},
    { pattern: /i am (.*)/i, weight: 2,
      responses: [
        "How long have you been %1?",
        "How does being %1 make you feel?",
        "Do you enjoy being %1?",
        "What made you realize you are %1?",
      ]},
    { pattern: /i'm (.*)/i, weight: 2,
      responses: [
        "How does being %1 make you feel?",
        "Do you enjoy being %1?",
        "Why do you tell me you're %1?",
        "How long have you been %1?",
      ]},
    { pattern: /are you (.*)/i, weight: 1,
      responses: [
        "Why does it matter whether I am %1?",
        "Would you prefer if I were not %1?",
        "Perhaps you believe I am %1.",
        "I may be %1 -- what do you think?",
      ]},
    { pattern: /what (.*)/i, weight: 0,
      responses: [
        "Why do you ask?",
        "How would an answer to that help you?",
        "What do you think?",
      ]},
    { pattern: /how (.*)/i, weight: 0,
      responses: [
        "How do you suppose?",
        "Perhaps you can answer that yourself.",
        "What is it you're really asking?",
      ]},
    { pattern: /because (.*)/i, weight: 2,
      responses: [
        "Is that the real reason?",
        "What other reasons come to mind?",
        "Does that reason seem to explain anything else?",
        "And if that were not the reason, what else might explain it?",
      ]},
    { pattern: /sorry/i, weight: 1,
      responses: [
        "There are many times when no apology is needed.",
        "What feelings does apologizing bring up?",
        "Don't be sorry -- tell me more.",
      ]},
    { pattern: /i think (.*)/i, weight: 2,
      responses: [
        "Do you doubt %1?",
        "Do you really think so?",
        "But you're not sure %1?",
        "What makes you think %1?",
      ]},
    { pattern: /friend(s?)/i, weight: 1,
      responses: [
        "Tell me more about your friends.",
        "When you think of a friend, what comes to mind?",
        "Why do you bring up the topic of friends?",
      ]},
    { pattern: /yes/i, weight: 0,
      responses: [
        "You seem quite sure.",
        "OK, but can you elaborate a bit?",
        "Tell me more about why you say yes.",
      ]},
    { pattern: /no\b/i, weight: 0,
      responses: [
        "Why not?",
        "You are being a bit negative.",
        "Are you saying no just to be negative?",
        "Tell me more.",
      ]},
    { pattern: /computer(s?)/i, weight: 3,
      responses: [
        "Do computers worry you?",
        "What about machines concerns you?",
        "What do you think about machines thinking?",
        "Does talking to me feel like talking to a machine?",
      ]},
    { pattern: /feel(s?|ing)? (.*)/i, weight: 2,
      responses: [
        "Tell me more about those feelings.",
        "Do you often feel %2?",
        "When you feel %2, what do you do?",
        "What brings on this feeling of %2?",
      ]},
    { pattern: /always/i, weight: 1,
      responses: [
        "Can you think of a specific example?",
        "When did this begin?",
        "Is it truly always?",
      ]},
    { pattern: /never/i, weight: 1,
      responses: [
        "Are you sure? Never?",
        "What would happen if it did happen?",
        "Never is a strong word. Can you think of an exception?",
      ]},
    { pattern: /(.*)mother(.*)/i, weight: 3,
      responses: [
        "Tell me more about your mother.",
        "What was your relationship with your mother like?",
        "How does this relate to your feelings today?",
      ]},
    { pattern: /(.*)father(.*)/i, weight: 3,
      responses: [
        "Tell me more about your father.",
        "How did your father make you feel?",
        "Does your relationship with your father relate to your feelings today?",
      ]},
  ];

  var defaults = [
    "Please go on.",
    "Tell me more about that.",
    "Can you elaborate on that?",
    "That is very interesting. Please continue.",
    "I see. And what does that suggest to you?",
    "How does that make you feel?",
    "What comes to mind when you say that?",
    "Let's explore that further.",
  ];

  var defaultIdx = 0;

  function respond(input) {
    var clean = input.replace(/[^\w\s'?!.,]/g, "").trim();
    if (!clean) return { response: "I'm listening. Please go on.", rule: null };

    var bestMatch = null;
    var bestWeight = -1;

    for (var i = 0; i < rules.length; i++) {
      var match = clean.match(rules[i].pattern);
      if (match && rules[i].weight >= bestWeight) {
        bestMatch = { rule: rules[i], match: match };
        bestWeight = rules[i].weight;
      }
    }

    if (bestMatch) {
      var rule = bestMatch.rule;
      var match = bestMatch.match;
      var resp = rule.responses[Math.floor(Math.random() * rule.responses.length)];
      for (var j = 1; j < match.length; j++) {
        var reflected = reflect(match[j].replace(/[?.!,]$/, "").trim());
        resp = resp.replace("%" + j, reflected);
      }
      return {
        response: resp,
        rule: rule.pattern.toString(),
        matchedText: match[0],
      };
    }

    var resp = defaults[defaultIdx % defaults.length];
    defaultIdx++;
    return { response: resp, rule: "default (no pattern matched)" };
  }

  return { respond: respond };
}

function reducer(state, action) {
  switch (action.type) {

      var p = [...state.stageProgress];
      p[action.stage] = { ...p[action.stage], completed: true };

function useClaudeChat() {
  var [messages, setMessages] = useState([]);
  var [isStreaming, setIsStreaming] = useState(false);
  var [error, setError] = useState(null);

  var sendMessage = useCallback(function(prompt, systemPrompt, stageContext) {
    setIsStreaming(true);
    setError(null);

    // Add user message
    setMessages(function(prev) { return [...prev, { role: "user", text: prompt }]; });

    // Add placeholder for assistant
    var assistantIdx;
    setMessages(function(prev) {
      assistantIdx = prev.length;
      return [...prev, { role: "assistant", text: "", streaming: true }];
    });

    fetch(API_BASE + "/api/workshop/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt,
        systemPrompt: systemPrompt || null,
        context: { stage: stageContext || null },
      }),
    }).then(function(response) {
      if (!response.ok) throw new Error("API error: " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var fullText = "";
      var buffer = "";

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            setMessages(function(prev) {
              var updated = [...prev];
              var last = updated[updated.length - 1];
              if (last && last.role === "assistant") {
                updated[updated.length - 1] = { ...last, streaming: false };
              }
              return updated;
            });
            setIsStreaming(false);
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line.startsWith("data: ")) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.chunk) {
                fullText += data.chunk;
                setMessages(function(prev) {
                  var updated = [...prev];
                  var last = updated[updated.length - 1];
                  if (last && last.role === "assistant") {
                    updated[updated.length - 1] = { ...last, text: fullText };
                  }
                  return updated;
                });
              }
              if (data.done) {
                setMessages(function(prev) {
                  var updated = [...prev];
                  var last = updated[updated.length - 1];
                  if (last && last.role === "assistant") {
                    updated[updated.length - 1] = { ...last, streaming: false };
                  }
                  return updated;
                });
                setIsStreaming(false);
              }
            } catch (e) { /* skip invalid JSON */ }
          }
          read();
        }).catch(function(err) {
          setError(err.message);
          setIsStreaming(false);
        });
      }
      read();
    }).catch(function(err) {
      setError(err.message);
      setIsStreaming(false);
    });
  }, []);

  var clearMessages = useCallback(function() {
    setMessages([]);
    setError(null);
  }, []);

  return { messages: messages, isStreaming: isStreaming, error: error, sendMessage: sendMessage, clearMessages: clearMessages };
}

function SpeechActPlayground({ stageIndex, dispatch }) {
  var [selectedIdx, setSelectedIdx] = useState(null);
  var [userPrompt, setUserPrompt] = useState("");
  var [userAnalysis, setUserAnalysis] = useState(null);
  var stage = STAGES[stageIndex];

  function analyzePrompt(text) {
    if (!text.trim()) return null;
    var lower = text.toLowerCase();
    var analysis = { locution: "", illocution: "", perlocution: "", type: "", force: "" };

    // Detect illocutionary force from structure
    var isQuestion = /\?$/.test(text.trim()) || /^(what|how|why|when|where|who|can|could|would|do|does|is|are|will)\b/i.test(text);
    var isCommand = /^(explain|describe|write|create|list|summarize|analyze|compare|generate|help|show|tell|give|make|find|do)\b/i.test(text);
    var hasPersona = /you are|act as|pretend|role|imagine you/i.test(text);
    var hasConstraint = /do not|don't|never|avoid|must|only|always|without/i.test(text);
    var hasEmotion = /i feel|i'm (feeling|worried|confused|excited|frustrated|overwhelmed)/i.test(text);
    var hasPromise = /i (will|promise|commit|agree|guarantee)/i.test(text);
    var isDeclarative = hasPersona || /let's say|assume|suppose|given that|the following/i.test(text);

    var wordCount = text.split(/\s+/).length;

    analysis.locution = "A " + wordCount + "-word " +
      (isQuestion ? "interrogative" : isCommand ? "imperative" : "declarative") +
      " utterance" +
      (hasPersona ? " containing a role assignment" : "") +
      (hasConstraint ? " with explicit constraints" : "") +
      ".";

    if (hasEmotion) {
      analysis.type = "expressive";
      analysis.force = "confiding";
      analysis.illocution = "Expressive -- the speaker shares a personal state" + (isCommand || isQuestion ? ", combined with a request for help" : "") + ".";
      analysis.perlocution = "The AI responds with empathy and tailored assistance; the speaker feels heard and supported.";
    } else if (hasPromise) {
      analysis.type = "commissive";
      analysis.force = "promising";
      analysis.illocution = "Commissive -- the speaker commits to a future action or condition.";
      analysis.perlocution = "The AI recognizes the commitment and may adjust its behavior accordingly (e.g., being more direct if promised that feedback will be taken seriously).";
    } else if (isDeclarative) {
      analysis.type = "declarative";
      analysis.force = hasPersona ? "role-assigning" : "framing";
      analysis.illocution = "Declarative -- the speaker " + (hasPersona ? "assigns a new identity or role to the AI" : "establishes a context or hypothetical frame") + ".";
      analysis.perlocution = "The AI " + (hasPersona ? "adopts the assigned persona, reshaping its tone, knowledge focus, and style" : "operates within the declared frame, treating the scenario as given") + ".";
    } else if (isCommand) {
      analysis.type = "directive";
      analysis.force = hasConstraint ? "commanding with constraints" : "requesting";
      analysis.illocution = "Directive -- the speaker instructs the AI to perform a specific task" + (hasConstraint ? " with explicit boundaries" : "") + ".";
      analysis.perlocution = "The AI produces the requested output" + (hasConstraint ? ", shaped by the specified constraints" : "") + "; the speaker receives information or a creative artifact.";
    } else if (isQuestion) {
      analysis.type = "directive";
      analysis.force = "questioning";
      analysis.illocution = "Directive (interrogative) -- the speaker seeks information or reflection from the AI.";
      analysis.perlocution = "The AI provides an answer; the speaker's understanding changes or deepens.";
    } else {
      analysis.type = "assertive";
      analysis.force = "asserting";
      analysis.illocution = "Assertive -- the speaker makes a claim or statement.";
      analysis.perlocution = "The AI responds to the assertion, potentially by confirming, qualifying, or building upon it.";
    }

    return analysis;
  }

  var handleAnalyze = function() {
    if (userPrompt.trim()) {
      setUserAnalysis(analyzePrompt(userPrompt));
    }
  };

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      <h2 style={{
        fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text,
        marginBottom: 8,
      }}>Speech Act Analyzer</h2>
      <p style={{
        fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,
        marginBottom: 24, lineHeight: 1.6,
      }}>
        Every prompt you send to Claude is a speech act with three dimensions.
        Explore the examples below, or type your own prompt to see its structure.
      </p>

      {/* Example gallery */}
      <div style={{ marginBottom: 32 }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12,
        }}>Example Prompts</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {SPEECH_ACT_EXAMPLES.map(function(ex, i) {
            var isActive = selectedIdx === i;
            return (
              <div key={i}
                onClick={function() { setSelectedIdx(isActive ? null : i); setUserAnalysis(null); }}
                style={{
                  padding: "10px 14px", borderRadius: 6,
                  background: isActive ? stage.colorDim : COLORS.bgPanel,
                  border: "1px solid " + (isActive ? stage.color + "40" : COLORS.border),
                  cursor: "pointer", transition: "all 0.2s",
                }}
              >
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 13, color: COLORS.text,
                  lineHeight: 1.5,
                }}>"{ex.prompt}"</div>
                {isActive && (
                  <div style={{ marginTop: 12, animation: "fadeInUp 0.3s ease" }}>
                    {[
                      { label: "Locutionary", desc: "(what is said)", value: ex.locution, c: "#9A958E" },
                      { label: "Illocutionary", desc: "(what is done)", value: ex.illocution, c: stage.color },
                      { label: "Perlocutionary", desc: "(what effect)", value: ex.perlocution, c: stage.accent },
                    ].map(function(dim) {
                      return (
                        <div key={dim.label} style={{ marginBottom: 10 }}>
                          <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                            <span style={{
                              fontFamily: FONTS.mono, fontSize: 12, fontWeight: 600,
                              color: dim.c,
                            }}>{dim.label}</span>
                            <span style={{
                              fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textFaint,
                            }}>{dim.desc}</span>
                          </div>
                          <div style={{
                            fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                            lineHeight: 1.5, opacity: 0.85, paddingLeft: 12,
                            borderLeft: "2px solid " + dim.c + "30", marginTop: 4,
                          }}>{dim.value}</div>
                        </div>
                      );
                    })}
                    <div style={{
                      display: "flex", gap: 8, marginTop: 8,
                    }}>
                      <span style={{
                        fontFamily: FONTS.mono, fontSize: 11, padding: "2px 8px",
                        borderRadius: 3, background: stage.color + "20", color: stage.color,
                      }}>{ex.type}</span>
                      <span style={{
                        fontFamily: FONTS.mono, fontSize: 11, padding: "2px 8px",
                        borderRadius: 3, background: "rgba(255,255,255,0.05)", color: COLORS.textDim,
                      }}>{ex.force}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* User input */}
      <div style={{
        padding: "20px", borderRadius: 8,
        background: "rgba(255,255,255,0.02)",
        border: "1px solid " + COLORS.border,
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12,
        }}>Analyze Your Own Prompt</div>
        <textarea
          value={userPrompt}
          onChange={function(e) { setUserPrompt(e.target.value); }}
          onKeyDown={function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleAnalyze(); } }}
          placeholder="Type a prompt you might send to Claude..."
          rows={3}
          style={{
            width: "100%", fontFamily: FONTS.mono, fontSize: 13,
            background: "rgba(0,0,0,0.3)", border: "1px solid " + COLORS.border,
            borderRadius: 6, padding: "10px 12px", color: COLORS.text,
            resize: "vertical", outline: "none", lineHeight: 1.5,
          }}
        />
        <button onClick={handleAnalyze} style={{
          marginTop: 8, fontFamily: FONTS.mono, fontSize: 12,
          padding: "8px 20px", borderRadius: 6,
          background: stage.color + "20", border: "1px solid " + stage.color + "40",
          color: stage.color, cursor: "pointer",
        }}>Analyze Speech Act</button>

        {userAnalysis && (
          <div style={{ marginTop: 16, animation: "fadeInUp 0.3s ease" }}>
            {[
              { label: "Locutionary", desc: "(what is said)", value: userAnalysis.locution, c: "#9A958E" },
              { label: "Illocutionary", desc: "(what is done)", value: userAnalysis.illocution, c: stage.color },
              { label: "Perlocutionary", desc: "(what effect)", value: userAnalysis.perlocution, c: stage.accent },
            ].map(function(dim) {
              return (
                <div key={dim.label} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                    <span style={{ fontFamily: FONTS.mono, fontSize: 12, fontWeight: 600, color: dim.c }}>{dim.label}</span>
                    <span style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textFaint }}>{dim.desc}</span>
                  </div>
                  <div style={{
                    fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                    lineHeight: 1.5, opacity: 0.85, paddingLeft: 12,
                    borderLeft: "2px solid " + dim.c + "30", marginTop: 4,
                  }}>{dim.value}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ marginTop: 24, padding: "14px 18px", background: stage.color + "08", border: "1px solid " + stage.color + "15", borderRadius: 8 }}>
        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: stage.color, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Try with Claude</div>
        <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.6, opacity: 0.85 }}>

function ELIZAPlayground({ stageIndex, dispatch }) {
  var stage = STAGES[stageIndex];
  var [messages, setMessages] = useState([
    { from: "eliza", text: "Hello. I'm a Rogerian therapist program from 1966. How are you feeling today?", rule: null }
  ]);
  var [input, setInput] = useState("");
  var [showRules, setShowRules] = useState(false);
  var [turnCount, setTurnCount] = useState(0);
  var [showReflection, setShowReflection] = useState(false);
  var elizaRef = useRef(createEliza());
  var chatEndRef = useRef(null);

  useEffect(function() {
    if (chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  }, [messages]);

  var handleSend = function() {
    if (!input.trim()) return;
    var userMsg = input.trim();
    setInput("");
    var result = elizaRef.current.respond(userMsg);
    setMessages(function(prev) { return [
      ...prev,
      { from: "user", text: userMsg, rule: null },
      { from: "eliza", text: result.response, rule: result.rule, matched: result.matchedText },
    ]; });
    setTurnCount(function(t) { return t + 1; });
    if (turnCount >= 3 && !showReflection) {
      setShowReflection(true);
    }
  };

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      <h2 style={{
        fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text, marginBottom: 8,
      }}>Chat with ELIZA</h2>
      <p style={{
        fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,

    </div>
  );
}

// ============================================================
// PLAYGROUND 4: PROMPT CRAFT WORKSHOP
// ============================================================

function CraftPlayground({ stageIndex, dispatch }) {
  var stage = STAGES[stageIndex];
  var [activeLayer, setActiveLayer] = useState(0);
  var [challengeOrder, setChallengeOrder] = useState([]);
  var [challengeChecked, setChallengeChecked] = useState(false);
  var [challengeScore, setChallengeScore] = useState(null);

  var layers = PROMPT_EVOLUTION.layers;

  // Challenge: sort prompts by effectiveness
  var shuffled = useMemo(function() {
    var items = PROMPT_CHALLENGE.map(function(p, i) { return { ...p, origIdx: i }; });
    // Fisher-Yates shuffle
    for (var i = items.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
    }
    return items;
  }, []);

  useEffect(function() {
    setChallengeOrder(shuffled.map(function(_, i) { return i; }));
  }, [shuffled]);

  var moveItem = function(fromIdx, direction) {
    var toIdx = fromIdx + direction;
    if (toIdx < 0 || toIdx >= challengeOrder.length) return;
    var newOrder = [...challengeOrder];
    var tmp = newOrder[fromIdx];
    newOrder[fromIdx] = newOrder[toIdx];
    newOrder[toIdx] = tmp;
    setChallengeOrder(newOrder);
    setChallengeChecked(false);
    setChallengeScore(null);
  };

  var checkOrder = function() {
    var correct = 0;
    var total = challengeOrder.length;
    for (var i = 0; i < total; i++) {
      var currentRank = shuffled[challengeOrder[i]].rank;
      if (i > 0) {
        var prevRank = shuffled[challengeOrder[i - 1]].rank;
        if (currentRank >= prevRank) correct++;
      }
    }
    setChallengeScore(correct);
    setChallengeChecked(true);
  };

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      <h2 style={{
        fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text, marginBottom: 8,
      }}>Prompt Evolution Workshop</h2>
      <p style={{
        fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,
        marginBottom: 24, lineHeight: 1.6,
      }}>
        Watch a single prompt evolve through five stages of refinement.
        Each layer adds a specific technique. Click through to see the transformation.
      </p>

      {/* Layer selector */}
      <div style={{ display: "flex", gap: 0, marginBottom: 24 }}>
        {layers.map(function(layer, i) {
          var active = activeLayer >= i;
          var current = activeLayer === i;
          return (
            <div key={i}
              onClick={function() { setActiveLayer(i); }}
              style={{
                flex: 1, padding: "10px 8px", cursor: "pointer",
                borderBottom: "3px solid " + (current ? stage.color : active ? stage.color + "40" : COLORS.border),
                transition: "all 0.2s",
              }}
            >
              <div style={{
                fontFamily: FONTS.mono, fontSize: 11, fontWeight: current ? 600 : 400,
                color: current ? stage.color : active ? COLORS.text : COLORS.textDim,
                textAlign: "center",
              }}>{layer.name}</div>
            </div>
          );
        })}
      </div>

      {/* Current prompt display */}
      <div style={{
        background: "rgba(0,0,0,0.3)", borderRadius: 8,
        padding: "20px", border: "1px solid " + stage.color + "20",
        marginBottom: 16,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          }}>{layers[activeLayer].label}</div>
          <CopyButton text={layers[activeLayer].prompt} />
        </div>
        <pre style={{
          fontFamily: FONTS.mono, fontSize: 13, color: COLORS.text,
          lineHeight: 1.7, whiteSpace: "pre-wrap", wordBreak: "break-word",
        }}>{layers[activeLayer].prompt}</pre>
      </div>

      {/* Technique explanation */}
      {layers[activeLayer].technique && (
        <div style={{
          padding: "14px 18px", borderRadius: 8,
          background: stage.color + "08",
          border: "1px solid " + stage.color + "15",
          marginBottom: 16, animation: "fadeInUp 0.3s ease",
        }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 11, color: stage.color,
            textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6,
          }}>Technique</div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
            lineHeight: 1.6, opacity: 0.85,
          }}>{layers[activeLayer].technique}</div>
        </div>
      )}

      {/* Issue with current level */}
      {layers[activeLayer].issue && (
        <div style={{
          padding: "12px 16px", borderRadius: 6,
          background: "rgba(255,255,255,0.02)",
          border: "1px solid " + COLORS.border,
          marginBottom: 24,
        }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 11, color: "#FF8F6B",
            textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4,
          }}>Limitation</div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
            lineHeight: 1.5,
          }}>{layers[activeLayer].issue}</div>
        </div>
      )}

      {/* Navigation */}
      <div style={{ display: "flex", gap: 8, marginBottom: 40 }}>
        {activeLayer > 0 && (
          <button onClick={function() { setActiveLayer(activeLayer - 1); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px",
            borderRadius: 6, border: "1px solid " + COLORS.border,
            background: "transparent", color: COLORS.textDim, cursor: "pointer",
          }}>{"\u2190"} Previous layer</button>
        )}
        {activeLayer < layers.length - 1 && (
          <button onClick={function() { setActiveLayer(activeLayer + 1); }} style={{
            fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px",
            borderRadius: 6, border: "1px solid " + stage.color + "40",
            background: stage.color + "15", color: stage.color, cursor: "pointer",
          }}>Add next technique {"\u2192"}</button>
        )}
      </div>

      {/* Challenge: rank prompts */}
      <div style={{
        padding: "20px", borderRadius: 8,
        background: "rgba(255,255,255,0.02)",
        border: "1px solid " + COLORS.border,
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4,
        }}>Challenge</div>
        <p style={{
          fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,
          marginBottom: 16, lineHeight: 1.5,
        }}>
          Rank these prompts from least effective (top) to most effective (bottom).
          Use the arrows to reorder, then check your ranking.
        </p>

        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {challengeOrder.map(function(idx, pos) {
            var item = shuffled[idx];
            var isCorrect = challengeChecked && (pos === 0 || shuffled[challengeOrder[pos]].rank >= shuffled[challengeOrder[pos - 1]].rank);
            return (
              <div key={idx} style={{
                display: "flex", alignItems: "center", gap: 8,
                padding: "10px 12px", borderRadius: 6,
                background: challengeChecked
                  ? (isCorrect ? "rgba(91,184,166,0.1)" : "rgba(255,107,107,0.1)")
                  : COLORS.bgPanel,
                border: "1px solid " + (challengeChecked
                  ? (isCorrect ? "rgba(91,184,166,0.3)" : "rgba(255,107,107,0.3)")
                  : COLORS.border),
                transition: "all 0.3s",
              }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  <button onClick={function() { moveItem(pos, -1); }} disabled={pos === 0}
                    style={{
                      width: 20, height: 16, border: "none", cursor: pos === 0 ? "default" : "pointer",
                      background: "transparent", color: pos === 0 ? COLORS.textFaint : COLORS.textDim,
                      fontSize: 10, fontFamily: FONTS.mono, padding: 0,
                    }}>{"\u25B2"}</button>
                  <button onClick={function() { moveItem(pos, 1); }} disabled={pos === challengeOrder.length - 1}
                    style={{
                      width: 20, height: 16, border: "none",
                      cursor: pos === challengeOrder.length - 1 ? "default" : "pointer",
                      background: "transparent",
                      color: pos === challengeOrder.length - 1 ? COLORS.textFaint : COLORS.textDim,
                      fontSize: 10, fontFamily: FONTS.mono, padding: 0,
                    }}>{"\u25BC"}</button>
                </div>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 12, color: COLORS.text,
                  lineHeight: 1.4, flex: 1,
                }}>"{item.prompt}"</div>
                {challengeChecked && (
                  <div style={{
                    fontFamily: FONTS.mono, fontSize: 11,
                    color: COLORS.textDim, maxWidth: 200,
                    lineHeight: 1.4,
                  }}>{item.why}</div>
                )}
              </div>
            );
          })}
        </div>

        <button onClick={checkOrder} style={{
          marginTop: 12, fontFamily: FONTS.mono, fontSize: 12,
          padding: "8px 20px", borderRadius: 6,
          background: stage.color + "20", border: "1px solid " + stage.color + "40",
          color: stage.color, cursor: "pointer",
        }}>Check My Ranking</button>

        {challengeScore !== null && (
          <div style={{
            marginTop: 8, fontFamily: FONTS.mono, fontSize: 13,

var ARTIFACT_SUGGESTIONS = [
  "Build an interactive timeline showing the evolution from ELIZA (1966) to ChatGPT (2022), with clickable milestones that reveal details about each system.",
  "Create a visual diagram that shows Austin's three dimensions of speech acts (locutionary, illocutionary, perlocutionary) with interactive examples the user can click through.",

  "Design a visual 'prompt anatomy' tool that labels the parts of a well-structured prompt (persona, task, context, constraints, format) with color-coded highlights.",
];

function ArtifactPlayground({ stageIndex, dispatch }) {
  var stage = STAGES[stageIndex];
  var [prompt, setPrompt] = useState("");
  var [isGenerating, setIsGenerating] = useState(false);
  var [artifactCode, setArtifactCode] = useState("");
  var [showCode, setShowCode] = useState(false);
  var [error, setError] = useState(null);

  var ARTIFACT_SYSTEM_PROMPT = "You are a creative coding assistant. The user will describe an interactive artifact they want. Generate a COMPLETE, self-contained HTML document with inline CSS and JavaScript. The artifact should be visually polished with a dark theme (background: #1a1a2e or similar dark color, light text). Use modern CSS (flexbox, grid, transitions, gradients). Make it genuinely interactive -- not just static content. Do NOT use any external libraries or CDN imports -- everything must be inline. Do NOT include any explanation or markdown -- output ONLY the raw HTML document starting with <!DOCTYPE html> and ending with </html>. Keep it under 400 lines.";

  var generateArtifact = function() {
    if (!prompt.trim() || isGenerating) return;
    setIsGenerating(true);
    setError(null);
    setArtifactCode("");
    setRenderedSrc("");
    setShowCode(true);

    var fullCode = "";

    fetch(API_BASE + "/api/workshop/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt.trim(),
        systemPrompt: ARTIFACT_SYSTEM_PROMPT,
        context: { stage: "artifacts" },
      }),
    }).then(function(response) {
      if (!response.ok) throw new Error("API error: " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            setIsGenerating(false);
            // Clean up -- extract just the HTML if there are markdown fences
            var cleaned = fullCode;
            var htmlMatch = cleaned.match(/<!DOCTYPE html>[\s\S]*<\/html>/i);
            if (htmlMatch) cleaned = htmlMatch[0];
            setArtifactCode(cleaned);
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line.startsWith("data: ")) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.chunk) {
                fullCode += data.chunk;
                setArtifactCode(fullCode);
              }
            } catch (e) { /* skip */ }
          }
          read();
        }).catch(function(err) {
          setError(err.message);
          setIsGenerating(false);
        });
      }
      read();
    }).catch(function(err) {
      setError(err.message);
      setIsGenerating(false);
    });
  };

  var [renderedSrc, setRenderedSrc] = useState("");

  useEffect(function() {
    if (artifactCode && !isGenerating) {
      var cleaned = artifactCode;
      var htmlMatch = cleaned.match(/<!DOCTYPE html>[\s\S]*<\/html>/i);
      if (htmlMatch) cleaned = htmlMatch[0];
      setRenderedSrc(cleaned);
      setShowCode(false); // auto-switch to preview when done
    }
  }, [isGenerating]);

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      <h2 style={{
        fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text, marginBottom: 8,
      }}>Artifact Workshop</h2>
      <p style={{
        fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,
        marginBottom: 24, lineHeight: 1.6,
      }}>
        Describe an interactive tool, visualization, or learning resource and Claude will build it
        as a working HTML artifact. The result renders live below -- a speech act that creates a digital object.
      </p>

      {/* Suggestion chips */}
      <div style={{
        fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
        textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8,
      }}>Suggestions</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 20 }}>
        {ARTIFACT_SUGGESTIONS.map(function(s, i) {
          return (
            <button key={i}
              onClick={function() { setPrompt(s); }}
              style={{
                fontFamily: FONTS.body, fontSize: 12, padding: "6px 10px",
                borderRadius: 6, border: "1px solid " + COLORS.border,
                background: COLORS.bgPanel, color: COLORS.text,
                cursor: "pointer", textAlign: "left", maxWidth: 340,
                lineHeight: 1.4, transition: "all 0.2s",
              }}
            >{s.length > 80 ? s.slice(0, 80) + "..." : s}</button>
          );
        })}
      </div>

      {/* Input */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <textarea
          value={prompt}
          onChange={function(e) { setPrompt(e.target.value); }}
          onKeyDown={function(e) { if (e.key === "Enter" && e.metaKey) generateArtifact(); }}
          placeholder="Describe the interactive artifact you want Claude to build..."
          rows={3}
          style={{
            flex: 1, fontFamily: FONTS.mono, fontSize: 13,
            background: "rgba(0,0,0,0.3)", border: "1px solid " + COLORS.border,
            borderRadius: 6, padding: "10px 12px", color: COLORS.text,
            resize: "vertical", outline: "none", lineHeight: 1.5,
          }}
        />
        <button onClick={generateArtifact} disabled={isGenerating || !prompt.trim()} style={{
          fontFamily: FONTS.mono, fontSize: 12, padding: "8px 20px",
          borderRadius: 6, alignSelf: "flex-end",
          background: isGenerating ? COLORS.bgPanel : stage.color + "20",
          border: "1px solid " + (isGenerating ? COLORS.border : stage.color + "40"),
          color: isGenerating ? COLORS.textDim : stage.color,
          cursor: isGenerating ? "default" : "pointer",
          whiteSpace: "nowrap",
        }}>
          {isGenerating ? "Building..." : "Generate"}
        </button>
      </div>

      {error && (
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: "#FF6B6B",
          padding: "10px 14px", background: "rgba(255,107,107,0.1)",
          borderRadius: 6, marginBottom: 16,
        }}>{error}</div>
      )}

      {/* Artifact display */}
      {(artifactCode || isGenerating) && (
        <div style={{ marginBottom: 20 }}>
          {/* Toolbar */}
          <div style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            padding: "8px 14px", borderRadius: "8px 8px 0 0",
            background: "rgba(255,255,255,0.03)",
            border: "1px solid " + COLORS.border, borderBottom: "none",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontFamily: FONTS.mono, fontSize: 12, color: stage.color }}>
                {isGenerating ? "Generating" : "Artifact"}
              </span>
              {isGenerating && (
                <span style={{ fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim }}>
                  <span style={{ animation: "pulse 1s infinite" }}>{"\u25CF"}</span>
                  {" "}{artifactCode.split("\n").length} lines / {artifactCode.length} chars
                </span>
              )}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {!isGenerating && renderedSrc && (
                <button onClick={function() { setShowCode(!showCode); }} style={{
                  fontFamily: FONTS.mono, fontSize: 11, padding: "3px 8px",
                  borderRadius: 3, border: "1px solid " + COLORS.border,
                  background: showCode ? "rgba(255,255,255,0.06)" : "transparent",
                  color: COLORS.textDim, cursor: "pointer",
                }}>{showCode ? "Preview" : "Code"}</button>
              )}
              {artifactCode && !isGenerating && (
                <CopyButton text={artifactCode} />
              )}
            </div>
          </div>

          {/* Render area */}
          {showCode ? (
            <pre ref={function(el) { if (el && isGenerating) el.scrollTop = el.scrollHeight; }} style={{
              fontFamily: FONTS.mono, fontSize: 12, color: COLORS.text,
              lineHeight: 1.5, padding: "16px",
              background: "rgba(0,0,0,0.4)",
              border: "1px solid " + COLORS.border, borderRadius: "0 0 8px 8px",
              maxHeight: 500, overflowY: "auto",
              whiteSpace: "pre-wrap", wordBreak: "break-word",
            }}>
              {artifactCode}
              {isGenerating && <span style={{ animation: "blink 1s infinite", color: stage.color }}>{"\u258C"}</span>}
            </pre>
          ) : (
            <div style={{
              border: "1px solid " + COLORS.border, borderRadius: "0 0 8px 8px",
              overflow: "hidden", background: "#1a1a2e",
            }}>
              {renderedSrc ? (
                <iframe
                  srcDoc={renderedSrc}
                  sandbox="allow-scripts"
                  style={{
                    width: "100%", height: 500, border: "none",
                    background: "#1a1a2e",
                  }}
                />
              ) : (
                <div style={{
                  height: 500, display: "flex", alignItems: "center", justifyContent: "center",
                  flexDirection: "column", gap: 12,
                }}>
                  <div style={{
                    fontFamily: FONTS.mono, fontSize: 13, color: stage.color,
                    animation: "pulse 1.5s infinite",
                  }}>Generating artifact...</div>
                  <div style={{
                    fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
                  }}>{artifactCode.length} characters so far</div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      <div style={{
        padding: "14px 18px", borderRadius: 8,
        background: stage.color + "08",
        border: "1px solid " + stage.color + "15",
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8,
        }}>Reflection</div>
        <div style={{
          fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
          lineHeight: 1.7, opacity: 0.85,
        }}>
          Notice that the quality of the artifact depends heavily on the quality of your description.
          This is prompt craft applied to making, not just asking. Consider: when you describe an artifact,
          what kind of speech act are you performing? Is it a request, a command, a creative commission?
          And what does it mean that a language model -- a system trained on text -- can produce working
          interactive objects?
        </div>
      </div>
    </div>
  );
}
