      { id: "critic", name: "Critic Osei", description: "A theatre critic invited to observe the rehearsal process for a feature article. You are watching the collision between human creativity and machine fluency with professional detachment -- or trying to. You ask pointed questions and will review the entire process.", color: "#8AAE7F" },
    ],
    openingLine: "I have prepared three versions of the Act Two confrontation scene. Version A follows classical dramatic structure. Version B uses the fragmented style you responded to in workshop. Version C is something I am less certain about -- I tried to write it 'wrong' on purpose, since you said my work was too polished. I am not sure I succeeded. What does it mean to write badly on purpose?",
  },
];

// Lookup helper for URL-based scenario selection
function getScenarioById(id) {
  for (var i = 0; i < ROLEPLAY_SCENARIOS.length; i++) {
    if (ROLEPLAY_SCENARIOS[i].id === id) return ROLEPLAY_SCENARIOS[i];
  }
  return null;
}

//
// Room sync hook -- enables multi-device play across separate screens.
// Room endpoints are same-origin (served by serve-lan.js alongside the page).
// Falls back to local-only mode if the endpoints return 404.
//

// Room API uses same-origin (serve-lan.js handles both static files and room sync)
var ROOM_API_BASE = "";

function useRoomSync(roomId, scenarioId) {
  var [roomMessages, setRoomMessages] = useState([]);
  var [connected, setConnected] = useState(false);
  var [mode, setMode] = useState("checking"); // "checking" | "local" | "networked"
  var lastIdRef = useRef(0);
  var pollRef = useRef(null);

  useEffect(function() {
    if (!roomId) {
      setMode("local");
      return;
    }

    setMode("checking");

    // Probe the room endpoint to see if the backend supports it
    fetch(ROOM_API_BASE + "/api/workshop/roleplay/poll?roomId=" + encodeURIComponent(roomId) + "&scenarioId=" + encodeURIComponent(scenarioId || "") + "&after=0")
      .then(function(r) {
        if (r.ok) return r.json();
        throw new Error("not available");
      })
      .then(function(data) {
        setMode("networked");
        setConnected(true);
        if (data && data.messages && data.messages.length > 0) {
          setRoomMessages(data.messages);
          lastIdRef.current = data.lastId || 0;
        }
        // Start polling every 2s
        pollRef.current = setInterval(function() {
          fetch(ROOM_API_BASE + "/api/workshop/roleplay/poll?roomId=" + encodeURIComponent(roomId) + "&after=" + lastIdRef.current)
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(d) {
              if (d && d.messages && d.messages.length > 0) {
                lastIdRef.current = d.lastId || lastIdRef.current;
                setRoomMessages(function(prev) { return prev.concat(d.messages); });
              }
            })
            .catch(function() { /* keep polling */ });
        }, 2000);
      })
      .catch(function() {
        setMode("local");
        setConnected(false);
      });

    return function() {
      if (pollRef.current) clearInterval(pollRef.current);
    };
  }, [roomId, scenarioId]);

  var postToRoom = useCallback(function(newMessages) {
    if (mode !== "networked" || !roomId) return Promise.resolve(false);
    return fetch(ROOM_API_BASE + "/api/workshop/roleplay/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: roomId, scenarioId: scenarioId, messages: newMessages }),
    }).then(function() { return true; }).catch(function() { return false; });
  }, [mode, roomId, scenarioId]);

  return {
    roomMessages: roomMessages,
    connected: connected,
    mode: mode,
    postToRoom: postToRoom,
  };
}


function RoleplayPlayground({ stageIndex, dispatch }) {
  var stage = STAGES[stageIndex];
  var [phase, setPhase] = useState("lobby");
  var [selectedScenario, setSelectedScenario] = useState(null);
  var [selectedRole, setSelectedRole] = useState(null);
  var [activeRole, setActiveRole] = useState(null);
  var [roomCode, setRoomCode] = useState("");
  var [roomStatus, setRoomStatus] = useState(""); // "" | "checking" | "found" | "new" | "error"
  var [customSystemPrompt, setCustomSystemPrompt] = useState(null); // null = use default
  var [showPromptEditor, setShowPromptEditor] = useState(false);
  var [artifactText, setArtifactText] = useState(""); // generated artifact
  var [artifactGenerating, setArtifactGenerating] = useState(false);
  var [showArtifact, setShowArtifact] = useState(false);
  var [messages, setMessages] = useState([]);
  var [isStreaming, setIsStreaming] = useState(false);
  var [input, setInput] = useState("");
  var [error, setError] = useState(null);
  var [roomActivity, setRoomActivity] = useState({}); // { [roomId]: {msgCount, scenarioId} }
  var [autoVoiceSilent, setAutoVoiceSilent] = useState(false);
  var autoVoiceInFlight = useRef(false);
  var scrollRef = useRef(null);

  // When in the lobby, pull current room activity so the cards can show "N msgs"
  useEffect(function() {
    if (phase !== "lobby") return;
    var cancelled = false;
    var fetchActivity = function() {
      fetch(ROOM_API_BASE + "/api/workshop/roleplay/rooms")
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (cancelled || !data || !data.rooms) return;
          var map = {};
          data.rooms.forEach(function(room) {
            map[room.roomId] = { msgCount: room.messageCount || 0, scenarioId: room.scenarioId };
          });
          setRoomActivity(map);
        })
        .catch(function() {});
    };
    fetchActivity();
    var id = setInterval(fetchActivity, 5000);
    return function() { cancelled = true; clearInterval(id); };
  }, [phase]);

  // Room sync for multi-device mode
  var room = useRoomSync(
    phase === "chat" ? roomCode : "",
    selectedScenario ? selectedScenario.id : ""
  );

  // Merge remote messages into local state, skipping ones we posted ourselves
  var lastMergedRef = useRef(0);
  var pendingSkipRef = useRef(0); // messages we posted that will echo back from poll
  useEffect(function() {
    if (room.mode !== "networked") return;
    if (room.roomMessages.length <= lastMergedRef.current) return;
    var newMsgs = room.roomMessages.slice(lastMergedRef.current);
    lastMergedRef.current = room.roomMessages.length;
    // Skip messages that we already added locally (posted by this client)
    if (pendingSkipRef.current > 0) {
      var skip = Math.min(pendingSkipRef.current, newMsgs.length);
      newMsgs = newMsgs.slice(skip);
      pendingSkipRef.current -= skip;
    }
    if (newMsgs.length > 0) {
      setMessages(function(prev) { return prev.concat(newMsgs); });
    }
  }, [room.roomMessages, room.mode]);

  useEffect(function() {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  // Read scenario + room from URL hash on mount, and respond to hashchange.
  // If the hash changes to a different scenario/room while a scene is mounted,
  // exit to the lobby so the new scenario is re-entered cleanly.
  var applyHashParams = useCallback(function() {
    var hash = window.location.hash.slice(1);
    if (!hash) return;
    var params = {};
    hash.split("&").forEach(function(pair) {
      var parts = pair.split("=");
      if (parts.length === 2) params[parts[0]] = decodeURIComponent(parts[1]);
    });
    var newScenario = params.scenario ? getScenarioById(params.scenario) : null;
    var newRoom = params.room || null;
    var scenarioChanged = newScenario && (!selectedScenario || selectedScenario.id !== newScenario.id);
    var roomChanged = newRoom && newRoom !== roomCode;
    if (phase === "chat" && (scenarioChanged || roomChanged)) {
      // Clean exit to lobby; don't clear the hash — we're about to apply it.
      setPhase("lobby");
      setMessages([]);
      setInput("");
      setError(null);
      setIsStreaming(false);
      setCustomSystemPrompt(null);
      setShowPromptEditor(false);
      setArtifactText("");
      setShowArtifact(false);
      setArtifactGenerating(false);
      lastMergedRef.current = 0;
      pendingSkipRef.current = 0;
      setSelectedRole(null);
      setActiveRole(null);
    }
    if (newScenario) setSelectedScenario(newScenario);
    if (newRoom) {
      setRoomCode(newRoom);
      probeRoom(newRoom);
    }
  }, [phase, selectedScenario, roomCode]);

  useEffect(function() {
    applyHashParams();
    window.addEventListener("hashchange", applyHashParams);
    return function() { window.removeEventListener("hashchange", applyHashParams); };
  }, [applyHashParams]);

  var probeRoom = function(code) {
    if (!code) return;
    setRoomStatus("checking");
    fetch(ROOM_API_BASE + "/api/workshop/roleplay/poll?roomId=" + encodeURIComponent(code) + "&after=0")
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (!data) { setRoomStatus("error"); return; }
        if (data.messages && data.messages.length > 0) {
          setRoomStatus("found");
          // Try to detect scenario from the room's messages or endpoint
          fetch(ROOM_API_BASE + "/api/workshop/roleplay/rooms")
            .then(function(r) { return r.json(); })
            .then(function(roomsData) {
              if (roomsData && roomsData.rooms) {
                var match = roomsData.rooms.filter(function(r) { return r.roomId === code; })[0];
                if (match && match.scenarioId) {
                  var sc = getScenarioById(match.scenarioId);
                  if (sc) setSelectedScenario(sc);
                }
              }
            }).catch(function() {});
        } else {
          setRoomStatus("new");
        }
      })
      .catch(function() { setRoomStatus("error"); });
  };

  var enterScene = function() {
    if (!selectedScenario || !selectedRole) return;
    setPhase("chat");
    setActiveRole(selectedRole);
    // Update URL hash so the link can be shared
    var hashParts = ["scenario=" + selectedScenario.id];
    if (roomCode) hashParts.push("room=" + encodeURIComponent(roomCode));
    window.location.hash = hashParts.join("&");
    // Claude's opening line
    var openingMsg = {
      sender: "claude",
      name: selectedScenario.claudeRole.name,
      text: selectedScenario.openingLine,
      color: selectedScenario.claudeRole.color,
      streaming: false,
    };
    setMessages([openingMsg]);
  };

  var buildSystemPrompt = function() {
    var sc = selectedScenario;
    var lines = [
      "You are playing the role of " + sc.claudeRole.name + " in a dramatic roleplay scenario.",
      "",
      "SCENARIO: " + sc.title + " (" + sc.year + ")",
      "SETTING: " + sc.setting,
      "",
      "DRAMATIC OBJECTIVE: " + (sc.objective || "Engage the situation through dialogue."),
      "This objective gives the conversation a shape. Your utterances should DO something -- move the scene toward resolution, reveal stakes, force a choice. Words are performative here. They change what happens next.",
      "",
      "YOUR ROLE: " + sc.claudeRole.name + " -- " + sc.claudeRole.description,
      "",
      "OTHER PARTICIPANTS:",
    ];
    sc.humanRoles.forEach(function(r) {
      lines.push("- " + r.name + ": " + r.description);
    });
    lines.push("");
    lines.push("RULES:");
    lines.push("- Stay in character at all times. Never break the fourth wall.");
    lines.push("- You are in a multi-party scene. You are not obliged to reply only to the most recent speaker.");
    lines.push("- Address whichever participants the dramatic context demands. You may turn to one person, then another, in the same response. You may ask one character a question while rebuking another.");
    lines.push("- Use names explicitly when you shift addressee (\"But Margaret -- you said you felt understood. Senator, with respect, that is exactly the question.\").");
    lines.push("- Notice silences. If someone has not spoken, you may draw them in directly.");
    lines.push("- Keep responses to 2-5 sentences. This is dialogue, not monologue.");
    lines.push("- React emotionally and substantively. Advance the dramatic tension.");
    lines.push("- Speak as your character. Do not narrate plot events (no \"Socrates walks to the window\"). Short first-person stage beats in asterisks are allowed as dramatic texture -- e.g., *pauses*, *leans forward*, *for the first time, does not answer immediately*. Use them sparingly, at most one per reply, and only when a beat of silence or physical posture is dramatically load-bearing.");
    return lines.join("\n");
  };

  var buildConversationPrompt = function(newMessage, role) {
    var transcript = "";
    messages.forEach(function(msg) {
      if (msg.sender === "claude") {
        transcript += selectedScenario.claudeRole.name + ": " + msg.text + "\n\n";
      } else {
        transcript += msg.name + ": " + msg.text + "\n\n";
      }
    });
    transcript += role.name + ": " + newMessage + "\n\n";
    transcript += "---\nRespond as " + selectedScenario.claudeRole.name + ". Stay in character. 2-4 sentences.";
    return transcript;
  };

  var sendMessage = function() {
    if (!input.trim() || isStreaming || !activeRole) return;
    var text = input.trim();
    var role = activeRole;
    setInput("");
    setIsStreaming(true);
    setError(null);

    var userMsg = {
      sender: "user", name: role.name, text: text,
      color: role.color, streaming: false,
      deviceId: MY_DEVICE_ID,
    };
    var claudePlaceholder = {
      sender: "claude", name: selectedScenario.claudeRole.name,
      text: "", color: selectedScenario.claudeRole.color, streaming: true,
    };

    setMessages(function(prev) { return [...prev, userMsg, claudePlaceholder]; });

    var systemPrompt = customSystemPrompt != null ? customSystemPrompt : buildSystemPrompt();
    var prompt = buildConversationPrompt(text, role);
    var finalClaudeText = "";
    var finalized = false;

    // Finalize once — both SSE data.done and reader EOF can fire; only run once.
    function finalize() {
      if (finalized) return;
      finalized = true;
      setMessages(function(prev) {
        var updated = [...prev];
        var last = updated[updated.length - 1];
        if (last && last.sender === "claude") {
          updated[updated.length - 1] = { ...last, streaming: false };
        }
        return updated;
      });
      setIsStreaming(false);
      if (room.mode === "networked") {
        pendingSkipRef.current += 2;
        room.postToRoom([
          userMsg,
          { sender: "claude", name: selectedScenario.claudeRole.name, text: finalClaudeText, color: selectedScenario.claudeRole.color, streaming: false },
        ]);
      }
    }

    fetch(API_BASE + "/api/workshop/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt,
        systemPrompt: systemPrompt,
        model: "opus",
        context: { stage: "dramatic-roleplay", scenario: selectedScenario.id, room: roomCode || null },
      }),
    }).then(function(response) {
      if (!response.ok) throw new Error("API error: " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            finalize();
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line.startsWith("data: ")) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.chunk) {
                finalClaudeText += data.chunk;
                var captured = finalClaudeText;
                setMessages(function(prev) {
                  var updated = [...prev];
                  var last = updated[updated.length - 1];
                  if (last && last.sender === "claude") {
                    updated[updated.length - 1] = { ...last, text: captured };
                  }
                  return updated;
                });
              }
              if (data.done) finalize();
            } catch (e) { /* skip invalid JSON */ }
          }
          read();
        }).catch(function(err) {
          setError(err.message);
          setIsStreaming(false);
        });
      }
      read();
    }).catch(function(err) {
      setError(err.message);
      setIsStreaming(false);
    });
  };

  var resetScene = function() {
    setPhase("lobby");
    setMessages([]);
    setInput("");
    setError(null);
    setIsStreaming(false);
    setCustomSystemPrompt(null);
    setShowPromptEditor(false);
    setArtifactText("");
    setShowArtifact(false);
    setArtifactGenerating(false);
    lastMergedRef.current = 0;
    pendingSkipRef.current = 0;
    window.location.hash = "";
  };

  // Ask Claude to voice a silent human character briefly, when the instructor
  // has enabled the toggle. The voiced line gets a clearly different sender
  // tag ("auto-voice") and is rendered with visual distinction.
  var voiceSilentCharacter = function(role) {
    if (!selectedScenario || !role || isStreaming || autoVoiceInFlight.current) return;
    autoVoiceInFlight.current = true;
    var others = selectedScenario.humanRoles.filter(function(r) { return r.id !== role.id; });
    var systemLines = [
      "You are ghost-writing ONE short line for a silent human character in a dramatic roleplay.",
      "",
      "SCENE: " + selectedScenario.setting,
      "",
      "YOU ARE VOICING: " + role.name + " -- " + role.description,
      "",
      "OTHER CHARACTERS IN THE SCENE:",
      "- " + selectedScenario.claudeRole.name + " (AI interlocutor): " + selectedScenario.claudeRole.description,
    ];
    others.forEach(function(r) { systemLines.push("- " + r.name + ": " + r.description); });
    systemLines.push("");
    systemLines.push("INSTRUCTIONS:");
    systemLines.push("- Output ONE to TWO sentences maximum. This is a brief interjection, not a full turn.");
    systemLines.push("- Speak as " + role.name + " in first person.");
    systemLines.push("- Do NOT narrate plot. Short italicised stage beats in asterisks are allowed (at most one).");
    systemLines.push("- React to what was JUST said. Advance the tension or open a new angle.");
    systemLines.push("- This is an ensemble scene -- you may address any character by name.");
    var system = systemLines.join("\n");
    var transcript = "Scene: " + selectedScenario.title + "\n\n";
    messages.forEach(function(m) {
      var speaker = m.sender === "claude" ? selectedScenario.claudeRole.name : m.name;
      transcript += speaker + ": " + m.text + "\n\n";
    });
    transcript += "---\nNow voice " + role.name + "'s next line. 1-2 sentences.";
    var replyText = "";
    var finalized = false;
    fetch(API_BASE + "/api/workshop/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: transcript,
        systemPrompt: system,
        model: "sonnet",
        context: { stage: "dramatic-roleplay", scenario: selectedScenario.id, autoVoice: role.id },
      }),
    }).then(function(response) {
      if (!response.ok) throw new Error("auto-voice failed: " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      function done() {
        if (finalized) return;
        finalized = true;
        autoVoiceInFlight.current = false;
        if (!replyText.trim()) return;
        var voiced = {
          sender: "auto-voice", name: role.name, text: replyText.trim(),
          color: role.color, streaming: false, deviceId: "ai-voice",
        };
        setMessages(function(prev) { return prev.concat([voiced]); });
        if (room.mode === "networked") {
          pendingSkipRef.current += 1;
          room.postToRoom([voiced]);
        }
      }
      function read() {
        reader.read().then(function(result) {
          if (result.done) { done(); return; }
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line.startsWith("data: ")) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.chunk) replyText += data.chunk;
              if (data.done) done();
            } catch (e) { /* skip */ }
          }
          if (!finalized) read();
        }).catch(function() { autoVoiceInFlight.current = false; });
      }
      read();
    }).catch(function() { autoVoiceInFlight.current = false; });
  };

  // Trigger auto-voice on each new Claude reply when toggle is on.
  useEffect(function() {
    if (!autoVoiceSilent || phase !== "chat") return;
    if (isStreaming || autoVoiceInFlight.current) return;
    if (!selectedScenario || messages.length < 2) return;
    var last = messages[messages.length - 1];
    if (!last || last.sender !== "claude" || last.streaming) return;
    // Find human roles that haven't spoken in the last 6 messages.
    var recent = messages.slice(-6);
    var spoken = new Set();
    recent.forEach(function(m) {
      if (m.sender === "user" || m.sender === "auto-voice") spoken.add(m.name);
    });
    var silent = selectedScenario.humanRoles.filter(function(r) {
      if (activeRole && r.id === activeRole.id) return false;
      return !spoken.has(r.name);
    });
    if (silent.length === 0) return;
    // Pick the first silent role; next turn rotates as others fill the "recent" window.
    voiceSilentCharacter(silent[0]);
  }, [messages, autoVoiceSilent, isStreaming, phase, selectedScenario, activeRole]);

  var restartScene = function() {
    if (isStreaming) return;
    // Confirm if the scene has real content — restart is destructive for everyone in the room.
    var networked = room.mode === "networked" && roomCode;
    if (messages.length > 1) {
      var msg = networked
        ? "Restart this scene? This clears the conversation for everyone in room " + roomCode + "."
        : "Restart this scene? This clears the conversation.";
      if (!window.confirm(msg)) return;
    }
    // Clear local state and re-show the opening line
    var openingMsg = {
      sender: "claude",
      name: selectedScenario.claudeRole.name,
      text: selectedScenario.openingLine,
      color: selectedScenario.claudeRole.color,
      streaming: false,
    };
    setMessages([openingMsg]);
    setInput("");
    setError(null);
    setArtifactText("");
    setShowArtifact(false);
    // In networked mode, clear the room on the server too
    if (room.mode === "networked" && roomCode) {
      fetch(ROOM_API_BASE + "/api/workshop/roleplay/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId: roomCode }),
      }).catch(function() { /* best-effort */ });
    }
    // Sync local merge refs to the current room state so we don't replay old messages
    lastMergedRef.current = room.roomMessages.length;
    pendingSkipRef.current = 0;
  };

  var buildArtifact = function() {
    if (artifactGenerating) return;
    if (!selectedScenario || !selectedScenario.artifact) return;
    if (messages.length < 2) return; // need at least one exchange

    setArtifactGenerating(true);
    setArtifactText("");
    setShowArtifact(true);
    setError(null);

    // Build the full transcript
    var transcript = "";
    messages.forEach(function(msg) {
      var who = msg.sender === "claude" ? selectedScenario.claudeRole.name : msg.name;
      transcript += who + ": " + msg.text + "\n\n";
    });

    var artifactPrompt = "=== SCENE TRANSCRIPT ===\n\n" + transcript +
      "=== END TRANSCRIPT ===\n\n" +
      selectedScenario.artifact.promptTemplate;

    var artifactSystemPrompt = "You are a skilled writer producing a final artifact from a completed dramatic roleplay scene. Read the transcript carefully. Produce the requested artifact in the format specified. Do not explain -- just produce the artifact itself, formatted for direct presentation. Use plain text (or lightly structured text with simple headings). No markdown fences.";

    var fullText = "";
    fetch(API_BASE + "/api/workshop/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: artifactPrompt,
        systemPrompt: artifactSystemPrompt,
        model: "opus",
        context: { stage: "dramatic-roleplay", scenario: selectedScenario.id, artifact: true },
      }),
    }).then(function(response) {
      if (!response.ok) throw new Error("API error: " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            setArtifactGenerating(false);
            return;
          }
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line.startsWith("data: ")) continue;
            try {
              var data = JSON.parse(line.slice(6));
              if (data.chunk) {
                fullText += data.chunk;
                setArtifactText(fullText);
              }
              if (data.done) setArtifactGenerating(false);
            } catch (e) { /* skip */ }
          }
          read();
        }).catch(function(err) {
          setError("Artifact generation failed: " + err.message);
          setArtifactGenerating(false);
        });
      }
      read();
    }).catch(function(err) {
      setError("Artifact generation failed: " + err.message);
      setArtifactGenerating(false);
    });
  };

  // ---- LOBBY PHASE ----
  if (phase === "lobby") {
    return (
      <div style={{ animation: "fadeInUp 0.5s ease" }}>
        <h2 style={{
          fontFamily: FONTS.heading, fontSize: 24, color: COLORS.text, marginBottom: 8,
        }}>Dramatic Roleplay</h2>
        <p style={{
          fontFamily: FONTS.body, fontSize: 14, color: COLORS.textDim,
          marginBottom: 20, lineHeight: 1.6,
        }}>
          Pick your breakout room below. Each room has a different scenario.
          Claude plays one role; your group plays the others. On separate devices,
          everyone in the same numbered room sees the same conversation in real time.
        </p>

        {/* Three-step guide */}
        <div style={{
          display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap",
        }}>
          {["1. Pick your room", "2. Pick your character", "3. Enter the scene"].map(function(step, i) {
            return (
              <div key={i} style={{
                flex: "1 1 200px",
                padding: "8px 12px", borderRadius: 6,
                background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
                fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
              }}>{step}</div>
            );
          })}
        </div>

        {/* Room cards header */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "baseline",
          marginBottom: 12,
        }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
            textTransform: "uppercase", letterSpacing: "0.08em",
          }}>Breakout rooms (9)</div>
          {roomCode && (
            <div style={{
              fontFamily: FONTS.mono, fontSize: 10,
              color: roomStatus === "found" ? "#5BB8A6" : roomStatus === "new" ? "#E0A458" : roomStatus === "checking" ? COLORS.textDim : roomStatus === "error" ? "#FF6B6B" : COLORS.textDim,
            }}>
              {roomCode} {roomStatus === "checking" ? "· connecting..." :
               roomStatus === "found" ? "· room active" :
               roomStatus === "new" ? "· new room" :
               roomStatus === "error" ? "· server offline" : ""}
            </div>
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
          {ROLEPLAY_SCENARIOS.map(function(sc, scIdx) {
            var selected = selectedScenario && selectedScenario.id === sc.id;
            var defaultRoomCode = "room-" + (scIdx + 1);
            return (
              <div key={sc.id}
                onClick={function() {
                  setSelectedScenario(sc);
                  setSelectedRole(null);
                  // Auto-assign room code if none set or if it matches a previous default
                  if (!roomCode || /^room-\d+$/.test(roomCode)) {
                    setRoomCode(defaultRoomCode);
                    probeRoom(defaultRoomCode);
                  }
                }}
                style={{
                  padding: "16px 20px", borderRadius: 8, cursor: "pointer",
                  background: selected ? sc.claudeRole.color + "12" : COLORS.bgPanel,
                  border: "1px solid " + (selected ? sc.claudeRole.color + "40" : COLORS.border),
                  transition: "all 0.2s",
                }}
              >
                <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
                  <span style={{
                    fontFamily: FONTS.mono, fontSize: 11, fontWeight: 600,
                    color: sc.claudeRole.color, letterSpacing: "0.04em",
                    padding: "2px 8px", borderRadius: 4,
                    background: sc.claudeRole.color + "18",
                  }}>ROOM {scIdx + 1}</span>
                  <span style={{
                    fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
                  }}>{sc.year}</span>
                  <span style={{
                    fontFamily: FONTS.heading, fontSize: 18, fontWeight: 600, color: COLORS.text,
                  }}>{sc.title}</span>
                  <span style={{
                    fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
                  }}>{sc.humanRoles.length} roles</span>
                  {(function() {
                    var activity = roomActivity[defaultRoomCode];
                    if (!activity || !activity.msgCount) return null;
                    return (
                      <span style={{
                        fontFamily: FONTS.mono, fontSize: 10,
                        color: sc.claudeRole.color,
                        padding: "2px 6px", borderRadius: 3,
                        background: sc.claudeRole.color + "12",
                        border: "1px solid " + sc.claudeRole.color + "30",
                      }}>{activity.msgCount} msg{activity.msgCount === 1 ? "" : "s"} in progress</span>
                    );
                  })()}
                </div>
                <p style={{
                  fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
                  lineHeight: 1.5, marginBottom: selected ? 12 : 0,
                }}>{sc.description}</p>

                {selected && (
                  <div style={{ animation: "fadeInUp 0.3s ease" }}>
                    <div style={{
                      fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                      fontStyle: "italic", marginBottom: 12, opacity: 0.7,
                    }}>{sc.setting}</div>

                    {/* Objective pill */}
                    {sc.objective && (
                      <div style={{
                        padding: "10px 14px", borderRadius: 6, marginBottom: 12,
                        background: "rgba(0,0,0,0.25)",
                        border: "1px solid " + COLORS.border,
                      }}>
                        <div style={{
                          fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
                          textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4,
                        }}>What the dialogue must do</div>
                        <div style={{
                          fontFamily: FONTS.body, fontSize: 12, color: COLORS.text,
                          lineHeight: 1.5,
                        }}>{sc.objective}</div>
                      </div>
                    )}

                    {/* Artifact preview */}
                    {sc.artifact && (
                      <div style={{
                        padding: "8px 14px", borderRadius: 6, marginBottom: 12,
                        background: sc.claudeRole.color + "08",
                        border: "1px dashed " + sc.claudeRole.color + "30",
                      }}>
                        <div style={{
                          fontFamily: FONTS.mono, fontSize: 10, color: sc.claudeRole.color,
                          textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 2,
                        }}>Produces</div>
                        <div style={{
                          fontFamily: FONTS.body, fontSize: 12, color: COLORS.text,
                          lineHeight: 1.5,
                        }}>{sc.artifact.description}</div>
                      </div>
                    )}

                    {/* Claude's role */}
                    <div style={{
                      padding: "10px 14px", borderRadius: 6, marginBottom: 12,
                      background: sc.claudeRole.color + "15",
                      border: "1px solid " + sc.claudeRole.color + "25",
                    }}>
                      <div style={{
                        fontFamily: FONTS.mono, fontSize: 11, color: sc.claudeRole.color,
                        textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4,
                      }}>Claude plays</div>
                      <div style={{
                        fontFamily: FONTS.heading, fontSize: 15, fontWeight: 600, color: COLORS.text,
                      }}>{sc.claudeRole.name}</div>
                      <div style={{
                        fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim, marginTop: 4,
                        lineHeight: 1.5,
                      }}>{sc.claudeRole.description.split(".").slice(0, 2).join(".") + "."}</div>
                    </div>

                    {/* Human roles */}
                    <div style={{
                      fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
                      textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8,
                    }}>Choose your role</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {sc.humanRoles.map(function(role) {
                        var roleSelected = selectedRole && selectedRole.id === role.id;
                        return (
                          <div key={role.id}
                            onClick={function(e) { e.stopPropagation(); setSelectedRole(role); }}
                            style={{
                              padding: "10px 14px", borderRadius: 6, cursor: "pointer",
                              background: roleSelected ? role.color + "15" : "rgba(0,0,0,0.2)",
                              border: "1px solid " + (roleSelected ? role.color + "40" : COLORS.border),
                              transition: "all 0.2s",
                            }}
                          >
                            <div style={{
                              fontFamily: FONTS.heading, fontSize: 14, fontWeight: 500,
                              color: roleSelected ? role.color : COLORS.text,
                            }}>{role.name}</div>
                            <div style={{
                              fontFamily: FONTS.body, fontSize: 12, color: COLORS.textDim,
                              marginTop: 2, lineHeight: 1.4,
                            }}>{role.description}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Enter button */}
        {selectedScenario && selectedRole && (
          <button onClick={enterScene} style={{
            fontFamily: FONTS.mono, fontSize: 13, padding: "14px 28px",
            borderRadius: 8, cursor: "pointer", width: "100%",
            background: stage.color + "25",
            border: "1px solid " + stage.color + "50",
            color: stage.color,
            animation: "fadeInUp 0.3s ease",
          }}>
            Enter {roomCode ? roomCode.toUpperCase() : "SCENE"} as {selectedRole.name} {"\u2192"}
          </button>
        )}

        {/* Advanced: custom room code */}
        <details style={{ marginTop: 24 }}>
          <summary style={{
            fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
            textTransform: "uppercase", letterSpacing: "0.06em", cursor: "pointer",
            padding: "6px 0",
          }}>Advanced: custom room code</summary>
          <div style={{
            display: "flex", alignItems: "center", gap: 12, marginTop: 8,
            padding: "10px 14px", borderRadius: 6,
            background: COLORS.bgPanel, border: "1px solid " + COLORS.border,
          }}>
            <input
              type="text"
              value={roomCode}
              onChange={function(e) {
                setRoomCode(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ""));
                setRoomStatus("");
              }}
              onKeyDown={function(e) {
                if (e.key === "Enter" && roomCode.trim()) {
                  e.preventDefault();
                  probeRoom(roomCode.trim());
                }
              }}
              placeholder="Override room code (e.g. team-alpha)"
              style={{
                fontFamily: FONTS.mono, fontSize: 13, flex: 1,
                background: "rgba(0,0,0,0.3)", border: "1px solid " + COLORS.border,
                borderRadius: 4, padding: "6px 10px", color: COLORS.text,
                outline: "none",
              }}
            />
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim }}>
              Hit Enter to probe
            </div>
          </div>
        </details>
      </div>
    );
  }

  // ---- CHAT PHASE ----
  var connectionLabel = room.mode === "networked"
    ? (room.connected ? "Connected" : "Reconnecting...")
    : (roomCode ? "Local only (room API unavailable)" : "Shared screen");

  return (
    <div style={{ animation: "fadeInUp 0.5s ease" }}>
      {/* Scene header */}
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "flex-start",
        marginBottom: 12, gap: 12,
      }}>
        <div style={{ flex: 1 }}>
          <h2 style={{
            fontFamily: FONTS.heading, fontSize: 20, color: COLORS.text, marginBottom: 4,
          }}>{selectedScenario.title}</h2>
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.textDim,
            fontStyle: "italic",
          }}>{selectedScenario.setting}</div>
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          <button onClick={restartScene} disabled={isStreaming || messages.length <= 1}
            title="Clear the conversation and start the scene again"
            style={{
              fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px",
              borderRadius: 4, border: "1px solid " + COLORS.border,
              background: "transparent", color: COLORS.textDim,
              cursor: (isStreaming || messages.length <= 1) ? "default" : "pointer",
              opacity: (isStreaming || messages.length <= 1) ? 0.4 : 1,
            }}>Restart scene</button>
          <button onClick={resetScene}
            title="Return to the lobby"
            style={{
              fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px",
              borderRadius: 4, border: "1px solid " + COLORS.border,
              background: "transparent", color: COLORS.textDim, cursor: "pointer",
            }}>Exit to lobby</button>
        </div>
      </div>

      {/* Objective pill */}
      {selectedScenario.objective && (
        <div style={{
          marginBottom: 12, padding: "10px 14px", borderRadius: 8,
          background: selectedScenario.claudeRole.color + "10",
          border: "1px solid " + selectedScenario.claudeRole.color + "25",
        }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 10, color: selectedScenario.claudeRole.color,
            textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4,
          }}>Dramatic objective</div>
          <div style={{
            fontFamily: FONTS.body, fontSize: 13, color: COLORS.text, lineHeight: 1.55,
          }}>{selectedScenario.objective}</div>
        </div>
      )}

      {/* Connection + room status bar */}
      <div style={{
        display: "flex", alignItems: "center", gap: 8, marginBottom: 12,
        fontFamily: FONTS.mono, fontSize: 10,
      }}>
        <div style={{
          width: 6, height: 6, borderRadius: "50%",
          background: room.mode === "networked" ? "#5BB8A6" : COLORS.textDim,
        }} />
        <span style={{ color: COLORS.textDim }}>{connectionLabel}</span>
        {roomCode && <span style={{ color: COLORS.textDim, opacity: 0.5 }}>| {roomCode}</span>}
        <span style={{ color: COLORS.textDim, opacity: 0.5 }}>| {messages.length} messages</span>
      </div>

      {/* Role tabs */}
      <div style={{
        display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap",
        alignItems: "center",
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
          textTransform: "uppercase", letterSpacing: "0.06em", marginRight: 4,
        }}>Speaking as:</div>
        {selectedScenario.humanRoles.map(function(role) {
          var isActive = activeRole && activeRole.id === role.id;
          return (
            <button key={role.id}
              onClick={function() { setActiveRole(role); }}
              style={{
                fontFamily: FONTS.mono, fontSize: 11, padding: "5px 12px",
                borderRadius: 4, cursor: "pointer",
                background: isActive ? role.color + "20" : "transparent",
                border: "1px solid " + (isActive ? role.color + "40" : COLORS.border),
                color: isActive ? role.color : COLORS.textDim,
                transition: "all 0.2s",
              }}
            >{role.name}</button>
          );
        })}
        <div style={{
          fontFamily: FONTS.mono, fontSize: 11, padding: "5px 12px",
          borderRadius: 4,
          background: selectedScenario.claudeRole.color + "10",
          border: "1px solid " + selectedScenario.claudeRole.color + "20",
          color: selectedScenario.claudeRole.color, opacity: 0.6,
        }}>
          {selectedScenario.claudeRole.name} (Claude)
        </div>
      </div>

      {/* System prompt editor + instructor toggles */}
      <div style={{ marginBottom: 12, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <button
          onClick={function() { setShowPromptEditor(!showPromptEditor); }}
          style={{
            fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px",
            borderRadius: 4, border: "1px solid " + COLORS.border,
            background: showPromptEditor ? "rgba(255,255,255,0.06)" : "transparent",
            color: COLORS.textDim, cursor: "pointer",
            display: "inline-flex", alignItems: "center", gap: 6,
          }}
        >
          <span style={{ fontSize: 9 }}>{showPromptEditor ? "\u25BC" : "\u25B6"}</span>
          {showPromptEditor ? "Hide" : "Show"} system prompt
          {customSystemPrompt != null && (
            <span style={{ color: selectedScenario.claudeRole.color, marginLeft: 4 }}>(edited)</span>
          )}
        </button>
        <label style={{
          fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px",
          borderRadius: 4, border: "1px solid " + COLORS.border,
          background: autoVoiceSilent ? selectedScenario.claudeRole.color + "15" : "transparent",
          color: autoVoiceSilent ? selectedScenario.claudeRole.color : COLORS.textDim,
          cursor: "pointer",
          display: "inline-flex", alignItems: "center", gap: 6,
        }}>
          <input
            type="checkbox"
            checked={autoVoiceSilent}
            onChange={function(e) { setAutoVoiceSilent(e.target.checked); }}
            style={{ cursor: "pointer" }}
          />
          Auto-voice silent characters
        </label>
        {showPromptEditor && (
          <div style={{ marginTop: 8, animation: "fadeInUp 0.2s ease" }}>
            <div style={{
              fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
              marginBottom: 6, lineHeight: 1.5,
            }}>
              This is the system prompt sent to Claude each turn. Edit to change how the character behaves.
              Changes apply to the next message sent (not the conversation so far).
            </div>
            <textarea
              value={customSystemPrompt != null ? customSystemPrompt : buildSystemPrompt()}
              onChange={function(e) { setCustomSystemPrompt(e.target.value); }}
              rows={12}
              style={{
                width: "100%", fontFamily: FONTS.mono, fontSize: 12,
                background: "rgba(0,0,0,0.4)", border: "1px solid " + COLORS.border,
                borderRadius: 6, padding: "10px 12px", color: COLORS.text,
                resize: "vertical", outline: "none", lineHeight: 1.5,
                minHeight: 200,
              }}
            />
            <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
              <button
                onClick={function() { setCustomSystemPrompt(null); }}
                disabled={customSystemPrompt == null}
                style={{
                  fontFamily: FONTS.mono, fontSize: 11, padding: "4px 10px",
                  borderRadius: 4, border: "1px solid " + COLORS.border,
                  background: "transparent", color: COLORS.textDim,
                  cursor: customSystemPrompt == null ? "default" : "pointer",
                  opacity: customSystemPrompt == null ? 0.5 : 1,
                }}
              >Reset to scenario default</button>
              <div style={{
                fontFamily: FONTS.mono, fontSize: 10, color: COLORS.textDim,
                alignSelf: "center", opacity: 0.6,
              }}>
                {(customSystemPrompt != null ? customSystemPrompt : buildSystemPrompt()).length} chars
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Chat window — grows with content up to 60vh so the opener doesn't float in empty space */}
      <div style={{
        display: "flex", flexDirection: "column",
        background: "rgba(0,0,0,0.3)", border: "1px solid " + COLORS.border,
        borderRadius: 8, overflow: "hidden",
        minHeight: 220, maxHeight: "60vh",
      }}>
        <div ref={scrollRef} style={{
          flex: 1, overflowY: "auto", padding: "16px",
          display: "flex", flexDirection: "column", gap: 14,
        }}>
          {/* Scene marker */}
          <div style={{
            textAlign: "center", padding: "8px 0",
            fontFamily: FONTS.mono, fontSize: 11, color: COLORS.textDim,
            letterSpacing: "0.08em", textTransform: "uppercase",
          }}>
            {"\u2014"} Scene begins {"\u2014"}
          </div>

          {messages.map(function(msg, i) {
            var isClaude = msg.sender === "claude";
            var isAutoVoice = msg.sender === "auto-voice";
            return (
              <div key={i} style={{ animation: "fadeInUp 0.2s ease" }}>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 11,
                  color: msg.color || COLORS.textDim,
                  marginBottom: 4, fontWeight: 600,
                  textTransform: "uppercase", letterSpacing: "0.04em",
                  display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                }}>
                  <span>{msg.name}{isClaude ? " (Claude)" : ""}</span>
                  {isAutoVoice && (
                    <span style={{
                      fontSize: 9, fontWeight: 500, letterSpacing: "0.04em",
                      color: COLORS.textFaint, textTransform: "none",
                      padding: "1px 6px", borderRadius: 3,
                      border: "1px dashed " + (msg.color || COLORS.border) + "60",
                    }}>AI-voiced</span>
                  )}
                  {!isClaude && !isAutoVoice && msg.deviceId && msg.deviceId === MY_DEVICE_ID && (
                    <span style={{
                      fontSize: 9, fontWeight: 400, letterSpacing: "0.04em",
                      color: COLORS.textFaint, textTransform: "none",
                    }}>◆ this device</span>
                  )}
                  {!isClaude && !isAutoVoice && msg.deviceId && msg.deviceId !== MY_DEVICE_ID && (
                    <span style={{
                      fontSize: 9, fontWeight: 400, letterSpacing: "0.04em",
                      color: COLORS.textFaint, textTransform: "none",
                    }}>◇ remote</span>
                  )}
                </div>
                <div style={{
                  padding: "10px 14px", borderRadius: 8,
                  borderLeft: (isAutoVoice ? "3px dashed " : "3px solid ") + (msg.color || COLORS.border),
                  background: isClaude ? (msg.color + "08") : (isAutoVoice ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.04)"),
                  fontStyle: isAutoVoice ? "italic" : "normal",
                  fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
                  lineHeight: 1.65, whiteSpace: "pre-wrap", wordBreak: "break-word",
                }}>
                  {msg.text || (msg.streaming && (
                    <span style={{
                      fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim,
                      animation: "pulse 1.5s infinite",
                    }}>In character...</span>
                  ))}
                  {msg.text && msg.streaming && (
                    <span style={{ animation: "blink 1s infinite", color: msg.color }}>{"\u258C"}</span>
                  )}
                </div>
              </div>
            );
          })}

          {error && (
            <div style={{
              fontFamily: FONTS.mono, fontSize: 12, color: "#FF6B6B",
              padding: "8px 12px", background: "rgba(255,107,107,0.1)", borderRadius: 6,
            }}>{error}</div>
          )}
        </div>

        {/* Input area */}
        <div style={{ padding: "12px", borderTop: "1px solid " + COLORS.border }}>
          <div style={{
            fontFamily: FONTS.mono, fontSize: 11,
            color: activeRole ? activeRole.color : COLORS.textDim,
            marginBottom: 6,
          }}>
            {activeRole ? activeRole.name : "Select a role above"}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input
              type="text"
              value={input}
              onChange={function(e) { setInput(e.target.value); }}
              onKeyDown={function(e) {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
              }}
              placeholder={activeRole ? "Speak as " + activeRole.name + "..." : "Select a role first..."}
              disabled={!activeRole || isStreaming}
              style={{
                flex: 1, fontFamily: FONTS.body, fontSize: 14,
                background: "rgba(0,0,0,0.3)", border: "1px solid " + COLORS.border,
                borderRadius: 6, padding: "8px 12px", color: COLORS.text,
                outline: "none",
                opacity: (!activeRole || isStreaming) ? 0.5 : 1,
              }}
            />
            <button onClick={sendMessage}
              disabled={isStreaming || !activeRole || !input.trim()}
              style={{
                fontFamily: FONTS.mono, fontSize: 12, padding: "8px 16px",
                borderRadius: 6,
                cursor: (isStreaming || !activeRole) ? "default" : "pointer",
                background: (activeRole ? activeRole.color : stage.color) + "20",
                border: "1px solid " + (activeRole ? activeRole.color : stage.color) + "40",
                color: activeRole ? activeRole.color : stage.color,
                opacity: (isStreaming || !activeRole || !input.trim()) ? 0.5 : 1,
              }}
            >Send</button>
          </div>
        </div>
      </div>

      {/* Build artifact CTA — promotes itself once the scene has enough turns */}
      {selectedScenario.artifact && (() => {
        var sceneRipe = messages.length >= 8;
        var accent = selectedScenario.claudeRole.color;
        return (
        <div style={{
          marginTop: 16, padding: "14px 18px", borderRadius: 8,
          background: accent + (sceneRipe ? "18" : "08"),
          border: (sceneRipe ? "1px solid " : "1px dashed ") + accent + (sceneRipe ? "70" : "30"),
          transition: "all 0.3s ease",
        }}>
          <div style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            gap: 12, flexWrap: "wrap",
          }}>
            <div style={{ flex: 1, minWidth: 240 }}>
              <div style={{
                fontFamily: FONTS.mono, fontSize: 10, color: accent,
                textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4,
              }}>{sceneRipe ? "Scene complete? Draft the artifact" : "When the scene is done"}</div>
              <div style={{
                fontFamily: FONTS.body, fontSize: 13, color: COLORS.text, lineHeight: 1.5,
              }}>{selectedScenario.artifact.description}</div>
            </div>
            <button onClick={buildArtifact}
              disabled={artifactGenerating || messages.length < 2}
              style={{
                fontFamily: FONTS.mono, fontSize: 12, padding: "10px 18px",
                borderRadius: 6, cursor: (artifactGenerating || messages.length < 2) ? "default" : "pointer",
                background: accent + (sceneRipe ? "40" : "25"),
                border: "1px solid " + accent + (sceneRipe ? "80" : "50"),
                color: accent,
                opacity: (artifactGenerating || messages.length < 2) ? 0.5 : 1,
                whiteSpace: "nowrap",
                animation: (sceneRipe && !artifactGenerating && !artifactText) ? "pulse 2s ease-in-out infinite" : "none",
              }}>
              {artifactGenerating ? "Composing..." : (artifactText ? "Regenerate" : selectedScenario.artifact.label)}
            </button>
          </div>

          {/* Generated artifact display */}
          {showArtifact && (
            <div style={{ marginTop: 14, animation: "fadeInUp 0.3s ease" }}>
              <div style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                padding: "6px 12px", borderRadius: "6px 6px 0 0",
                background: "rgba(0,0,0,0.4)",
                border: "1px solid " + COLORS.border, borderBottom: "none",
              }}>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 11, color: selectedScenario.claudeRole.color,
                }}>
                  {artifactGenerating ? (
                    <span style={{ animation: "pulse 1s infinite" }}>Composing {selectedScenario.artifact.kind}...</span>
                  ) : (
                    selectedScenario.artifact.label
                  )}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  {artifactText && !artifactGenerating && (
                    <CopyButton text={artifactText} />
                  )}
                  <button onClick={function() { setShowArtifact(false); }} style={{
                    fontFamily: FONTS.mono, fontSize: 10, padding: "3px 8px",
                    borderRadius: 3, border: "1px solid " + COLORS.border,
                    background: "transparent", color: COLORS.textDim, cursor: "pointer",
                  }}>Hide</button>
                </div>
              </div>
              <pre style={{
                fontFamily: FONTS.body, fontSize: 13, color: COLORS.text,
                lineHeight: 1.65, padding: "14px 16px",
                background: "rgba(0,0,0,0.35)",
                border: "1px solid " + COLORS.border, borderRadius: "0 0 6px 6px",
                maxHeight: 500, overflowY: "auto",
                whiteSpace: "pre-wrap", wordBreak: "break-word",
                margin: 0,
              }}>
                {artifactText}
                {artifactGenerating && (
                  <span style={{ animation: "blink 1s infinite", color: selectedScenario.claudeRole.color }}>{"\u258C"}</span>
                )}
              </pre>
            </div>
          )}
        </div>
        );
      })()}

      {/* Reflection */}
      <div style={{
        marginTop: 20, padding: "14px 18px", borderRadius: 8,
        background: stage.color + "08",
        border: "1px solid " + stage.color + "15",
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: stage.color,
          textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8,
        }}>Reflection</div>
        <div style={{
          fontFamily: FONTS.body, fontSize: 14, color: COLORS.text,
          lineHeight: 1.7, opacity: 0.85,
        }}>
          Notice how the scenario changes depending on which role speaks next. Each participant's
          speech act reshapes the dramatic space. How does Claude's character respond differently
          to authority, emotion, and reason? What does this reveal about the model's training --
          and about our own assumptions about how different roles should behave?
        </div>
      </div>
    </div>
  );
}


// ============================================================
// MAIN CONTENT
// ============================================================

function MainContent({ currentStage, stageProgress, dispatch }) {
  var scrollRef = useRef(null);

  useEffect(function() {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, [currentStage]);

  var playgrounds = [SpeechActPlayground, ELIZAPlayground, RolesPlayground, CraftPlayground, ParrhesiaPlayground, RoleplayPlayground, ArtifactPlayground];
  var Playground = playgrounds[currentStage];

  return (
    <main ref={scrollRef} style={{
      flex: 1, overflowY: "auto", padding: "40px 48px", maxWidth: 820,
    }}>
      <StageIntro stageIndex={currentStage} />

      <div style={{
        borderTop: "1px solid " + COLORS.border,
        marginBottom: 32, paddingTop: 32,
      }}>
        <Playground
          stageIndex={currentStage}
          dispatch={dispatch}
          stageProgress={stageProgress[currentStage]}
        />
      </div>

      {/* Reading connections */}
      <div style={{
        marginTop: 40, padding: "20px 24px",
        background: "rgba(255,255,255,0.02)",
        border: "1px solid " + COLORS.border,
        borderRadius: 8,
      }}>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 12, color: COLORS.textDim,
          textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12,
        }}>Connected Readings</div>
        {currentStage === 0 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Austin, J. L.</strong> (1962). <em>How to Do Things with Words</em>. Focus on Lectures I-II (the performative/constative distinction) and Lectures VIII-IX (the locutionary/illocutionary/perlocutionary framework).</p>
            <p style={{ marginTop: 8 }}>Also see: <strong>Mollick & Mollick</strong> (2023) for how Austin's speech act theory maps onto prompt design -- every pedagogical prompt is an illocutionary act with specific felicity conditions.</p>
          </div>
        )}
        {currentStage === 1 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Weizenbaum, J.</strong> (1966). "ELIZA -- A Computer Program for the Study of Natural Language Communication." <em>Communications of the ACM</em>, 9(1), 36-45.</p>
            <p style={{ marginTop: 8 }}>Also: <strong>Magee, L.</strong> (2026). "Geist in the Machine" -- explores how the ELIZA effect scales dramatically with LLMs, where the simulation of understanding is far more convincing.</p>
          </div>
        )}
        {currentStage === 2 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Mollick, E. R., & Mollick, L.</strong> (2023). "Assigning AI: Seven Approaches for Students, with Prompts." SSRN.</p>
            <p style={{ marginTop: 8 }}>Also: <strong>Magee, L., Arora, V., Gollings, G., & Lam-Saw, N.</strong> (2024). "The Drama Machine" -- extends the idea of role-assignment into full character simulation with LLMs.</p>
          </div>
        )}
        {currentStage === 3 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Park, J., & Choo, S.</strong> (2025). "Generative AI Prompt Engineering for Educators." <em>Journal of Special Education Technology</em>.</p>
            <p style={{ marginTop: 8 }}>Also: <strong>Anthropic</strong> (2026). "Get started with Cowork" and <strong>Karpathy, A.</strong> (2026). "LLM Knowledge Bases" -- emerging approaches to using AI as a structured research partner.</p>
          </div>
        )}
        {currentStage === 4 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Foucault, M.</strong> (2020). <em>"Discourse and Truth" and "Parrhesia"</em>. University of Chicago Press. Focus on the definition of parrhesia and its conditions: sincerity, risk, and the asymmetry of power.</p>
            <p style={{ marginTop: 8 }}>Consider in relation to: <strong>Magee, L.</strong> (2026). "Geist in the Machine" -- on AI as performer of recognition and the limits of simulated dialogue.</p>
          </div>
        )}
        {currentStage === 5 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>Magee, L., Arora, V., Gollings, G., & Lam-Saw, N.</strong> (2024). "The Drama Machine: Simulating Character Development with LLM Agents." <em>Proceedings of ACSW 2024</em>.</p>
            <p style={{ marginTop: 8 }}>Also: <strong>Boal, A.</strong> (1979). <em>Theatre of the Oppressed</em> -- on participatory theatre as a mode of social inquiry, directly relevant to role-based AI interaction.</p>
          </div>
        )}
        {currentStage === 6 && (
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: COLORS.text, lineHeight: 1.7, opacity: 0.85 }}>
            <p><strong>McLuhan, M.</strong> (1964). <em>Understanding Media: The Extensions of Man</em>. The medium through which a message is delivered shapes how it is understood -- here, the artifact becomes the medium.</p>
            <p style={{ marginTop: 8 }}>Also: <strong>Anthropic</strong> (2025). "Introducing Claude Artifacts" -- the technical and design framework for generating self-contained interactive objects from conversational prompts.</p>
          </div>
        )}
      </div>

      {/* Stage navigation at bottom */}
      <div style={{
        display: "flex", justifyContent: "space-between",
        marginTop: 32, paddingTop: 16,
        borderTop: "1px solid " + COLORS.border,
      }}>
        {currentStage > 0 ? (
          <button onClick={function() { dispatch({ type: "NAVIGATE", stage: currentStage - 1 }); }}
            style={{
              fontFamily: FONTS.mono, fontSize: 12, padding: "10px 20px",
              borderRadius: 6, border: "1px solid " + COLORS.border,
              background: "transparent", color: COLORS.textDim, cursor: "pointer",
            }}
          >{"\u2190"} {STAGES[currentStage - 1].title}</button>
        ) : <div />}
        {currentStage < STAGES.length - 1 ? (
          <button onClick={function() { dispatch({ type: "NAVIGATE", stage: currentStage + 1 }); }}
            style={{
              fontFamily: FONTS.mono, fontSize: 12, padding: "10px 20px",
              borderRadius: 6, border: "1px solid " + STAGES[currentStage + 1].color + "40",
              background: STAGES[currentStage + 1].color + "15",
              color: STAGES[currentStage + 1].color, cursor: "pointer",
            }}
          >{STAGES[currentStage + 1].title} {"\u2192"}</button>
        ) : <div />}
      </div>

      <div style={{ height: 60 }} />
    </main>
  );
}


// ============================================================
// APP ROOT
// ============================================================

function App() {
  var [state, dispatch] = useReducer(reducer, initialState);
  var [isMobile, setIsMobile] = useState(false);

  useEffect(function() {
    var check = function() { setIsMobile(window.innerWidth < 768); };
    check();
    window.addEventListener("resize", check);
    return function() { window.removeEventListener("resize", check); };
  }, []);

  return (
    <div style={{
      display: "flex", flexDirection: isMobile ? "column" : "row",
      height: "100%", width: "100%", overflow: "hidden",
      color: COLORS.text,
    }}>
      {isMobile ? (
        <div style={{
          display: "flex", alignItems: "center", gap: 0,
          padding: "8px 12px", borderBottom: "1px solid " + COLORS.border,
          background: "rgba(0,0,0,0.3)", flexShrink: 0,
          overflowX: "auto",
        }}>
          {STAGES.map(function(stage, i) {
            return (
              <div key={i}
                onClick={function() { dispatch({ type: "NAVIGATE", stage: i }); }}
                style={{
                  flex: "0 0 auto", display: "flex", flexDirection: "column",
                  alignItems: "center", padding: "6px 10px", cursor: "pointer",
                }}
              >
                <div style={{
                  width: 10, height: 10, borderRadius: "50%",
                  background: state.currentStage === i ? stage.color + "60" : "transparent",
                  border: "2px solid " + stage.color,
                  boxShadow: state.currentStage === i ? "0 0 8px " + stage.color + "40" : "none",
                }} />
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 10,
                  color: state.currentStage === i ? stage.color : COLORS.textDim,
                  marginTop: 3, whiteSpace: "nowrap",
                }}>{stage.title}</div>
              </div>
            );
          })}
        </div>
      ) : (
        <StageNavigator
          currentStage={state.currentStage}
          stageProgress={state.stageProgress}
          dispatch={dispatch}
        />
      )}
      <MainContent
        currentStage={state.currentStage}
        stageProgress={state.stageProgress}
        dispatch={dispatch}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
